<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級隨機分組小幫手 - 大字版</title>
    <style>
        /* 基礎字體與背景 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f3f5;
            color: #333;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 18px; /* 基礎字體放大 */
        }
        .container {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            max-width: 1000px; /* 寬度增加以容納大字 */
            width: 100%;
        }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; font-size: 32px; }
        
        /* 名單輸入區 */
        .input-group {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }
        .text-area-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label { margin-bottom: 10px; font-weight: bold; color: #555; font-size: 20px; }
        textarea {
            height: 150px; /* 高度增加 */
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: none;
            font-size: 20px; /* 輸入字體放大 */
        }
        
        /* 功能按鈕區 */
        .btn-group {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px; /* 按鈕文字放大 */
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:active { transform: scale(0.95); }
        
        .btn-main { background-color: #5c7cfa; color: white; font-size: 22px; }
        .btn-main:hover { background-color: #4263eb; }
        .btn-secondary { background-color: #e3fafc; color: #0c8599; }
        .btn-clear { background-color: #fff5f5; color: #fa5252; }
        .btn-score-reset { background-color: #fff4e6; color: #d9480f; grid-column: span 4; margin-top: 5px; }

        /* 結果顯示區 */
        .result-title {
            margin-top: 30px;
            font-weight: bold;
            color: #2c3e50;
            border-left: 6px solid #5c7cfa;
            padding-left: 12px;
            font-size: 24px;
        }
        
        .result-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        .group-card {
            background: #f8f9fa;
            border: 3px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
        }
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .group-card h3 { margin: 0; color: #495057; font-size: 24px; }
        
        /* 分數控制 */
        .score-controls { display: flex; align-items: center; gap: 8px; }
        .btn-sm { padding: 4px 12px; font-size: 18px; border-radius: 6px; }
        .btn-plus { background-color: #40c057; color: white; }
        .btn-minus { background-color: #fa5252; color: white; }
        .group-score { font-weight: bold; color: #5c7cfa; font-size: 30px; min-width: 40px; text-align: center; }

        /* 學生清單 */
        .group-card ul { list-style: none; padding: 0; margin: 0; }
        .group-card li {
            padding: 10px 0;
            font-size: 22px; /* 名字字體放大 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #eee;
        }
        .student-info { display: flex; align-items: center; gap: 10px; }
        .individual-score { color: #fd7e14; font-weight: bold; margin-left: 10px; font-size: 22px; }

        .gender-tag { font-size: 14px; padding: 2px 6px; border-radius: 4px; color: white; }
        .boy { background-color: #74c0fc; }
        .girl { background-color: #faa2c1; }

        /* 歷史紀錄區 */
        .history-section {
            margin-top: 40px;
            border-top: 3px dashed #dee2e6;
            padding-top: 20px;
            width: 100%;
        }
        .history-title { color: #868e96; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
        .history-item {
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .history-time { color: #adb5bd; font-size: 14px; margin-bottom: 8px; }
        .history-groups { display: flex; flex-wrap: wrap; gap: 12px; }
        .history-group-tag { background: #f1f3f5; padding: 5px 10px; border-radius: 6px; }

        .note { font-size: 16px; color: #adb5bd; text-align: center; margin-top: 30px; }
        #file-input { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>班級隨機分組小幫手</h2>
    
    <div class="input-group">
        <div class="text-area-box">
            <label>男生名單 (5人)</label>
            <textarea id="boys" placeholder="每行一位名字..."></textarea>
        </div>
        <div class="text-area-box">
            <label>女生名單 (9人)</label>
            <textarea id="girls" placeholder="每行一位名字..."></textarea>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-main" onclick="generateNewGroups()">🎲 重新分組</button>
        <button class="btn-secondary" onclick="exportData()">📤 匯出備份</button>
        <button class="btn-secondary" onclick="document.getElementById('file-input').click()">📥 匯入備份</button>
        <button class="btn-clear" onclick="clearAllData()">🗑️ 清除所有</button>
        <button class="btn-score-reset" onclick="resetAllScores()">🧹 僅將分數歸零</button>
    </div>
    
    <input type="file" id="file-input" accept=".json" onchange="importData(event)">
    
    <div class="result-title" id="current-title">🎯 本次分組結果：</div>
    <div class="result-container" id="results">
        <div style="color:#adb5bd; font-size:18px; grid-column: 1 / span 2; text-align: center; padding: 30px;">請輸入名單後點擊分組按鈕。</div>
    </div>

    <div class="history-section">
        <div class="history-title">📜 歷史紀錄 (最近4次)</div>
        <div id="history-container">
            <div style="color:#adb5bd; font-size:16px; text-align:center;">尚無歷史紀錄</div>
        </div>
    </div>

    <div class="note">備註：第1、3組各4人；第2、4組各3人。</div>
</div>

<script>
    let currentGroups = [];
    let historyList = [];
    let scores = { groups: [0, 0, 0, 0], individuals: {} };

    window.onload = function() {
        const savedBoys = localStorage.getItem('boys_list');
        const savedGirls = localStorage.getItem('girls_list');
        const savedHistory = localStorage.getItem('group_history');
        const savedScores = localStorage.getItem('classroom_scores');

        if (savedBoys) document.getElementById('boys').value = savedBoys;
        if (savedGirls) document.getElementById('girls').value = savedGirls;
        
        if (savedScores) scores = JSON.parse(savedScores);
        
        if (savedHistory) {
            historyList = JSON.parse(savedHistory);
            renderHistory();
            if (historyList.length > 0) {
                currentGroups = historyList[0].groups;
                renderCurrentResult(historyList[0].time);
            }
        }
    };

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function generateNewGroups() {
        const boysText = document.getElementById('boys').value;
        const girlsText = document.getElementById('girls').value;
        const boysInput = boysText.trim().split('\n').filter(n => n.trim() !== '');
        const girlsInput = girlsText.trim().split('\n').filter(n => n.trim() !== '');

        if (boysInput.length !== 5 || girlsInput.length !== 9) {
            alert(`人數不對喔！男 ${boysInput.length}, 女 ${girlsInput.length}`);
            return;
        }

        localStorage.setItem('boys_list', boysText);
        localStorage.setItem('girls_list', girlsText);

        let boys = boysInput.map(name => ({ name: name.trim(), gender: '男' }));
        let girls = girlsInput.map(name => ({ name: name.trim(), gender: '女' }));
        shuffle(boys); shuffle(girls);

        let g1 = [], g2 = [], g3 = [], g4 = [];
        g2.push(boys.pop()); g4.push(boys.pop());
        if (Math.random() < 0.5) {
            g1.push(boys.pop()); g1.push(boys.pop()); g3.push(boys.pop());
        } else {
            g1.push(boys.pop()); g3.push(boys.pop()); g3.push(boys.pop());
        }
        while (g1.length < 4) g1.push(girls.pop());
        while (g2.length < 3) g2.push(girls.pop());
        while (g3.length < 4) g3.push(girls.pop());
        while (g4.length < 3) g4.push(girls.pop());

        currentGroups = [g1, g2, g3, g4];
        const timeStr = new Date().toLocaleString('zh-TW', { hour12: false });
        
        historyList.unshift({ time: timeStr, groups: currentGroups });
        if (historyList.length > 4) historyList.pop();

        localStorage.setItem('group_history', JSON.stringify(historyList));
        renderCurrentResult(timeStr);
        renderHistory();
    }

    function renderCurrentResult(time) {
        const container = document.getElementById('results');
        document.getElementById('current-title').innerHTML = `🎯 本次分組結果： <span style="font-size:16px; font-weight:normal; color:#868e96;">(${time})</span>`;
        container.innerHTML = '';

        currentGroups.forEach((group, gIdx) => {
            const card = document.createElement('div');
            card.className = 'group-card';
            let html = `<div class="group-header"><h3>第 ${gIdx + 1} 組</h3>
                <div class="score-controls">
                    <button class="btn-sm btn-minus" onclick="updateGroupScore(${gIdx}, -1)">-</button>
                    <span class="group-score">${scores.groups[gIdx]}</span>
                    <button class="btn-sm btn-plus" onclick="updateGroupScore(${gIdx}, 1)">+</button>
                </div></div><ul>`;
            group.forEach(student => {
                const pScore = scores.individuals[student.name] || 0;
                html += `<li><div class="student-info"><span class="gender-tag ${student.gender === '男' ? 'boy' : 'girl'}">${student.gender}</span>
                    <span>${student.name}</span><span class="individual-score">${pScore > 0 ? '+' + pScore : pScore}</span></div>
                    <div class="score-controls"><button class="btn-sm" style="background:#eee" onclick="updateIndividualScore('${student.name}', -1)">-</button>
                    <button class="btn-sm" style="background:#eee" onclick="updateIndividualScore('${student.name}', 1)">+</button></div></li>`;
            });
            card.innerHTML = html + `</ul>`;
            container.appendChild(card);
        });
    }

    function renderHistory() {
        const container = document.getElementById('history-container');
        if (historyList.length <= 1) {
            container.innerHTML = '<div style="color:#adb5bd; font-size:18px; text-align:center;">（目前尚無更多歷史紀錄）</div>';
            return;
        }
        container.innerHTML = '';
        for (let i = 1; i < historyList.length; i++) {
            const item = historyList[i];
            const div = document.createElement('div');
            div.className = 'history-item';
            let gHtml = '';
            item.groups.forEach((g, idx) => {
                gHtml += `<div class="history-group-tag">第${idx+1}組: ${g.map(s => s.name).join(', ')}</div>`;
            });
            div.innerHTML = `<div class="history-time">歷史紀錄 #${historyList.length - i} (${item.time})</div><div class="history-groups">${gHtml}</div>`;
            container.appendChild(div);
        }
    }

    function updateGroupScore(idx, delta) { scores.groups[idx] += delta; save(); renderCurrentResult(historyList[0].time); }
    function updateIndividualScore(name, delta) { scores.individuals[name] = (scores.individuals[name] || 0) + delta; save(); renderCurrentResult(historyList[0].time); }
    function save() { localStorage.setItem('classroom_scores', JSON.stringify(scores)); }
    function resetAllScores() { if(confirm('分數歸零？')) { scores={groups:[0,0,0,0], individuals:{}}; save(); renderCurrentResult(historyList[0].time); } }
    
    function clearAllData() { if(confirm('清除所有？')) { localStorage.clear(); location.reload(); } }

    function exportData() {
        const backup = { boys: localStorage.getItem('boys_list'), girls: localStorage.getItem('girls_list'), history: historyList, scores: scores };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `班級大字版備份_${new Date().toLocaleDateString()}.json`;
        a.click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                localStorage.setItem('boys_list', data.boys || '');
                localStorage.setItem('girls_list', data.girls || '');
                localStorage.setItem('group_history', JSON.stringify(data.history || []));
                localStorage.setItem('classroom_scores', JSON.stringify(data.scores || {groups:[0,0,0,0], individuals:{}}));
                alert('匯入成功！網頁將重新載入。');
                location.reload();
            } catch (err) { alert('匯入失敗，請確認檔案格式。'); }
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
