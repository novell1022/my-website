<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級隨機分組小幫手</title>
    <style>
        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: #f0f3f5;
            margin: 0;
            padding: 5px; /* 最小化邊界 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 10px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 1000px;
            width: 95vw;
        }
        h2 { text-align: center; color: #4a69bd; margin: 0 0 10px 0; font-size: 26px; }
        
        /* 設定區緊縮 */
        .input-group { display: flex; gap: 10px; margin-bottom: 5px; }
        textarea { height: 60px; flex: 1; padding: 8px; border: 2px solid #d1d8e0; border-radius: 10px; font-size: 16px; }
        
        .btn-group { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 5px; }
        .btn-group button { padding: 8px; border: none; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-main { background-color: #78e08f; color: #2d3436; }
        .btn-secondary { background-color: #82ccdd; color: #2d3436; }
        .btn-clear { background-color: #fab1a0; color: #2d3436; }
        .btn-score-reset { background-color: #ffeaa7; color: #2d3436; grid-column: span 4; margin-top: 2px; padding: 4px; }
        button:hover { transform: scale(1.05); }

        /* 分組結果排列 (左1,3 右2,4) */
        .result-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .group-card {
            background: #fff;
            border: 3px solid #f1f2f6;
            border-radius: 15px;
            padding: 10px 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #a5b1c2;
            padding-bottom: 5px;
            margin-bottom: 5px;
        }
        .group-card h3 { margin: 0; color: #4b6584; font-size: 24px; }
        
        /* 加分按鈕 - 可愛大圓形 */
        .score-controls { display: flex; align-items: center; gap: 5px; }
        .btn-circle {
            width: 35px; height: 35px; border-radius: 50%; border: none;
            font-size: 20px; font-weight: bold; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        .btn-plus { background-color: #55efc4; }
        .btn-minus { background-color: #ff7675; }
        .btn-sm { width: 30px; height: 30px; font-size: 18px; } /* 個人加分按鈕稍微小一點點 */

        .group-score { font-weight: bold; color: #0984e3; font-size: 30px; min-width: 40px; text-align: center; }

        /* 學生名單行高設定 */
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 2px 0;
            font-size: 26px; /* 學生名字大字 */
            line-height: 1.5; /* 遵照指示 1.5 */
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f1f2f6;
        }
        .individual-score { color: #e67e22; font-weight: bold; margin-left: 5px; font-size: 22px; }

        /* 還原原始歷史紀錄設計 */
        .history-section {
            margin-top: 15px;
            width: 100%;
            border-top: 2px solid #ddd;
            padding-top: 10px;
        }
        .history-title { font-weight: bold; color: #7f8c8d; margin-bottom: 8px; font-size: 16px; }
        .history-item {
            background-color: #e3fafc; /* 原始設計的淡藍背景 */
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #0c8599;
            border-left: 5px solid #15aabf;
        }
        .history-time { font-size: 12px; color: #666; margin-bottom: 3px; }

        #file-input { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2> ☆*: .｡. o(≧▽≦)o .｡.:*☆ 班級分組小幫手 ☆*: .｡. o(≧▽≦)o .｡.:*☆</h2>
    
    <div class="input-group">
        <textarea id="boys" placeholder="男生名單..."></textarea>
        <textarea id="girls" placeholder="女生名單..."></textarea>
    </div>

    <div class="btn-group">
        <button class="btn-main" onclick="generateNewGroups()">🎲 開始分組</button>
        <button class="btn-secondary" onclick="exportData()">📤 匯出</button>
        <button class="btn-secondary" onclick="document.getElementById('file-input').click()">📥 匯入</button>
        <button class="btn-clear" onclick="clearAllData()">🗑️ 清除</button>
        <button class="btn-score-reset" onclick="resetAllScores()">🧹 分數歸零</button>
    </div>
    
    <input type="file" id="file-input" accept=".json" onchange="importData(event)">
    
    <div class="result-container">
        <div>
            <div id="result-g1"></div>
            <div id="result-g3"></div>
        </div>
        <div>
            <div id="result-g2"></div>
            <div id="result-g4"></div>
        </div>
    </div>

    <div class="history-section">
        <div class="history-title">📜 歷史紀錄</div>
        <div id="history-container"></div>
    </div>
</div>

<script>
    let currentGroups = [];
    let historyList = [];
    let scores = { groups: [0, 0, 0, 0], individuals: {} };

    window.onload = function() {
        if (localStorage.getItem('boys_list')) document.getElementById('boys').value = localStorage.getItem('boys_list');
        if (localStorage.getItem('girls_list')) document.getElementById('girls').value = localStorage.getItem('girls_list');
        if (localStorage.getItem('classroom_scores')) scores = JSON.parse(localStorage.getItem('classroom_scores'));
        if (localStorage.getItem('group_history')) {
            historyList = JSON.parse(localStorage.getItem('group_history'));
            if (historyList.length > 0) {
                currentGroups = historyList[0].groups;
                renderCurrentResult(historyList[0].time);
            }
            renderHistory();
        }
    };

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function generateNewGroups() {
        const bIn = document.getElementById('boys').value.trim().split('\n').filter(n => n.trim() !== '');
        const gIn = document.getElementById('girls').value.trim().split('\n').filter(n => n.trim() !== '');
        if (bIn.length !== 5 || gIn.length !== 9) { alert('人數不對喔！'); return; }

        let b = bIn.map(n => ({ name: n.trim(), gender: '男' }));
        let g = gIn.map(n => ({ name: n.trim(), gender: '女' }));
        shuffle(b); shuffle(g);

        let g1=[], g2=[], g3=[], g4=[];
        g2.push(b.pop()); g4.push(b.pop());
        if (Math.random() < 0.5) { g1.push(b.pop()); g1.push(b.pop()); g3.push(b.pop()); }
        else { g1.push(b.pop()); g3.push(b.pop()); g3.push(b.pop()); }
        
        while(g1.length<4) g1.push(g.pop());
        while(g2.length<3) g2.push(g.pop());
        while(g3.length<4) g3.push(g.pop());
        while(g4.length<3) g4.push(g.pop());

        currentGroups = [g1, g2, g3, g4];
        const timeStr = new Date().toLocaleString('zh-TW', { hour12: false });
        historyList.unshift({ time: timeStr, groups: currentGroups });
        if (historyList.length > 4) historyList.pop();

        localStorage.setItem('boys_list', document.getElementById('boys').value);
        localStorage.setItem('girls_list', document.getElementById('girls').value);
        localStorage.setItem('group_history', JSON.stringify(historyList));
        renderCurrentResult(timeStr);
        renderHistory();
    }

    function renderCurrentResult(time) {
        currentGroups.forEach((group, idx) => {
            const container = document.getElementById(`result-g${idx+1}`);
            let html = `<div class="group-card">
                <div class="group-header"><h3>第 ${idx+1} 組</h3>
                <div class="score-controls">
                    <button class="btn-circle btn-minus" onclick="updateGroupScore(${idx},-1)">-</button>
                    <span class="group-score">${scores.groups[idx]}</span>
                    <button class="btn-circle btn-plus" onclick="updateGroupScore(${idx},1)">+</button>
                </div></div><ul>`;
            group.forEach(s => {
                const ps = scores.individuals[s.name] || 0;
                html += `<li><span>${s.name}<span class="individual-score">${ps!=0?'+'+ps:''}</span></span>
                    <div class="score-controls">
                        <button class="btn-circle btn-sm btn-minus" style="opacity:0.6" onclick="updateIndividualScore('${s.name}',-1)">-</button>
                        <button class="btn-circle btn-sm btn-plus" style="opacity:0.6" onclick="updateIndividualScore('${s.name}',1)">+</button>
                    </div></li>`;
            });
            container.innerHTML = html + `</ul></div>`;
        });
    }

    function renderHistory() {
        const container = document.getElementById('history-container');
        container.innerHTML = '';
        for (let i = 1; i < historyList.length; i++) {
            const item = historyList[i];
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<div class="history-time">${item.time}</div>` + 
                item.groups.map((g,idx)=>`<b>G${idx+1}</b>:${g.map(s=>s.name).join(',')}`).join(' | ');
            container.appendChild(div);
        }
    }

    function updateGroupScore(i, d) { scores.groups[i]+=d; save(); renderCurrentResult(historyList[0].time); }
    function updateIndividualScore(n, d) { scores.individuals[n] = (scores.individuals[n]||0)+d; save(); renderCurrentResult(historyList[0].time); }
    function save() { localStorage.setItem('classroom_scores', JSON.stringify(scores)); }
    function resetAllScores() { if(confirm('要歸零嗎？')) { scores={groups:[0,0,0,0], individuals:{}}; save(); renderCurrentResult(historyList[0].time); } }
    function clearAllData() { if(confirm('確定清除名單與歷史？')) { localStorage.clear(); location.reload(); } }
    function exportData() {
        const b = { boys: localStorage.getItem('boys_list'), girls: localStorage.getItem('girls_list'), history: historyList, scores: scores };
        const blob = new Blob([JSON.stringify(b, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `分組備份.json`; a.click();
    }
    function importData(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = function(ev) {
            const data = JSON.parse(ev.target.result);
            localStorage.setItem('boys_list', data.boys || '');
            localStorage.setItem('girls_list', data.girls || '');
            localStorage.setItem('group_history', JSON.stringify(data.history || []));
            localStorage.setItem('classroom_scores', JSON.stringify(data.scores || {groups:[0,0,0,0], individuals:{}}));
            location.reload();
        };
        reader.readAsText(file);
    }
</script>
</body>
</html>
