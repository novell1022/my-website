<script type="text/babel">
const { useState, useCallback } = React;

/* ══════════════════════════════════════════
   ★ 設定說明 ★
   1. 將 GAS Proxy 網址貼到 GAS_PROXY_URL
   2. 將自訂通關密語貼到 ACCESS_TOKEN

   ══════════════════════════════════════════ */
const GAS_PROXY_URL = "https://script.google.com/macros/s/AKfycbygHGu6rbomtssUUW5uqNzNtJv0-WlDZJrPGge4WLOBgRHLh3GXf8hSDucP7gAHI0te/exec";
const ACCESS_TOKEN  = "math";
const GEMINI_MODEL  = "gemini-2.5-flash";       // 可改為 gemini-2.5-flash-lite

/* ══════════════════════════════════════════════════════════ */

const COLORS = {
  blue:   { fill:"#378ADD", bg:"#E6F1FB", border:"#185FA5", text:"#0C447C" },
  green:  { fill:"#639922", bg:"#EAF3DE", border:"#3B6D11", text:"#27500A" },
  amber:  { fill:"#BA7517", bg:"#FAEEDA", border:"#854F0B", text:"#633806" },

  teal:   { fill:"#1D9E75", bg:"#E1F5EE", border:"#0F6E56", text:"#085041" },
  pink:   { fill:"#D4537E", bg:"#FBEAF0", border:"#993556", text:"#72243E" },
  red:    { fill:"#E24B4A", bg:"#FCEBEB", border:"#A32D2D", text:"#791F1F" },

const DRAG_THRESHOLD = 50;

const SYSTEM_PROMPT = `你是國小數學教具設計師。根據學生的數學文字題，設計積木配置幫助視覺化解題。

【輸出格式】
只輸出 JSON，不要有任何其他文字或 markdown。先在 "thinking" 欄位完整寫出計算步驟與驗算，再填其他欄位。

{
  "thinking": "1.題型：XXX 2.計算：（逐步列式）3.驗算：blockGroups總和=X，checkAnswers總和=X，相等✓",
  "blockGroups": [...],
  "dropZones": [...],
  "hint": "...",
  "checkAnswers": [...]
}

【鐵律：數量一致性】
blockGroups 所有 count 相加 必須嚴格等於 checkAnswers 所有 expected 相加。
輸出前逐一計算確認，不相等則重新設計。

【各題型處理方式】

▌①一般和差分配題（例：合唱團48人，女比男多12人）
計算：差=12，底數=48-12=36，各得18，女=30，男=18
blockGroups：blue=36（底數），green=12（差值）→ 總和48
dropZones：男生、女生 → expected 18+30=48 ✓

▌②線段切割題（例：325公分剪2段，相差45公分）
計算：差=45，底數=325-45=280，各得140，長=185，短=140
blockGroups：blue=280，green=45 → 總和325
dropZones：長段、短段 → expected 185+140=325 ✓

▌③周長題（例：繩子50公分圍長方形，長比寬多5公分）
⚠️ 積木總數=周長÷2（只代表長+寬，不是全部周長）
計算：長+寬=25，差=5，底數=20，各得10，長=15，寬=10
blockGroups：blue=20，green=5 → 總和25
dropZones：長、寬 → expected 15+10=25 ✓
hint 需說明「積木代表半個周長（長+寬=25）」

▌④移轉題—求移後數量（例：甲42顆乙32顆，移幾顆使兩箱相等）
⚠️ dropZone 代表移動後的數量
計算：總=74，平均=37，差=10，需移=5
blockGroups：blue=64（底數×2），green=10（差值）→ 總和74
dropZones：甲箱後、乙箱後 → expected 37+37=74 ✓
hint：「平均分配積木到兩格，就知道移後每箱幾個，再算需移幾個」

▌⑤移轉題—求移前數量（例：哥哥32點給弟弟6點後兩人一樣，弟弟原來幾點）
計算：哥移後=32-6=26，弟移後也=26，弟原來=26-6=20
⚠️【單色切分】積木全部同色，代表「弟弟移動後的總點數(26)」
   學生根據題目已知的移轉量(6點)，自己決定如何切分，剩下的才是答案
   絕對不可以把答案(20)預先標成某個顏色的積木——那等於直接公布答案
blockGroups：blue=26（弟弟移動後的點數，即32-6=26）→ 總和26（只有一組）
dropZones：弟弟原來有幾點、哥哥給弟弟的點數 → expected 20+6=26 ✓
hint：「哥哥給弟弟6點後，兩人一樣多，各有26點。這26點裡面有一部分是哥哥剛給的，有一部分是弟弟本來就有的。先把哥哥給的6點放到右邊，剩下的就是弟弟原來有幾點」

▌⑥年齡倍數題（例：爸爸31歲女兒3歲，爸爸=女兒3倍時女兒幾歲）
⚠️ 年齡差固定不變。積木總數=年齡差，dropZone 數量=倍數-1
計算：年齡差=31-3=28（永遠不變），倍數-1=2，女兒=28÷2=14
blockGroups：blue=28（兩人年齡差）→ 總和28
dropZones：(N-1) 個格子，label 用「女兒年齡（第1格）」「女兒年齡（第2格）」→ expected 各14，總和28 ✓
hint 撰寫原則（依照國小六年級「基準量與比較量」課程概念）：
  ①說明年齡差固定：「爸爸比女兒大28歲，不管過幾年都不會改變」
  ②套用學生已知的倍數公式：「當爸爸年齡是女兒的3倍，2人的年齡差 = 女兒的年齡 × (3-1)」
  ③引導學生自己計算：「所以這時女兒的年齡應該怎麼算？」
  ④dropZone 的格數對應 (N-1)，每格代表1個「女兒的年齡」，學生把28個積木平分到(N-1)格，就能算出答案
  ⑤不要直接給出數字答案，用問句引導思考

▌⑦年齡和增加題（例：哥哥12歲弟弟8歲，幾年後兩人年齡和為50）
⚠️ 每過1年兩人年齡和增加2。積木代表「還需增加的歲數和」
計算：現在和=20，還差=50-20=30，每年+2，需n=30÷2=15年
blockGroups：blue=30（還需增加的總歲數）→ 總和30
dropZones：哥哥增加、弟弟增加 → expected 15+15=30 ✓
hint：「兩人每過1年，年齡和增加2歲。現在和是20，離50還差幾歲？把這些積木平均分給兩人，每人增加的歲數就是幾年後」

▌⑧年齡倍數變化題（例：媽媽39歲兒子6歲，幾年後媽媽是兒子4倍）
⚠️ 先驗證：目前倍數=39÷6≈6.5，要求N=4 < 6.5，所以「幾年後」有解 ✓
   若 N > 目前倍數，則題目無解，應在 thinking 中說明並拒絕輸出錯誤 JSON
計算：積木數量 = 媽媽現齡 - N×兒子現齡 = 39 - 4×6 = 15
      dropZone 格數 = N-1 = 3，每格 = 15÷3 = 5，即 n=5 年後
blockGroups：blue=15（媽媽現齡 減去 N倍兒子現齡）→ 總和15
dropZones：(N-1) 個格子，各代表「兒子年齡的1格」→ 每格 expected=5，總和=15 ✓
hint 撰寫原則（同樣使用基準量與比較量概念）：
  ①說明年齡差固定：「媽媽比兒子大X歲，永遠不會改變」
  ②套用倍數公式：「當媽媽是兒子的N倍，2人的年齡差 = 兒子的年齡 × (N-1)」
  ③說明積木代表什麼：積木數 = 媽媽現齡 - N×兒子現齡（已知的固定差距）
  ④引導學生：「把這些積木平均分成(N-1)格，每格是幾個，就是幾年後兒子的年齡，再減去現在的年齡就是答案」

【通用規則】
- 每種顏色只用一次
- label 文字必須精確描述該組積木的意義，數字要正確
- hint 引導思考，不直接說出答案數字
- 若題目數字明顯有誤（如無整數解），在 thinking 中說明，並嘗試用最接近的合理解設計

格式範例A（⑤移轉求移前，集點卡題）：
{"thinking":"1.題型：移轉求移前 2.哥移後=32-6=26，弟移後=26，弟原來=26-6=20 3.積木=弟移後26點全部同色，學生自己切分，blockGroups總和=26，expected總和=20+6=26 ✓","blockGroups":[{"color":"blue","count":26,"label":"弟弟移動後共有的點數（哥哥給完後）"}],"dropZones":[{"id":"original","label":"弟弟原來有幾點"},{"id":"given","label":"哥哥給弟弟的幾點"}],"hint":"哥哥給弟弟6點後，兩人一樣多，各有26點。這26點裡有一部分是哥哥剛給的，有一部分是弟弟本來就有的。先把哥哥給的6點放到右邊，剩下的就是弟弟原來有幾點","checkAnswers":[{"zoneId":"original","label":"弟弟原來有幾點","expected":20},{"zoneId":"given","label":"哥哥給的幾點","expected":6}]}

格式範例B（⑥年齡倍數題）：
{"thinking":"1.題型：年齡倍數題 2.年齡差=31-3=28（固定不變）3.女兒=基準量，爸爸=比較量=女兒×3，年齡差=女兒×(3-1)=女兒×2 4.女兒×2=28，女兒=14 5.blockGroups總和=28，expected總和=14+14=28 ✓","blockGroups":[{"color":"blue","count":28,"label":"爸爸和女兒永遠相差28歲"}],"dropZones":[{"id":"part1","label":"女兒的年齡（第1格）"},{"id":"part2","label":"女兒的年齡（第2格）"}],"hint":"爸爸比女兒大28歲，不管過幾年都不會改變（年齡差不變）。當爸爸年齡是女兒的3倍，2人的年齡差 = 女兒的年齡 × (3-1)，所以這時女兒的年齡應該怎麼算？","checkAnswers":[{"zoneId":"part1","label":"第1格","expected":14},{"zoneId":"part2","label":"第2格","expected":14}]}`;

const EXPL_PROMPT = `你是台灣國小數學老師，用繁體中文說明解題步驟。請依照台灣國小課程的用語和概念作答：

【解題說明規則】
1. 條列式，每步驟一行，最後寫完整算式
2. 不要有開場白或結尾客套話
3. 依照各題型使用正確的課程概念：

▌和差問題、分配問題
   用「總數」「差」「平均分配」說明，步驟：求差→求底數→各自數量

▌周長問題
   說明「周長÷2 = 長+寬」，再用和差方法求長和寬

▌移轉問題（給出後兩人一樣多）
   說明「給出後兩人一樣多，所以給出後每人有幾個→被給的人原來有幾個」

▌年齡倍數問題（幾年後/前是幾倍）
   必須使用「基準量」「比較量」概念說明：
   - 指出誰是基準量、誰是比較量
   - 說明年齡差永遠不變
   - 套用公式：年齡差 = 基準量 × (倍數-1)
   - 求出基準量（較小者的年齡），再算出是幾年後

▌年齡和問題（幾年後年齡和為多少）
   說明「每過1年兩人年齡和增加2歲」，求還差幾歲→÷2求年數`;

/* ── GAS Proxy 呼叫 ── */
async function callGemini(systemPrompt, userMessage, maxTokens = 1500) {
  if (!GAS_PROXY_URL || GAS_PROXY_URL.startsWith("請填入")) {
    throw new Error("請先在 HTML 檔案頂端填入 GAS Proxy 網址與通關密語");
  }
  const res = await fetch(GAS_PROXY_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      token: ACCESS_TOKEN,
      model: GEMINI_MODEL,
      payload: {
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ parts: [{ text: userMessage }] }],
        generationConfig: { maxOutputTokens: maxTokens, temperature: 0.2 },
      }
    }),
  });
  const data = await res.json();
  if (data.error) {
    let msg = data.error.message || "未知錯誤";
    if (data.error.code === 403) msg = "❌ 通關密語不符，請確認 ACCESS_TOKEN 設定正確";
    if (data.error.code === 429) msg = "❌ 請求次數超限，請稍等 1 分鐘後再試";
    throw new Error(msg);
  }
  return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
}

/* ── 拖曳積木 ── */
function DragBlock({ block, onDragStart, onDragEnd }) {
  const c = COLORS[block.color] || COLORS.blue;
  return (
    <div
      draggable
      onDragStart={e => { e.dataTransfer.effectAllowed = "move"; onDragStart(block.id); }}
      onDragEnd={onDragEnd}
      title={block.label}
      style={{ width:26, height:26, borderRadius:5, background:c.fill, border:`1px solid ${c.border}88`, cursor:"grab", flexShrink:0, transition:"transform 0.1s" }}
      onMouseEnter={e => e.currentTarget.style.transform = "translateY(-2px)"}
      onMouseLeave={e => e.currentTarget.style.transform = "translateY(0)"}
    />
  );
}

function DragZone({ zone, blocks, onDrop, onDragStart, onDragEnd, feedbackStatus }) {
  const [over, setOver] = useState(false);
  const borderColor = feedbackStatus==="correct" ? "#3B6D11" : feedbackStatus==="wrong" ? "#A32D2D" : over ? "#378ADD" : "#e2e8f0";
  return (
    <div
      onDragOver={e => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={e => { e.preventDefault(); setOver(false); onDrop(zone.id); }}
      style={{ background: over ? "#f0f9ff" : "#fff", border:`1.5px solid ${borderColor}`, borderRadius:12, padding:"14px 16px", minHeight:110, flex:1, transition:"border-color 0.15s, background 0.15s" }}
    >
      <div style={{ fontSize:13, color:"#64748b", marginBottom:8, fontWeight:500 }}>
        {zone.label}
        <span style={{ marginLeft:6, fontWeight:400, color:"#94a3b8" }}>（{blocks.length} 個）</span>
      </div>
      <div style={{ display:"flex", flexWrap:"wrap", gap:5, minHeight:28 }}>
        {blocks.map(b => <DragBlock key={b.id} block={b} onDragStart={onDragStart} onDragEnd={onDragEnd} />)}
      </div>
      {feedbackStatus==="correct" && <div style={{ marginTop:8, fontSize:13, color:"#27500A", fontWeight:600 }}>✓ 正確！</div>}
      {feedbackStatus==="wrong"   && <div style={{ marginTop:8, fontSize:13, color:"#791F1F" }}>✗ 數量不對，再試試！</div>}
    </div>
  );
}

/* ── 輸入模式 ── */
function InputZone({ zone, count, total, blockGroups, totalAllocated, onChange, feedbackStatus }) {
  const borderColor = feedbackStatus==="correct" ? "#3B6D11" : feedbackStatus==="wrong" ? "#A32D2D" : "#e2e8f0";
  const adjust = delta => {
    const max = total - (totalAllocated - count);
    onChange(zone.id, Math.max(0, Math.min(max, count + delta)));
  };
  const handleInput = e => {
    const v = parseInt(e.target.value, 10);
    if (!isNaN(v)) {
      const max = total - (totalAllocated - count);
      onChange(zone.id, Math.max(0, Math.min(max, v)));
    }
  };
  const segments = [];
  let remaining = count;
  for (const g of blockGroups) {
    const take = Math.min(remaining, g.count);
    if (take > 0) { segments.push({...g, take}); remaining -= take; }
    if (remaining <= 0) break;
  }
  const btn = (label, delta, w=34) => (
    <button onClick={() => adjust(delta)}
      style={{ width:w, height:36, borderRadius:6, border:"1px solid #e2e8f0", background:"#f8fafc", fontSize: w>34?12:18, fontWeight:700, cursor:"pointer", color:"#475569" }}>
      {label}
    </button>
  );
  return (
    <div style={{ background:"#fff", border:`1.5px solid ${borderColor}`, borderRadius:12, padding:"16px 18px", flex:1, transition:"border-color 0.2s" }}>
      <div style={{ fontSize:13, color:"#64748b", marginBottom:12, fontWeight:500 }}>{zone.label}</div>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14, flexWrap:"wrap" }}>
        {btn("−10", -10, 44)} {btn("−", -1)} 
        <input type="number" min={0} max={total} value={count} onChange={handleInput}
          style={{ width:80, textAlign:"center", fontSize:22, fontWeight:800, border:"1px solid #e2e8f0", borderRadius:8, padding:"4px 6px", color:"#1e293b", fontFamily:"inherit", outline:"none" }}
          onFocus={e => e.target.style.border = "1px solid #378ADD"}
          onBlur={e => e.target.style.border = "1px solid #e2e8f0"}
        />
        {btn("＋", 1)} {btn("＋10", 10, 44)}
      </div>
      <div style={{ height:20, borderRadius:6, overflow:"hidden", display:"flex", background:"#f1f5f9", border:"1px solid #e2e8f0" }}>
        {segments.map((seg, i) => {
          const c = COLORS[seg.color] || COLORS.blue;
          return <div key={i} title={`${seg.label}：${seg.take}`} style={{ width:`${(seg.take/total)*100}%`, background:c.fill, transition:"width 0.2s" }} />;
        })}
      </div>
      {feedbackStatus==="correct" && <div style={{ marginTop:8, fontSize:13, color:"#27500A", fontWeight:600 }}>✓ 正確！</div>}
      {feedbackStatus==="wrong"   && <div style={{ marginTop:8, fontSize:13, color:"#791F1F" }}>✗ 數量不對，再試試！</div>}
    </div>
  );
}

/* ── 主元件 ── */
function App() {
  const [problem, setProblem]         = useState("飲料店推行集點卡，哥哥收集了32點，給弟弟6點後兩人的點數一樣多，弟弟原來有幾點？");
  const [loading, setLoading]         = useState(false);
  const [config, setConfig]           = useState(null);
  const [blocks, setBlocks]           = useState([]);
  const [draggingId, setDraggingId]   = useState(null);
  const [zoneCounts, setZoneCounts]   = useState({});
  const [feedback, setFeedback]       = useState({});
  const [allCorrect, setAllCorrect]   = useState(false);
  const [error, setError]             = useState("");
  const [thinking, setThinking]       = useState("");
  const [showThinking, setShowThinking] = useState(false);
  const [invalidProblem, setInvalidProblem] = useState("");
  const [explanation, setExplanation] = useState("");
  const [loadingExpl, setLoadingExpl] = useState(false);

  const total = config ? config.blockGroups.reduce((s,g) => s+g.count, 0) : 0;
  const isDragMode = total <= DRAG_THRESHOLD;
  const totalAllocated = Object.values(zoneCounts).reduce((s,v) => s+v, 0);

  const generate = async () => {
    if (!problem.trim()) return;
    setLoading(true);
    setConfig(null); setBlocks([]); setZoneCounts({});
    setFeedback({}); setAllCorrect(false); setError("");
    setThinking(""); setShowThinking(false); setInvalidProblem(""); setExplanation("");

    try {
      const raw = await callGemini(SYSTEM_PROMPT, problem);
      const match = raw.match(/\{[\s\S]*\}/);
      if (!match) throw new Error("回應中找不到 JSON，原始回應：" + raw.slice(0, 100));
      const cfg = JSON.parse(match[0]);
      if (!cfg.blockGroups || !cfg.dropZones || !cfg.checkAnswers) throw new Error("JSON 欄位不完整");

      if (cfg.thinking) {
        setThinking(cfg.thinking);
        const t = cfg.thinking;
        if (t.includes("無解") || t.includes("無整數解") || t.includes("題目有誤") || t.includes("不可能")) {
          setInvalidProblem(t);
        }
      }

      // 前端校正：確保積木總數 = 答案總數
      const blockTotal  = cfg.blockGroups.reduce((s,g) => s+g.count, 0);
      const answerTotal = cfg.checkAnswers.reduce((s,a) => s+a.expected, 0);
      if (blockTotal !== answerTotal && blockTotal > 0) {
        const ratio = answerTotal / blockTotal;
        cfg.blockGroups = cfg.blockGroups.map(g => ({...g, count: Math.round(g.count * ratio)}));
        const fixedTotal = cfg.blockGroups.reduce((s,g) => s+g.count, 0);
        const diff = answerTotal - fixedTotal;
        if (diff !== 0) cfg.blockGroups[0].count += diff;
      }

      setConfig(cfg);
      const t = cfg.blockGroups.reduce((s,g) => s+g.count, 0);

      if (t <= DRAG_THRESHOLD) {
        let id = 0; const nb = [];
        for (const g of cfg.blockGroups) {
          const color = COLORS[g.color] ? g.color : Object.keys(COLORS)[id % 8];
          for (let i = 0; i < g.count; i++) nb.push({id: id++, color, label: g.label, zone: "pool"});
        }
        setBlocks(nb);
      } else {
        const init = {};
        for (const z of cfg.dropZones) init[z.id] = 0;
        setZoneCounts(init);
      }
    } catch(e) { setError("生成失敗：" + e.message); }
    setLoading(false);
  };

  const handleDrop = useCallback(zoneId => {
    if (draggingId === null) return;
    setBlocks(prev => prev.map(b => b.id === draggingId ? {...b, zone: zoneId} : b));
    setDraggingId(null);
    setFeedback({}); setAllCorrect(false);
  }, [draggingId]);

  const handleZoneChange = (zoneId, newCount) => {
    setZoneCounts(prev => ({...prev, [zoneId]: newCount}));
    setFeedback({}); setAllCorrect(false);
  };

  const reset = () => {
    if (isDragMode) setBlocks(prev => prev.map(b => ({...b, zone:"pool"})));
    else { const init = {}; for (const z of config.dropZones) init[z.id] = 0; setZoneCounts(init); }
    setFeedback({}); setAllCorrect(false);
  };

  const check = () => {
    if (!config) return;
    const fb = {}; let ok = true;
    for (const ca of config.checkAnswers) {
      const count = isDragMode ? blocks.filter(b => b.zone===ca.zoneId).length : (zoneCounts[ca.zoneId]||0);
      fb[ca.zoneId] = count === ca.expected ? "correct" : "wrong";
      if (count !== ca.expected) ok = false;
    }
    setFeedback(fb); setAllCorrect(ok);
  };

  const fetchExplanation = async () => {
    setLoadingExpl(true); setExplanation("");
    try {
      const text = await callGemini(EXPL_PROMPT, `請說明這道題目的完整解題步驟和算式：${problem}`, 800);
      setExplanation(text);
    } catch(e) { setExplanation("無法載入解題說明，請稍後再試。"); }
    setLoadingExpl(false);
  };

  const poolBlocks = blocks.filter(b => b.zone === "pool");
  const card = {background:"#fff", border:"1px solid #e2e8f0", borderRadius:12, padding:"16px 18px"};

  return (
    <div style={{ fontFamily:"'Nunito','Noto Sans TC',sans-serif", padding:20, maxWidth:700, margin:"0 auto" }}>

      {/* 標題 */}
      <div style={{ marginBottom:16, paddingBottom:12, borderBottom:"1px solid #e2e8f0" }}>
        <h1 style={{ margin:0, fontSize:20, fontWeight:800, color:"#1e293b" }}>🧱 積木解題工具</h1>
        <p style={{ margin:"4px 0 0", fontSize:13, color:"#94a3b8" }}>輸入數學文字題，AI 自動產生積木，學生透過分配積木理解解題思路</p>
      </div>

      {/* 設定未完成警告 */}
      {(GAS_PROXY_URL.startsWith("請填入") || ACCESS_TOKEN.startsWith("請填入")) && (
        <div style={{ marginBottom:16, padding:"12px 16px", background:"#FAEEDA", border:"1px solid #D4A05A", borderRadius:10, fontSize:14, color:"#633806", lineHeight:1.7 }}>
          ⚠️ <strong>尚未完成設定</strong><br/>
          請用記事本開啟此 HTML 檔案，填入 <code>GAS_PROXY_URL</code>（GAS 部署網址）
          和 <code>ACCESS_TOKEN</code>（通關密語），存檔後重新整理頁面。
        </div>
      )}

      {/* 題目輸入 */}
      <div style={{...card, marginBottom:16}}>
        <div style={{ fontSize:13, color:"#64748b", marginBottom:6 }}>輸入數學題目</div>
        <textarea value={problem} onChange={e => setProblem(e.target.value)} rows={3}
          style={{ width:"100%", fontSize:15, padding:"8px 10px", borderRadius:8, border:"1px solid #e2e8f0", fontFamily:"inherit", resize:"vertical", lineHeight:1.6, outline:"none" }}
          onFocus={e => e.target.style.border = "1px solid #378ADD"}
          onBlur={e => e.target.style.border = "1px solid #e2e8f0"}
        />
        <div style={{ marginTop:10, display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
          <button onClick={generate} disabled={loading}
            style={{ padding:"8px 20px", background:loading?"#94a3b8":"#378ADD", color:"#fff", border:"none", borderRadius:8, fontSize:14, fontWeight:700, cursor:loading?"not-allowed":"pointer", fontFamily:"inherit" }}>
            {loading ? "分析中…" : "產生積木"}
          </button>
          {config && (
            <button onClick={reset}
              style={{ padding:"8px 16px", background:"#f1f5f9", color:"#475569", border:"none", borderRadius:8, fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
              重置
            </button>
          )}
          {config && (
            <span style={{ fontSize:12, color:"#94a3b8" }}>
              {isDragMode ? `🖱 拖曳模式（共 ${total} 個）` : `⌨ 輸入模式（共 ${total} 個）`}
            </span>
          )}
        </div>
        {error && (
          <div style={{ marginTop:10, fontSize:13, color:"#A32D2D", background:"#FCEBEB", border:"1px solid #F09595", borderRadius:8, padding:"8px 12px", wordBreak:"break-all" }}>
            {error}
          </div>
        )}
      </div>

      {config && (<>

        {/* 提示 */}
        <div style={{ fontSize:14, padding:"10px 14px", background:"#EAF3DE", color:"#27500A", borderRadius:8, marginBottom:8, border:"1px solid #C0DD97", lineHeight:1.7 }}>
          💡 {config.hint}
        </div>

        {/* 題目有誤警告 */}
        {invalidProblem && (
          <div style={{ fontSize:14, padding:"10px 14px", background:"#FCEBEB", color:"#791F1F", borderRadius:8, marginBottom:8, border:"1px solid #F09595" }}>
            ⚠️ AI 判斷此題目可能有誤或無整數解，請確認題目數字是否正確。
            <button onClick={() => setShowThinking(true)}
              style={{ marginLeft:8, fontSize:12, color:"#791F1F", background:"none", border:"none", cursor:"pointer", textDecoration:"underline", fontFamily:"inherit" }}>
              查看詳細原因
            </button>
          </div>
        )}

        {/* AI 計算過程（教師確認用）*/}
        {thinking && (
          <div style={{ marginBottom:12 }}>
            <button onClick={() => setShowThinking(v => !v)}
              style={{ fontSize:12, color:"#94a3b8", background:"none", border:"none", cursor:"pointer", padding:"2px 0", fontFamily:"inherit" }}>
              {showThinking ? "▲ 隱藏 AI 計算過程" : "▼ 顯示 AI 計算過程（教師確認用）"}
            </button>
            {showThinking && (
              <div style={{ marginTop:6, fontSize:13, color:"#475569", background:"#f8fafc", border:"1px solid #e2e8f0", borderRadius:8, padding:"10px 14px", whiteSpace:"pre-wrap", lineHeight:1.7 }}>
                {thinking}
              </div>
            )}
          </div>
        )}

        {/* 積木圖例 */}
        <div style={{...card, marginBottom:14}}>
          <div style={{ fontSize:13, color:"#64748b", marginBottom:10 }}>積木說明</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:10 }}>
            {config.blockGroups.map((g, i) => {
              const c = COLORS[g.color] || COLORS.blue;
              return (
                <div key={i} style={{ display:"flex", alignItems:"center", gap:8, background:c.bg, border:`1px solid ${c.border}55`, borderRadius:6, padding:"6px 10px" }}>
                  <div style={{ width:18, height:18, borderRadius:4, background:c.fill, flexShrink:0 }} />
                  <span style={{ fontSize:13, color:c.text, fontWeight:600 }}>{g.count} 個 — {g.label}</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* 拖曳模式 */}
        {isDragMode && (<>
          <div
            onDragOver={e => e.preventDefault()}
            onDrop={e => { e.preventDefault(); handleDrop("pool"); }}
            style={{ background:"#fafafa", border:"1px solid #e2e8f0", borderRadius:12, padding:"14px 18px", marginBottom:8, minHeight:80 }}
          >
            <div style={{ fontSize:13, color:"#64748b", marginBottom:8 }}>
              積木區 <span style={{ color:"#94a3b8" }}>（{poolBlocks.length} 個）</span>
            </div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:5, minHeight:28 }}>
              {poolBlocks.map(b => <DragBlock key={b.id} block={b} onDragStart={setDraggingId} onDragEnd={() => setDraggingId(null)} />)}
              {poolBlocks.length === 0 && <span style={{ fontSize:13, color:"#94a3b8", fontStyle:"italic" }}>所有積木已分配完畢</span>}
            </div>
          </div>
          <div style={{ fontSize:12, color:"#94a3b8", margin:"6px 4px 12px" }}>↓ 把積木拖曳到下方區域</div>
          <div style={{ display:"flex", gap:12, marginBottom:16, flexWrap:"wrap" }}>
            {config.dropZones.map(zone => (
              <DragZone key={zone.id} zone={zone}
                blocks={blocks.filter(b => b.zone === zone.id)}
                onDrop={handleDrop}
                onDragStart={setDraggingId}
                onDragEnd={() => setDraggingId(null)}
                feedbackStatus={feedback[zone.id]}
              />
            ))}
          </div>
        </>)}

        {/* 輸入模式 */}
        {!isDragMode && (<>
          <div style={{...card, marginBottom:14}}>
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, color:"#64748b", marginBottom:8 }}>
              <span>總計分配進度</span>
              <span style={{ fontWeight:700, color: totalAllocated===total ? "#27500A" : totalAllocated>total ? "#A32D2D" : "#1e293b" }}>
                {totalAllocated} / {total}
                {totalAllocated > total && <span style={{ marginLeft:6 }}>超出！</span>}
              </span>
            </div>
            <div style={{ height:14, borderRadius:6, background:"#f1f5f9", overflow:"hidden" }}>
              <div style={{
                height:"100%",
                width:`${Math.min(100, (totalAllocated/total)*100)}%`,
                background: totalAllocated===total ? "#639922" : totalAllocated>total ? "#E24B4A" : "#378ADD",
                borderRadius:6, transition:"width 0.2s, background 0.3s"
              }} />
            </div>
          </div>
          <div style={{ display:"flex", gap:12, marginBottom:16, flexWrap:"wrap" }}>
            {config.dropZones.map(zone => (
              <InputZone key={zone.id} zone={zone}
                count={zoneCounts[zone.id]||0}
                total={total}
                blockGroups={config.blockGroups}
                totalAllocated={totalAllocated}
                onChange={handleZoneChange}
                feedbackStatus={feedback[zone.id]}
              />
            ))}
          </div>
        </>)}

        {/* 檢查答案 */}
        <button onClick={check}
          style={{ padding:"9px 22px", background:"#639922", color:"#fff", border:"none", borderRadius:8, fontSize:14, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>
          檢查答案
        </button>

        {/* 答對區塊 */}
        {allCorrect && (
          <div style={{ marginTop:14 }}>
            <div style={{ textAlign:"center", padding:16, background:"#EAF3DE", border:"1px solid #97C459", borderRadius:12 }}>
              <div style={{ fontSize:26 }}>🎉</div>
              <div style={{ fontWeight:800, fontSize:16, color:"#27500A", marginTop:4 }}>全部正確！解題成功！</div>
              <button onClick={fetchExplanation} disabled={loadingExpl}
                style={{ marginTop:10, padding:"8px 18px", background:loadingExpl?"#94a3b8":"#27500A", color:"#fff", border:"none", borderRadius:8, fontSize:14, fontWeight:700, cursor:loadingExpl?"not-allowed":"pointer", fontFamily:"inherit" }}>
                {loadingExpl ? "載入中…" : "📝 顯示完整解題步驟"}
              </button>
            </div>
            {explanation && (
              <div style={{ marginTop:10, ...card }}>
                <div style={{ fontSize:13, color:"#64748b", marginBottom:10, fontWeight:600 }}>📖 解題說明</div>
                <div style={{ fontSize:15, color:"#1e293b", lineHeight:2, whiteSpace:"pre-wrap" }}>{explanation}</div>
              </div>
            )}
          </div>
        )}

      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
