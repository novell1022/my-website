<style>

.polaroid:active{cursor:grabbing;z-index:50!important;box-shadow:10px 10px 20px rgba(0,0,0,0.4);}

<body>
<div id="root"></div>
<div class="noise-overlay"></div>

<script type="text/babel" data-type="module">
import React, { useState, useEffect, useRef, useCallback } from 'react';
import { createRoot } from 'react-dom/client';
import {
  Users, AlertCircle, Settings, RotateCcw, FileSpreadsheet,
  Plus, Minus, ChevronLeft, ChevronRight, Check, Edit3, Trash2,
  Sparkles, Eraser, ClipboardList, X, Save,
  AlignVerticalJustifyStart, AlignHorizontalJustifyStart,
  AlertTriangle, BookOpen, Clock, Image as ImageIcon,
  Paperclip, Upload, Printer, UploadCloud, Loader2, Star
} from 'lucide-react';

// ─── GAS 設定 ─────────────────────────────────────────────────
const GAS_URL = "https://script.google.com/macros/s/AKfycbwpwQu-ANqGKTXJdagOHko55TgmZvRtz7siwlqLaPNR4p8La3f-k9xXlc4ObCZ8c6IV/exec";
const ZHUYIN_URL = "https://raw.githubusercontent.com/Kathy594520/-/main/BpmfZihiOnly-R.ttf";

// ─── Firebase 設定 ────────────────────────────────────────────
const FB_CONFIG = {
  apiKey:            "AIzaSyBAjAAklC11qZJ2Web1cSrvRYlFT7zBeDM",
  authDomain:        "class-blackboard-83477.firebaseapp.com",
  databaseURL:       "https://class-blackboard-83477-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "class-blackboard-83477",
  storageBucket:     "class-blackboard-83477.firebasestorage.app",
  messagingSenderId: "220112790935",
  appId:             "1:220112790935:web:19d648986484e6e18850d2"
};
// 偵測是否已填寫設定
const FB_READY = typeof firebase !== 'undefined' && !FB_CONFIG.apiKey.startsWith('YOUR');
let fbAuth = null, fbDb = null;
if (FB_READY) {
  try {
    firebase.initializeApp(FB_CONFIG);
    fbAuth = firebase.auth();
    fbDb   = firebase.database();
  } catch(e) { console.warn('Firebase init error:', e); }
}

// ─── 工具函式 ──────────────────────────────────────────────────
const toDateKey = (d) =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const addDays = (d, n) => {
  const nd = new Date(d);
  nd.setDate(nd.getDate() + n);
  return nd;
};

// 作業狀態設定
const HW_STATUS = {
  'null':      { label:'未繳',   short:'未', bg:'bg-gray-100',   text:'text-gray-500',   border:'border-gray-300',   dot:'bg-gray-300'    },
  'submitted': { label:'已繳交', short:'繳', bg:'bg-green-100',  text:'text-green-700',  border:'border-green-400',  dot:'bg-green-500'   },
  'correction':{ label:'需訂正', short:'訂', bg:'bg-orange-100', text:'text-orange-600', border:'border-orange-400', dot:'bg-orange-500'  },
  'completed': { label:'已完成', short:'完', bg:'bg-blue-100',   text:'text-blue-700',   border:'border-blue-400',   dot:'bg-blue-500'    },
};
const hwCfg = (s) => HW_STATUS[s == null ? 'null' : s] || HW_STATUS['null'];

// ─── 作業彈窗 ─────────────────────────────────────────────────
const HomeworkPopup = ({ student, hwRecord, activeItems, onSet, onClose }) => {
  const hw = hwRecord || {};
  return (
    <div className="fixed inset-0 z-[90] flex items-center justify-center bg-black/60 backdrop-blur-sm" onClick={onClose}>
      <div className="bg-retro-paper border-4 border-retro-ink p-6 w-[360px] max-h-[85vh] overflow-y-auto shadow-[8px_8px_0_0_black] relative retro-scrollbar"
           onClick={e => e.stopPropagation()}>
        <div className="absolute -top-4 left-1/2 -translate-x-1/2 bg-retro-ink text-white px-4 py-1 font-black font-mono text-sm border border-white whitespace-nowrap">
          作業登記
        </div>
        <div className="flex justify-between items-center mt-2 mb-4 pb-2 border-b-2 border-retro-ink">
          <h3 className="font-black text-xl font-serif">{student.id}號 {student.name}</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center border-2 border-retro-ink hover:bg-red-100 transition-colors">
            <X className="w-4 h-4"/>
          </button>
        </div>
        {activeItems.length === 0 ? (
          <p className="text-center text-gray-400 py-6 font-serif text-sm">請先在設定中新增作業項目</p>
        ) : (
          <div className="space-y-4">
            {activeItems.map(item => {
              const cur = item.id in hw ? hw[item.id] : null;
              return (
                <div key={item.id} className="pb-4 border-b border-gray-200 last:border-0">
                  <div className="font-bold font-serif mb-2 text-sm flex items-center gap-2">
                    <BookOpen className="w-4 h-4 text-retro-blue shrink-0"/>
                    {item.name}
                  </div>
                  <div className="flex gap-2 flex-wrap">
                    {['submitted','correction','completed'].map(s => {
                      const cfg = hwCfg(s);
                      const isOn = cur === s;
                      return (
                        <button key={s} onClick={() => onSet(item.id, isOn ? null : s)}
                          className={`px-3 py-1.5 text-xs font-bold border-2 transition-all flex items-center gap-1.5 ${
                            isOn ? `${cfg.bg} ${cfg.text} ${cfg.border} shadow-[2px_2px_0_0_black] -translate-y-0.5`
                                 : 'bg-white text-gray-400 border-gray-200 hover:border-gray-400 hover:text-gray-600'
                          }`}>
                          {isOn && <Check className="w-3 h-3"/>}
                          {cfg.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
};

// ─── 列印彈窗 ─────────────────────────────────────────────────
const PrintModal = ({ students, notesHwLines, notesData, getRecord, onClose }) => {
  const todayStr = toDateKey(new Date());
  const [startDate, setStartDate] = useState(todayStr);
  const [endDate,   setEndDate  ] = useState(todayStr);
  const [inclSt,    setInclSt  ] = useState([null, 'correction']);
  const toggleSt = s => setInclSt(p => p.includes(s) ? p.filter(x=>x!==s) : [...p,s]);

  const getDateItems = (dateKey) => {
    const ls   = (notesData[dateKey] || '').split('\n');
    const idxs = notesHwLines[dateKey] || [];
    return idxs
      .map(i => ({ id: String(i), name: (ls[i]||'').replace(/^\s*[\d０-９]+[.、。)）]\s*/,'').trim() }))
      .filter(item => item.name.length > 0);
  };

  const handlePrint = () => {
    if (!startDate || !endDate) { alert('請選擇日期範圍'); return; }
    const dates = [];
    const cur = new Date(startDate + 'T00:00:00');
    const end = new Date(endDate   + 'T00:00:00');
    if (cur > end) { alert('開始日期不能晚於結束日期'); return; }
    while (cur <= end) { dates.push(toDateKey(cur)); cur.setDate(cur.getDate()+1); }

    const statusLabel = { null:'未繳', submitted:'已繳交', correction:'需訂正', completed:'已完成' };
    const statusCls   = { null:'color:#999', submitted:'color:#27ae60', correction:'color:#e67e22;font-weight:bold', completed:'color:#2980b9' };

    const data = students.map(st => {
      const entries = [];
      dates.forEach(dk => {
        const items = getDateItems(dk);
        if (!items.length) return;
        const rec = getRecord(dk, st.id);
        const hw  = rec.homework || {};
        items.forEach(item => {
          const s = item.id in hw ? hw[item.id] : null;
          if (inclSt.includes(s))
            entries.push({ date: dk.slice(5).replace('-','/'), item: item.name, status: s });
        });
      });
      return { st, entries };
    }).filter(x => x.entries.length > 0);

    if (!data.length) { alert('所選條件下沒有任何學生紀錄'); return; }

    const html = `<!DOCTYPE html><html lang="zh-TW"><head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;padding:12px;background:#fff;font-size:12px;}
h1{text-align:center;font-size:13px;color:#555;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid #ccc;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.card{border:2px solid #333;padding:8px;break-inside:avoid;page-break-inside:avoid;}
.card-hdr{font-weight:bold;font-size:13px;border-bottom:1px solid #bbb;padding-bottom:4px;margin-bottom:5px;display:flex;justify-content:space-between;}
.date-range{font-size:9px;color:#aaa;}
.row{display:flex;gap:4px;padding:2px 0;}
.row-date{color:#888;min-width:32px;font-family:monospace;font-size:10px;}
.row-item{flex:1;}
.row-st{font-size:10px;white-space:nowrap;}
@media print{@page{margin:.7cm;size:A4}body{padding:0}}
</style></head><body>
<h1>作業缺繳通知 ／ ${startDate} 至 ${endDate}（列印：${todayStr}）</h1>
<div class="grid">
${data.map(({st,entries}) => `<div class="card"><div class="card-hdr"><span>${st.id}號 ${st.name}</span><span class="date-range">${startDate}~${endDate}</span></div>${entries.map(e=>`<div class="row"><span class="row-date">${e.date}</span><span class="row-item">${e.item}</span><span class="row-st" style="${statusCls[e.status]}">${statusLabel[e.status]}</span></div>`).join('')}</div>`).join('')}
</div>
<script>window.onload=()=>{window.print();}\x3c/script>
</body></html>`;

    const w = window.open('','_blank');
    if (w) { w.document.write(html); w.document.close(); }
    else alert('請允許彈出視窗以進行列印');
  };

  return (
    <div className="fixed inset-0 z-[90] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="bg-retro-paper border-4 border-retro-ink p-6 w-[420px] max-h-[85vh] overflow-y-auto shadow-[8px_8px_0_0_black] relative retro-scrollbar">
        <div className="absolute -top-4 left-1/2 -translate-x-1/2 bg-retro-ink text-white px-4 py-1 font-black font-mono text-sm border border-white whitespace-nowrap">列印作業缺繳通知</div>
        <div className="flex justify-between items-center mt-2 mb-5 pb-2 border-b-2 border-retro-ink">
          <h3 className="font-black text-lg flex items-center gap-2 font-serif"><Printer className="w-5 h-5"/> 個人缺繳報表</h3>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center border-2 border-retro-ink hover:bg-red-100"><X className="w-4 h-4"/></button>
        </div>
        <div className="space-y-5">
          <div className="bg-white border-2 border-retro-ink p-4 shadow-hard-sm relative">
            <div className="absolute -top-3 left-3 bg-retro-ink text-white px-2 text-xs font-mono">日期範圍</div>
            <div className="mt-1 flex items-center gap-3">
              <input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} className="flex-1 px-2 py-1.5 border-b-2 border-retro-ink outline-none font-mono bg-transparent text-sm"/>
              <span className="font-bold text-gray-400">—</span>
              <input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} className="flex-1 px-2 py-1.5 border-b-2 border-retro-ink outline-none font-mono bg-transparent text-sm"/>
            </div>
          </div>
          <div className="bg-white border-2 border-retro-ink p-4 shadow-hard-sm relative">
            <div className="absolute -top-3 left-3 bg-retro-ink text-white px-2 text-xs font-mono">顯示哪些狀態</div>
            <p className="text-xs text-gray-400 font-serif mt-1 mb-2">作業項目由各日板書中勾選的行次自動帶入</p>
            <div className="flex flex-wrap gap-2">
              {[null,'correction','submitted','completed'].map(s => {
                const cfg=hwCfg(s), isOn=inclSt.includes(s);
                return <button key={String(s)} onClick={()=>toggleSt(s)} className={`px-3 py-1 text-xs font-bold border-2 transition-all ${isOn?`${cfg.bg} ${cfg.text} ${cfg.border} shadow-[2px_2px_0_0_black]`:'bg-white text-gray-400 border-gray-200 hover:border-gray-400'}`}>{cfg.label}</button>;
              })}
            </div>
          </div>
          <button onClick={handlePrint} className="w-full py-3 bg-retro-ink text-white border-2 border-retro-ink font-black font-serif flex items-center justify-center gap-2 hover:bg-black shadow-hard-sm active:translate-y-1 active:shadow-none transition-all">
            <Printer className="w-5 h-5"/> 產生列印頁面
          </button>
        </div>
      </div>
    </div>
  );
};

// ─── 確認對話框 ───────────────────────────────────────────────
const ConfirmDialog = ({ config, onConfirm, onCancel }) => {
  if (!config.show) return null;
  return (
    <div className="fixed inset-0 z-[80] bg-retro-ink/50 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="bg-[#fff176] border-4 border-retro-ink p-6 w-full max-w-sm shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] relative">
        <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-retro-ink text-[#fff176] px-3 py-1 font-black font-mono tracking-widest border-2 border-white">WARNING</div>
        <div className="flex flex-col items-center text-center gap-4 mt-2">
          <AlertTriangle className={`w-12 h-12 ${config.type==='danger'?'text-retro-red':'text-orange-500'}`} strokeWidth={2}/>
          <h3 className="text-xl font-black font-serif text-retro-ink">{config.title}</h3>
          <p className="text-retro-ink font-medium leading-relaxed font-serif">{config.msg}</p>
        </div>
        <div className="mt-6 flex justify-center gap-4">
          <button onClick={onCancel} className="px-6 py-2 border-2 border-retro-ink font-bold hover:bg-white transition-colors">取消</button>
          <button onClick={onConfirm} className={`px-6 py-2 border-2 border-retro-ink text-white font-bold shadow-hard-sm active:translate-y-1 active:shadow-none transition-all ${config.type==='danger'?'bg-retro-red':'bg-orange-500'}`}>確認執行</button>
        </div>
      </div>
    </div>
  );
};

// ─── 學生卡片 ─────────────────────────────────────────────────
const StudentCard = ({ student, record, activeHwItems, mode, fontFamily, onClick }) => {
  const hw     = record?.homework || {};
  const status = record?.status   || 'idle';

  let bg='bg-[#fffbf0]', border='border-gray-300 group-hover:border-retro-ink', text='text-retro-ink', stamp=null;

  if (mode === 'attendance') {
    if (status==='present') {
      bg='bg-[#fffbf0]'; border='border-retro-blue'; text='text-retro-blue';
      stamp = (
        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80%] h-[80%] border-4 border-retro-blue rounded-full opacity-30 animate-stamp flex items-center justify-center">
          <span className="text-[10px] font-black -rotate-12 bg-white px-1">{record.arrivalTime}</span>
        </div>
      );
    } else if (status==='late_absent') {
      bg='bg-red-50'; border='border-retro-red border-dashed'; text='text-retro-red';
      stamp = <div className="absolute top-1 right-1 text-retro-red opacity-80 animate-bounce"><AlertCircle size={16}/></div>;
    } else if (status==='late_arrived') {
      bg='bg-orange-50'; border='border-retro-red'; text='text-retro-ink';
      stamp = <div className="absolute top-1 right-1 border-2 border-retro-red px-1 py-0.5 text-[10px] font-black text-retro-red rotate-12 animate-stamp">LATE {record.arrivalTime}</div>;
    }
  } else if (mode === 'brushing') {
    if (record?.brushing) {
      bg='bg-green-50'; border='border-retro-green'; text='text-retro-green';
      stamp = <div className="absolute bottom-1 right-1 text-retro-green opacity-50"><Sparkles size={24}/></div>;
    }
  } else if (mode === 'homework') {
    if (activeHwItems.length > 0) {
      const total   = activeHwItems.length;
      const done    = activeHwItems.filter(i => hw[i.id]==='submitted' || hw[i.id]==='completed').length;
      const hasCorr = activeHwItems.some(i => hw[i.id]==='correction');
      // 只統計「需要注意」的項目（未繳 or 需訂正）用於圓點顯示
      const alertItems = activeHwItems.filter(i => {
        const s = hw[i.id] ?? null;
        return s === null || s === 'correction';
      });
      if      (hasCorr)      { bg='bg-orange-50'; border='border-orange-400'; text='text-orange-700'; }
      else if (done===total) { bg='bg-green-50';  border='border-green-400';  text='text-green-700'; }
      stamp = alertItems.length > 0 ? (
        <div className="absolute bottom-1 right-1 flex gap-0.5 flex-wrap justify-end max-w-[65%]">
          {alertItems.slice(0, 6).map(item => {
            const s = hw[item.id] ?? null;
            return (
              <div key={item.id} title={`${item.name}: ${hwCfg(s).label}`}
                className={`w-2.5 h-2.5 rounded-full border border-white/50 ${hwCfg(s).dot}`}/>
            );
          })}
          {alertItems.length > 6 && <span className="text-[8px] text-current opacity-60 font-mono">+{alertItems.length-6}</span>}
        </div>
      ) : null;
    }
  }

  return (
    <button onClick={onClick} style={{containerType:'size'}}
      className={`relative w-full h-full min-h-0 flex flex-col items-center justify-center transition-all duration-100 cursor-pointer select-none border-2 p-1 overflow-hidden group shadow-sm active:scale-95 active:shadow-inner ${bg} ${border} ${text}`}>
      <div className="absolute top-1/2 left-1 w-2 h-2 bg-retro-bg rounded-full opacity-40"></div>
      <div className="absolute top-1/2 right-1 w-2 h-2 bg-retro-bg rounded-full opacity-40"></div>
      {stamp}
      <span className="font-bold leading-tight w-full text-center whitespace-nowrap z-10 font-serif"
        style={{fontFamily, fontSize:'clamp(1rem, min(18cqw, 35cqh), 4rem)'}}>
        <span className="mr-[0.3em] font-mono text-[0.7em] align-middle opacity-50">{student.id}</span>
        {student.name}
      </span>
      <div className="absolute bottom-2 w-3/4 h-[1px] bg-current opacity-10"></div>
    </button>
  );
};

// ─── 工具按鈕 ─────────────────────────────────────────────────
const ModeBtn = ({ active, onClick, icon, label, color }) => (
  <button onClick={onClick} className={`flex items-center gap-2 px-3 py-1.5 border-2 transition-all shrink-0 font-serif relative overflow-hidden ${
    active ? `${color} shadow-hard-sm -translate-y-1` : 'bg-white border-gray-300 text-gray-400 hover:border-retro-ink hover:text-retro-ink'
  }`}>
    {active && <div className="absolute -right-2 -top-2 w-6 h-6 bg-white rotate-45 border border-retro-ink"></div>}
    {icon}<span className="text-sm font-bold tracking-wider">{label}</span>
  </button>
);
const ToolBtn = ({ onClick, icon, title, danger, active, color }) => (
  <button onClick={onClick} title={title}
    className={`p-2 border-2 shadow-hard-sm transition-transform active:translate-y-[2px] active:shadow-none bg-white ${
      danger  ? 'text-retro-red border-retro-red hover:bg-red-50'  :
      color   ? `${color}`                                          :
      active  ? 'text-white bg-retro-ink border-retro-ink'         :
                'text-retro-ink border-retro-ink hover:bg-yellow-50'
    }`}>{icon}</button>
);

// ══════════════════════════════════════════════════════════════
// 主程式 App
// ══════════════════════════════════════════════════════════════
const App = () => {
  // ── 學生、每日紀錄、作業行標記 ──
  const [students,     setStudents    ] = useState([]);
  const [dailyRecords, setDailyRecords] = useState({});
  // notesHwLines: { [dateKey]: number[] }  — 每天哪幾行被勾選為「需登記」項目
  const [notesHwLines, setNotesHwLines] = useState(() => {
    try { const s=localStorage.getItem('cls_notes_hw_lines'); return s?JSON.parse(s):{} } catch { return {}; }
  });

  // ── UI 狀態 ──
  const [currentTime,  setCurrentTime ] = useState(new Date());
  const [lateThresh,   setLateThresh  ] = useState(() => localStorage.getItem('cls_late_thresh') || '07:32');
  const [classTitle,   setClassTitle  ] = useState(() => localStorage.getItem('cls_title') || '班級自治小黑板');
  const [showSettings, setShowSettings] = useState(false);
  const [showBatch,    setShowBatch   ] = useState(false);
  const [batchInput,   setBatchInput  ] = useState('');
  const [isEditing,    setIsEditing   ] = useState(false);
  const [leftMode,     setLeftMode    ] = useState('students');
  const [checkMode,    setCheckMode   ] = useState('attendance');
  const [viewMode,     setViewMode    ] = useState('split');
  const [writeDir,     setWriteDir    ] = useState(() => localStorage.getItem('cls_writedir') || 'horizontal');
  const [clockIdx,     setClockIdx    ] = useState(() => parseInt(localStorage.getItem('cls_clockidx')||'0',10));
  const [splitRatio,   setSplitRatio  ] = useState(() => parseFloat(localStorage.getItem('cls_split')||'50'));
  const [fontSize,     setFontSize    ] = useState(() => parseInt(localStorage.getItem('cls_fontsize')||'32',10));
  const [lineHeight,   setLineHeight  ] = useState(() => parseFloat(localStorage.getItem('cls_lh')||'1.8'));
  const [fontType,     setFontType    ] = useState(() => localStorage.getItem('cls_fonttype')||'sans');
  const [notesData,    setNotesData   ] = useState(() => {
    try { const s=localStorage.getItem('cls_notes'); return s?JSON.parse(s):{[toDateKey(new Date())]:'\n\n\n\n\n'}; }
    catch { return {[toDateKey(new Date())]:'\n\n\n\n\n'}; }
  });
  // 左右板日期同步：只用一個日期
  const [activeDate,   setActiveDate  ] = useState(new Date());
  const [hwPopup,      setHwPopup     ] = useState({ show:false, studentId:null });
  const [showPrint,    setShowPrint   ] = useState(false);
  const [isUploading,  setIsUploading ] = useState(false);
  const [confirm,      setConfirm     ] = useState({ show:false,title:'',msg:'',action:null,type:'danger' });

  // ── 剪貼簿 ──
  const [scrapImages,  setScrapImages ] = useState(() => {
    try { const s=localStorage.getItem('cls_scrapbook'); return s?JSON.parse(s).map(i=>({...i,x:i.x??80,y:i.y??80,scale:i.scale??1})):[] }
    catch { return []; }
  });
  const [interact,     setInteract    ] = useState({ mode:null, id:null });
  const dragRef = useRef({ x:0,y:0,sx:0,sy:0,is:1 });

  // ── Firebase 狀態 ──
  const [fbUser,     setFbUser    ] = useState(null);
  // 'ready'=尚未設定(純本機), 'checking'=檢查登入中, 'login'=需要登入, 'loaded'=已載入雲端
  const [fbPhase,    setFbPhase   ] = useState(FB_READY ? 'checking' : 'ready');
  const [syncStatus, setSyncStatus] = useState('local'); // 'local'|'syncing'|'synced'|'error'
  const syncTimer = useRef(null);

  // ── 參照 ──
  const splitRef = useRef(null);
  const fileRef  = useRef(null);

  // ── 衍生 ──
  const curDateKey     = toDateKey(activeDate);
  const curNoteContent = notesData[curDateKey] || '';
  const noteLines      = curNoteContent.split('\n');
  const isToday        = curDateKey === toDateKey(new Date());

  // 從板書行次推導當日作業項目（勾選的行 → 去掉行首序號後的文字）
  const stripPrefix  = line => line.replace(/^\s*[\d０-９]+[.、。)）]\s*/, '').trim();
  const curHwIdxs    = notesHwLines[curDateKey] || [];
  const activeHwItems = curHwIdxs
    .map(i => ({ id: String(i), name: stripPrefix(noteLines[i] || ''), lineIdx: i }))
    .filter(item => item.name.length > 0);

  const fontFamily = {
    sans:    "'Noto Sans TC',sans-serif",
    kai:     "'標楷體','DFKai-SB','KaiTi',serif",
    rounded: "'Varela Round','M PLUS Rounded 1c','Microsoft JhengHei',sans-serif",
    zhuyin:  "'ZhuyinCustom','Noto Serif TC',serif",
  }[fontType] || "'Noto Sans TC',sans-serif";

  const CLOCKS = [
    { text:'text-retro-ink' }, { text:'text-retro-red' }, { text:'text-retro-blue' },
    { text:'text-retro-wood' }, { text:'text-retro-green' },
  ];

  // ── 注音字型 ──
  useEffect(() => {
    let tag = document.getElementById('zhuyin-font');
    if (!tag) { tag=document.createElement('style'); tag.id='zhuyin-font'; document.head.appendChild(tag); }
    tag.textContent = `@font-face{font-family:'ZhuyinCustom';src:url('${ZHUYIN_URL}')format('truetype');font-display:swap;}`;
  }, []);

  // ── 讀取 localStorage ──
  useEffect(() => {
    // 嘗試讀 v3，若無則從 v2 遷移
    const raw3 = localStorage.getItem('cls_students_v3');
    if (raw3) {
      try { const p=JSON.parse(raw3); if(Array.isArray(p)) setStudents(p.sort((a,b)=>a.id-b.id)); } catch {}
    } else {
      const raw2 = localStorage.getItem('class_students_v2');
      if (raw2) {
        try { const p=JSON.parse(raw2); if(Array.isArray(p)) setStudents(p.map(s=>({id:s.id,name:s.name})).sort((a,b)=>a.id-b.id)); } catch {}
      }
    }
    const rawDR = localStorage.getItem('cls_daily_records');
    if (rawDR) { try { setDailyRecords(JSON.parse(rawDR)); } catch {} }
  }, []);

  // ── Firebase 認證監聽 & 雲端讀取 ──
  useEffect(() => {
    if (!FB_READY || !fbAuth) return;
    const unsub = fbAuth.onAuthStateChanged(async user => {
      setFbUser(user);
      if (user) {
        setSyncStatus('syncing');
        try {
          const snap = await fbDb.ref(`classroom/${user.uid}`).get();
          if (snap.exists()) {
            const d = snap.val();
            if (Array.isArray(d.students) && d.students.length)
              setStudents(d.students.sort((a,b)=>a.id-b.id));
            if (d.dailyRecords)  setDailyRecords(d.dailyRecords);
            if (d.notesData)     setNotesData(d.notesData);
            if (d.notesHwLines)  setNotesHwLines(d.notesHwLines);
            if (d.settings) {
              const s = d.settings;
              if (s.classTitle)                setClassTitle(s.classTitle);
              if (s.lateThresh)                setLateThresh(s.lateThresh);
              if (s.writeDir !== undefined)    setWriteDir(s.writeDir);
              if (s.fontSize)                  setFontSize(s.fontSize);
              if (s.lineHeight)                setLineHeight(s.lineHeight);
              if (s.fontType)                  setFontType(s.fontType);
              if (s.splitRatio)                setSplitRatio(s.splitRatio);
            }
          }
          setSyncStatus('synced');
        } catch(e) { console.error(e); setSyncStatus('error'); }
        setFbPhase('loaded');
      } else {
        setFbPhase('login');
      }
    });
    return () => unsub();
  }, []);

  // ── 雲端同步（防抖 3 秒）──
  const syncKeys = [students, dailyRecords, notesData, notesHwLines,
                    classTitle, lateThresh, writeDir, fontSize, lineHeight, fontType, splitRatio];
  useEffect(() => {
    if (!FB_READY || !fbUser) return;
    setSyncStatus('syncing');
    clearTimeout(syncTimer.current);
    syncTimer.current = setTimeout(async () => {
      try {
        await fbDb.ref(`classroom/${fbUser.uid}`).update({
          students, dailyRecords, notesData, notesHwLines,
          settings:{ classTitle, lateThresh, writeDir, fontSize, lineHeight, fontType, splitRatio }
        });
        setSyncStatus('synced');
      } catch(e) { console.error(e); setSyncStatus('error'); }
    }, 3000);
  }, syncKeys);

  // ── 登入 / 登出 ──
  const signIn  = () => fbAuth && fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert('登入失敗：'+e.message));
  const signOut = () => fbAuth && fbAuth.signOut().then(()=>{ setSyncStatus('local'); setFbPhase('login'); });

  // ── 寫入 localStorage ──
  useEffect(() => { localStorage.setItem('cls_students_v3',    JSON.stringify(students));     }, [students]);
  useEffect(() => { localStorage.setItem('cls_daily_records',  JSON.stringify(dailyRecords)); }, [dailyRecords]);
  useEffect(() => { localStorage.setItem('cls_notes_hw_lines', JSON.stringify(notesHwLines)); }, [notesHwLines]);
  useEffect(() => { localStorage.setItem('cls_title',          classTitle);                   }, [classTitle]);
  useEffect(() => { localStorage.setItem('cls_notes',          JSON.stringify(notesData));    }, [notesData]);
  useEffect(() => { localStorage.setItem('cls_writedir',       writeDir);                     }, [writeDir]);
  useEffect(() => { localStorage.setItem('cls_split',          splitRatio);                   }, [splitRatio]);
  useEffect(() => { localStorage.setItem('cls_fontsize',       fontSize);                     }, [fontSize]);
  useEffect(() => { localStorage.setItem('cls_lh',             lineHeight);                   }, [lineHeight]);
  useEffect(() => { localStorage.setItem('cls_fonttype',       fontType);                     }, [fontType]);
  useEffect(() => { localStorage.setItem('cls_clockidx',       clockIdx);                     }, [clockIdx]);
  useEffect(() => { localStorage.setItem('cls_late_thresh',    lateThresh);                   }, [lateThresh]);
  useEffect(() => { try { localStorage.setItem('cls_scrapbook', JSON.stringify(scrapImages)); } catch {} }, [scrapImages]);

  // ── Ctrl+V 貼圖 ──
  useEffect(() => {
    const h = e => {
      if (leftMode !== 'scrapbook') return;
      for (const item of e.clipboardData.items)
        if (item.type.indexOf('image') !== -1) processImageFile(item.getAsFile());
    };
    window.addEventListener('paste', h);
    return () => window.removeEventListener('paste', h);
  }, [leftMode]);

  // ── 計時器 & 遲到自動判斷（只對今日） ──
  useEffect(() => {
    const tick = setInterval(() => {
      const now = new Date();
      setCurrentTime(now);
      const todayKey = toDateKey(now);
      const [hh,mm] = lateThresh.split(':').map(Number);
      const thresh = new Date(now); thresh.setHours(hh,mm,0,0);
      const reset  = new Date(now); reset.setHours(17,0,0,0);
      const isLateZone = now >= thresh && now < reset;

      if (!students.length) return;
      setDailyRecords(prev => {
        const today = { ...(prev[todayKey] || {}) };
        let changed = false;
        students.forEach(s => {
          const rec = today[s.id] || { status:'idle', arrivalTime:null, brushing:false, homework:{} };
          if (rec.status==='idle' && isLateZone) {
            today[s.id] = { ...rec, status:'late_absent' }; changed = true;
          } else if (rec.status==='late_absent' && !isLateZone) {
            today[s.id] = { ...rec, status:'idle' }; changed = true;
          }
        });
        return changed ? { ...prev, [todayKey]: today } : prev;
      });
    }, 1000);
    return () => clearInterval(tick);
  }, [lateThresh, students]);

  // ── 取得某日某生紀錄（含預設值） ──
  const getRecord = useCallback((dateKey, sid) => ({
    status:'idle', arrivalTime:null, brushing:false, homework:{},
    ...(dailyRecords[dateKey]?.[sid] || {})
  }), [dailyRecords]);

  // ── 更新某日某生紀錄 ──
  const updateRecord = (dateKey, sid, updates) => {
    setDailyRecords(prev => {
      const dd = prev[dateKey] || {};
      const sr = dd[sid] || { status:'idle', arrivalTime:null, brushing:false, homework:{} };
      return { ...prev, [dateKey]: { ...dd, [sid]: { ...sr, ...updates } } };
    });
  };

  // ── 點擊學生 ──
  const handleStudentClick = (sid) => {
    if (checkMode === 'homework') {
      setHwPopup({ show:true, studentId:sid });
      return;
    }
    const rec = getRecord(curDateKey, sid);
    if (checkMode === 'attendance') {
      const now = new Date();
      const ts  = now.toTimeString().slice(0,5);
      const [hh,mm] = lateThresh.split(':').map(Number);
      const thresh = new Date(now); thresh.setHours(hh,mm,0,0);
      const reset  = new Date(now); reset.setHours(17,0,0,0);
      const isLate     = now >= thresh;
      const isLateZone = now >= thresh && now < reset;
      let ns, nt;
      if (rec.status==='present' || rec.status==='late_arrived') {
        ns = isLateZone ? 'late_absent' : 'idle'; nt = null;
      } else {
        ns = isLate ? 'late_arrived' : 'present'; nt = ts;
      }
      updateRecord(curDateKey, sid, { status:ns, arrivalTime:nt });
    } else if (checkMode === 'brushing') {
      updateRecord(curDateKey, sid, { brushing: !rec.brushing });
    }
  };

  // ── 設定作業狀態 ──
  const handleSetHw = (sid, itemId, status) => {
    const rec = getRecord(curDateKey, sid);
    updateRecord(curDateKey, sid, { homework: { ...rec.homework, [itemId]: status } });
  };

  // ── 切換板書行是否為作業登記項目 ──
  const toggleHwLine = (lineIdx) => {
    setNotesHwLines(prev => {
      const cur  = prev[curDateKey] || [];
      const next = cur.includes(lineIdx) ? cur.filter(i=>i!==lineIdx) : [...cur, lineIdx];
      return { ...prev, [curDateKey]: next };
    });
  };

  // ── 學生名冊 ──
  const updateStudent = (origId, field, val) => {
    setStudents(prev => {
      const list = prev.map(s => {
        if (s.id !== origId) return s;
        if (field === 'name') return { ...s, name: val };
        if (field === 'id')   { const n=parseInt(val,10); if(!isNaN(n)&&n>0) return {...s,id:n}; }
        return s;
      });
      return list.sort((a,b) => a.id - b.id);
    });
  };
  const addStudent = () => {
    setStudents(prev => {
      const mx = prev.length ? Math.max(...prev.map(s=>s.id)) : 0;
      return [...prev, { id:mx+1, name:'' }].sort((a,b)=>a.id-b.id);
    });
  };
  const openBatch = () => { setBatchInput(students.map(s=>`${s.id} ${s.name}`).join('\n')); setShowBatch(true); };
  const saveBatch = () => {
    const lines = batchInput.split(/\r?\n/).filter(l=>l.trim());
    const ns=[], used=new Set();
    lines.forEach(l => {
      const m = l.trim().match(/^(\d+)[\s,，.。]+(.+)$/);
      if (m) {
        const id=parseInt(m[1],10), name=m[2].trim();
        if (!isNaN(id)&&id>0&&name) {
          if (used.has(id)) { const i=ns.findIndex(s=>s.id===id); if(i!==-1) ns[i].name=name; }
          else { ns.push({id,name}); used.add(id); }
        }
      }
    });
    if (ns.length) { setStudents(ns.sort((a,b)=>a.id-b.id)); setShowBatch(false); }
    else alert('名冊格式錯誤，請用「座號 姓名」格式');
  };

  // ── 確認對話框 ──
  const doConfirm    = (title,msg,type,action) => setConfirm({show:true,title,msg,type,action});
  const execConfirm  = () => { if(confirm.action) confirm.action(); setConfirm(c=>({...c,show:false})); };
  const cancelConfirm= () => setConfirm(c=>({...c,show:false}));
  const removeStudent= (e,id) => { e.stopPropagation(); doConfirm('移除學生',`確定要將座號 ${id} 移除嗎？`,'danger',()=>setStudents(p=>p.filter(s=>s.id!==id))); };

  const modeName = m => ({ attendance:'出勤點名', brushing:'潔牙檢查', homework:'作業登記' }[m]);
  const resetMode = () => doConfirm(
    `重置${modeName(checkMode)}`,
    `確定要重置 ${curDateKey} 的「${modeName(checkMode)}」紀錄嗎？`,
    'warning',
    () => {
      setDailyRecords(prev => {
        const dd = { ...(prev[curDateKey]||{}) };
        students.forEach(s => {
          const r = dd[s.id] || {};
          if      (checkMode==='attendance') dd[s.id] = { ...r, status:'idle', arrivalTime:null };
          else if (checkMode==='brushing')   dd[s.id] = { ...r, brushing:false };
          else if (checkMode==='homework')   dd[s.id] = { ...r, homework:{} };
        });
        return { ...prev, [curDateKey]: dd };
      });
    }
  );

  // ── 黑板 ──
  const updateNote = content => setNotesData(prev=>({...prev,[curDateKey]:content}));
  const clearNote  = () => doConfirm('黑板擦','確定要擦掉這天的所有板書嗎？','warning',()=>updateNote('\n\n\n\n\n'));

  // ── 匯出 CSV ──
  const exportCSV = () => {
    let csv='\ufeff日期,座號,姓名,狀態,到校時間,潔牙';
    activeHwItems.forEach(i=>{csv+=`,${i.name}`;});
    csv+='\n';
    const sm={idle:'未到',present:'準時',late_absent:'遲到未到',late_arrived:'遲到已到'};
    const hm={submitted:'已繳交',correction:'需訂正',completed:'已完成'};
    [...students].sort((a,b)=>a.id-b.id).forEach(s=>{
      const r=getRecord(curDateKey,s.id);
      let row=`${curDateKey},${s.id},${s.name},${sm[r.status]||'未到'},${r.arrivalTime||'--'},${r.brushing?'V':''}`;
      activeHwItems.forEach(i=>{row+=`,${hm[r.homework?.[i.id]]||'未繳'}`;});
      csv+=row+'\n';
    });
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
    a.download=`班級紀錄_${curDateKey}.csv`; a.click();
  };

  // ── 雲端上傳 ──
  const uploadCloud = async () => {
    if (!students.length) { alert('名冊是空的！'); return; }
    setIsUploading(true);
    const payload = {
      date: curDateKey,
      students: [...students].sort((a,b)=>a.id-b.id).map(s=>({...s,...getRecord(curDateKey,s.id)}))
    };
    try {
      await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      alert('資料已傳送！請直接確認試算表。');
    } catch { alert('上傳失敗，請檢查網路或 GAS 設定。'); }
    finally { setIsUploading(false); }
  };

  // ── 剪貼簿 ──
  const processImageFile = f => {
    const r = new FileReader();
    r.onload = e => setScrapImages(prev=>[...prev,{
      id:Date.now(), src:e.target.result,
      rotation:Math.random()*10-5, timestamp:new Date().toLocaleString(),
      x:60+Math.random()*200, y:60+Math.random()*200, scale:1
    }]);
    r.readAsDataURL(f);
  };
  const onImgUpload = e => { if(e.target.files[0]) processImageFile(e.target.files[0]); e.target.value=null; };
  const removeImg   = id => setScrapImages(p=>p.filter(i=>i.id!==id));
  const scaleImg    = (id,d) => setScrapImages(p=>p.map(i=>i.id===id?{...i,scale:Math.max(0.5,Math.min(3,(i.scale||1)+d))}:i));
  const onMDMove  = (e,id,cx,cy) => { e.stopPropagation(); if(leftMode!=='scrapbook')return; dragRef.current={x:e.clientX-cx,y:e.clientY-cy}; setInteract({mode:'move',id}); };
  const onMDResize= (e,id,cs)   => { e.stopPropagation(); e.preventDefault(); if(leftMode!=='scrapbook')return; dragRef.current={sx:e.clientX,is:cs}; setInteract({mode:'resize',id}); };
  const onMMScrap = e => {
    if (!interact.mode) return;
    if (interact.mode==='move')   setScrapImages(p=>p.map(i=>i.id===interact.id?{...i,x:e.clientX-dragRef.current.x,y:e.clientY-dragRef.current.y}:i));
    if (interact.mode==='resize') { const dx=e.clientX-dragRef.current.sx; setScrapImages(p=>p.map(i=>i.id===interact.id?{...i,scale:Math.max(0.5,Math.min(3,dragRef.current.is+dx*0.005))}:i)); }
  };
  const onMUScrap = () => setInteract({mode:null,id:null});

  // ── 分屏拖拉 ──
  const onSplitDrag = e => {
    e.preventDefault();
    const mv = e2 => { if(splitRef.current){const r=splitRef.current.getBoundingClientRect();setSplitRatio(Math.max(20,Math.min(((e2.clientX-r.left)/r.width)*100,80)));} };
    const up = () => { document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  };

  // ── 直書 ──
  const fmtVertical = text => {
    if (writeDir !== 'vertical') return text;
    return text.split(/(\d+)/).map((p,i) => {
      if (/\d+/.test(p)) return <span key={i} style={{textCombineUpright:'all',WebkitTextCombine:'horizontal',margin:'2px 0',fontFamily:'"Noto Sans TC",sans-serif'}}>{p}</span>;
      if (/[-－–—]/.test(p)) return p.split('').map((c,ci) => ['-','－','–','—'].includes(c)
        ? <span key={`d${i}${ci}`} style={{display:'inline-block',transform:'rotate(90deg)',verticalAlign:'middle',position:'relative',left:'1px',fontFamily:'"Noto Sans TC",sans-serif'}}>{c}</span>
        : c);
      return p;
    });
  };

  const gridCols = () => {
    const n=students.length;
    if(!n)     return 'grid-cols-1';
    if(n<=30)  return 'grid-cols-5';
    if(n<=42)  return 'grid-cols-6';
    if(n<=56)  return 'grid-cols-8';
    return 'grid-cols-10';
  };

  const hwPopupStudent = hwPopup.show ? students.find(s=>s.id===hwPopup.studentId) : null;
  const hwPopupRecord  = hwPopup.show ? getRecord(curDateKey, hwPopup.studentId)    : null;

  // ── 左右欄寬 ──
  const isWide = typeof window !== 'undefined' && window.innerWidth >= 1024;
  const leftStyle  = viewMode==='split' && isWide ? {width:`calc(${splitRatio}% - 1rem)`, flex:'none'} : {flex:1};
  const rightStyle = viewMode==='split' && isWide ? {width:`calc(${100-splitRatio}% - 1rem)`, flex:'none'} : {flex:1};

  // ════════════════════════════════════════════════════════════
  return (

                  <Clock className="w-3 h-3"/><span className="font-mono">遲到: {lateThresh}</span>
                </div>
                <div className={`text-xs font-black px-3 py-0.5 border-2 border-retro-ink shadow-hard-sm -rotate-1 ${checkMode==='attendance'?'bg-retro-paper text-retro-ink':checkMode==='brushing'?'bg-green-100 text-retro-green':'bg-blue-100 text-retro-blue'}`}>
                  {modeName(checkMode)}
                </div>
              </div>
            </div>

            {/* 作業統計列（homework 模式才顯示） */}
            {checkMode === 'homework' && activeHwItems.length > 0 && (
              <div className="z-10 bg-[#fcfbf9]/95 border-b-2 border-[#5d4037] px-3 py-1.5 flex flex-wrap gap-x-3 gap-y-1">
                {activeHwItems.map(item => {
                  const counts = { null: 0, correction: 0, submitted: 0, completed: 0 };
                  students.forEach(s => {
                    const hw = getRecord(curDateKey, s.id).homework || {};
                    const v  = hw[item.id] ?? null;
                    if (v in counts) counts[v]++;
                    else counts['null']++;
                  });
                  const missing = counts['null'] + counts['correction'];
                  return (
                    <div key={item.id} className="flex items-center gap-1.5 text-[11px] font-bold font-serif">
                      <span className="text-retro-ink opacity-70 truncate max-w-[80px]" title={item.name}>{item.name}</span>
                      <span className="bg-gray-200 text-gray-600 px-1.5 rounded-full font-mono" title="未繳">{counts['null']}未繳</span>
                      {counts['correction'] > 0 && <span className="bg-orange-200 text-orange-700 px-1.5 rounded-full font-mono" title="需訂正">{counts['correction']}訂正</span>}
                      <span className="bg-green-100 text-green-700 px-1.5 rounded-full font-mono" title="已繳/完成">{counts['submitted']+counts['completed']}已交</span>
                    </div>
                  );
                })}
              </div>
            )}

            {/* 學生格 */}
            <div className="flex-1 p-4 overflow-hidden z-10">
              {students.length===0
                ? <div className="flex flex-col items-center justify-center h-full text-[#5d4037]/50 gap-4 cursor-pointer" onClick={()=>setShowSettings(true)}>
                    <div className="border-4 border-dashed border-[#5d4037]/30 p-8 rounded-full"><Users className="w-16 h-16"/></div>
                    <p className="text-xl font-bold font-serif">點此開啟設定，建立名冊</p>
                  </div>
                : <div className={`grid ${gridCols()} gap-3 h-full`} style={{fontFamily, gridAutoRows:'minmax(0,1fr)'}}>
                    {students.map(s=>(
                      <StudentCard key={s.id} student={s}
                        record={getRecord(curDateKey,s.id)}
                        activeHwItems={activeHwItems}
                        mode={checkMode} fontFamily={fontFamily}
                        onClick={()=>handleStudentClick(s.id)}/>
                    ))}
                  </div>
              }
            </div>
          </>)}

          {/* ── 剪貼簿面板 ── */}
          {leftMode==='scrapbook' && (
            <div className="flex-1 flex flex-col relative z-10 h-full">
              <div className="flex justify-between items-center px-4 py-2 border-b-4 border-[#5d4037] bg-[#fcfbf9]/80 backdrop-blur-sm shadow-md z-30">
                <h3 className="font-black text-retro-ink flex items-center gap-2 font-serif"><Paperclip className="w-4 h-4"/> 班級剪貼簿</h3>
                <div className="flex gap-2">
                  <input type="file" ref={fileRef} onChange={onImgUpload} accept="image/*" className="hidden"/>
                  <button onClick={()=>fileRef.current.click()} className="flex items-center gap-1 bg-white border-2 border-retro-ink px-2 py-1 text-xs font-bold shadow-hard-sm hover:translate-y-1 hover:shadow-none transition-all"><Upload className="w-3 h-3"/> 上傳照片</button>
                  <button onClick={()=>setScrapImages([])} className="flex items-center gap-1 bg-retro-red text-white border-2 border-retro-ink px-2 py-1 text-xs font-bold shadow-hard-sm hover:translate-y-1 hover:shadow-none transition-all"><Trash2 className="w-3 h-3"/> 清空</button>
                </div>
              </div>
              <div className="flex-1 relative overflow-hidden">
                {scrapImages.length===0
                  ? <div className="absolute inset-0 flex flex-col items-center justify-center text-[#5d4037]/40 gap-4 pointer-events-none">
                      <div className="w-24 h-24 border-4 border-dashed border-[#5d4037]/30 flex items-center justify-center rounded-lg rotate-3"><ImageIcon className="w-10 h-10"/></div>
                      <p className="font-serif text-lg font-bold">這裡空空的...</p>
                      <p className="text-sm font-mono">按 Ctrl+V 貼上圖片或點擊上傳</p>
                    </div>
                  : scrapImages.map(img=>(
                    <div key={img.id} className="polaroid absolute group cursor-move"
                      style={{left:img.x,top:img.y,width:`${200*(img.scale||1)}px`,transform:`rotate(${img.rotation}deg)`,zIndex:interact.id===img.id?100:10}}
                      onMouseDown={e=>onMDMove(e,img.id,img.x,img.y)}>
                      <img src={img.src} alt="scrapbook" className="w-full h-auto grayscale-[20%] contrast-125 sepia-[30%] pointer-events-none select-none"/>
                      <div className="mt-2 text-center font-mono text-[10px] text-gray-400 truncate select-none">{img.timestamp}</div>
                      <button onClick={e=>{e.stopPropagation();removeImg(img.id);}} className="absolute -top-2 -right-2 bg-retro-red text-white w-6 h-6 rounded-full border-2 border-white shadow-md flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity z-50 cursor-pointer"><X className="w-3 h-3"/></button>
                      <div className="absolute -top-8 right-8 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-50">
                        <button onClick={e=>{e.stopPropagation();scaleImg(img.id,0.1);}} className="bg-white border-2 border-retro-ink w-6 h-6 flex items-center justify-center shadow-sm hover:bg-gray-100"><Plus className="w-3 h-3"/></button>
                        <button onClick={e=>{e.stopPropagation();scaleImg(img.id,-0.1);}} className="bg-white border-2 border-retro-ink w-6 h-6 flex items-center justify-center shadow-sm hover:bg-gray-100"><Minus className="w-3 h-3"/></button>
                      </div>
                      <div className="absolute bottom-0 right-0 w-6 h-6 cursor-nwse-resize z-50 opacity-0 group-hover:opacity-100" onMouseDown={e=>onMDResize(e,img.id,img.scale||1)}>
                        <div className="absolute bottom-1 right-1 w-0 h-0 border-b-[8px] border-r-[8px] border-l-[8px] border-l-transparent border-t-transparent border-b-retro-red border-r-retro-red"></div>
                      </div>
                      <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-4 h-12 bg-[#f1c40f]/50 rotate-45 backdrop-blur-sm shadow-sm pointer-events-none"></div>
                    </div>
                  ))
                }
              </div>
            </div>
          )}
        </div>

        {/* ══ 分隔條 ══ */}
        {viewMode==='split' && (
          <div className="hidden lg:flex w-4 cursor-col-resize items-center justify-center z-30 -ml-2 -mr-2 group" onMouseDown={onSplitDrag}>
            <div className="w-1.5 h-16 bg-[#5d4037] border border-[#3e2723] rounded-full group-hover:bg-[#8d6e63] transition-colors shadow-lg"></div>
          </div>
        )}

        {/* ══ 右欄（黑板） ══ */}
        <div className={`flex flex-col relative shadow-2xl overflow-hidden transition-all duration-300 ${viewMode==='checkin'?'hidden':''}`}
             style={rightStyle}>
          <div className="absolute inset-0 border-[16px] border-[#3e2723] pointer-events-none z-20 shadow-[inset_0_0_20px_rgba(0,0,0,0.8)]"></div>
          <div className="absolute inset-0 bg-[#263238] z-0">
            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/black-scales.png')] opacity-30"></div>
            <div className="absolute inset-0 bg-gradient-to-br from-white/5 via-transparent to-white/5 pointer-events-none"></div>
          </div>

          {/* 黑板頂列 */}
          <div className="relative z-10 flex justify-between items-center p-6 text-gray-200 mt-1">
            <div className="flex items-center gap-3">
              <div className="bg-red-600/20 p-2 rounded-full border border-red-500/50">
                <Star className="w-5 h-5 text-red-400 fill-red-400/50 animate-pulse"/>
              </div>
              <h2 className="text-2xl font-black font-serif tracking-widest text-[#eceff1] opacity-90" style={{textShadow:'1px 1px 2px black'}}>聯絡事項</h2>
            </div>
            {/* 日期導航（與左欄同步） */}
            <div className="flex items-center gap-2 font-mono text-[#eceff1]">
              <button onClick={()=>setActiveDate(d=>addDays(d,-1))} className="hover:text-white hover:scale-125 transition-transform p-1"><ChevronLeft className="w-5 h-5"/></button>
              <span className={`border-b-2 px-3 py-0.5 text-sm font-bold ${
                isToday                                ? 'border-white/40'
                : curDateKey > toDateKey(new Date())  ? 'border-blue-400 text-blue-300'
                :                                       'border-red-400 text-red-300'
              }`}>{curDateKey}</span>
              <button onClick={()=>setActiveDate(d=>addDays(d,1))} className="hover:text-white hover:scale-125 transition-transform p-1"><ChevronRight className="w-5 h-5"/></button>
            </div>
          </div>

          {/* 黑板工具列 */}
          <div className="relative z-10 flex justify-end items-center gap-2 px-6 pb-3 mr-2">
            {/* 字體大小 */}
            <div className="flex items-center bg-white/10 border border-white/20">
              <button onClick={()=>setFontSize(p=>Math.max(16,p-2))} className="p-1.5 hover:bg-white/10 text-white"><Minus className="w-4 h-4"/></button>
              <span className="text-xs font-mono w-8 text-center text-white/80">{fontSize}</span>
              <button onClick={()=>setFontSize(p=>Math.min(72,p+2))} className="p-1.5 hover:bg-white/10 text-white"><Plus className="w-4 h-4"/></button>
            </div>
            {/* 行距 */}
            <div className="flex items-center bg-white/10 border border-white/20">
              <button onClick={()=>setLineHeight(p=>Math.max(1.0,parseFloat((p-0.1).toFixed(1))))} className="p-1.5 hover:bg-white/10 text-white" title="縮小行距">
                <AlignVerticalJustifyStart className="w-4 h-4"/>
              </button>
              <span className="text-xs font-mono w-8 text-center text-white/80">{lineHeight.toFixed(1)}</span>
              <button onClick={()=>setLineHeight(p=>Math.min(4.0,parseFloat((p+0.1).toFixed(1))))} className="p-1.5 hover:bg-white/10 text-white" title="增加行距">
                <AlignHorizontalJustifyStart className="w-4 h-4"/>
              </button>
            </div>
            {/* 書寫方向 */}
            <button onClick={()=>setWriteDir(p=>p==='horizontal'?'vertical':'horizontal')}
              className="p-1.5 text-white/80 hover:text-white border border-white/20 bg-white/5" title="切換直/橫書">
              {writeDir==='horizontal'?<AlignVerticalJustifyStart className="w-4 h-4"/>:<AlignHorizontalJustifyStart className="w-4 h-4"/>}
            </button>
            {/* 黑板擦 */}
            <button onClick={clearNote} className="p-1.5 text-rose-300 hover:text-rose-100 border border-rose-500/30 bg-rose-500/10" title="清空板書"><Eraser className="w-4 h-4"/></button>
            {/* 編輯開關 */}
            <button onClick={()=>setIsEditing(p=>!p)}
              className={`p-1.5 border transition-all ${isEditing?'bg-green-600/50 border-green-400 text-green-100':'bg-white/5 border-white/20 text-white/80'}`} title="編輯板書">
              {isEditing?<Check className="w-4 h-4"/>:<Edit3 className="w-4 h-4"/>}
            </button>
          </div>

          {/* 板書區 */}
          <div className="flex-1 px-8 pb-8 relative overflow-auto z-10 retro-scrollbar">
            {isEditing
              ? <textarea value={curNoteContent} onChange={e=>updateNote(e.target.value)}
                  className={`w-full h-full min-h-[200px] bg-transparent text-white/90 font-serif outline-none resize-none tracking-wider border border-white/10 ${writeDir==='vertical'?'writing-vertical':''}`}
                  style={{fontFamily, fontSize:`${fontSize}px`, lineHeight}}
                  placeholder="今日事項..."/>
              : <div className={`w-full h-full ${writeDir==='vertical'?'flex flex-col flex-wrap writing-vertical items-start content-start gap-x-12':'flex flex-col'}`}
                     style={{fontFamily, fontSize:`${fontSize}px`}}>
                  {noteLines.map((line,idx)=>{
                    const isHw     = curHwIdxs.includes(idx);
                    const hasText  = line.trim().length > 0;
                    return (
                      <div key={idx}
                        className={`group flex ${writeDir==='vertical'?'flex-row items-center gap-2 py-1.5 min-h-[1em]':'flex-row items-baseline gap-2'} text-white/95 font-medium`}
                        style={{lineHeight, marginBottom: writeDir==='horizontal'?`${(lineHeight-1)*0.3}em`:0}}>
                        <span className={`text-[#f1c40f] font-black font-mono select-none opacity-70 text-[0.65em] shrink-0 ${writeDir==='vertical'?'mb-1':''}`}
                              style={writeDir==='vertical'?{writingMode:'horizontal-tb'}:{}}>{idx+1}.</span>
                        <span className="flex-1 whitespace-pre-wrap tracking-wide" style={{textShadow:'1px 1px 0 rgba(0,0,0,0.5)',fontSize:fontType==='zhuyin'?'1.5em':'1em'}}>
                          {fmtVertical(line)}
                        </span>
                        {/* 作業勾選框：有文字的行才顯示 */}
                        {hasText && (
                          <button
                            onClick={()=>toggleHwLine(idx)}
                            title={isHw?'取消作業登記':'勾選為作業登記項目'}
                            style={writeDir==='vertical'?{writingMode:'horizontal-tb'}:{}}
                            className={`shrink-0 flex items-center justify-center w-5 h-5 border-2 transition-all ml-1
                              opacity-0 group-hover:opacity-100 ${isHw?'opacity-100':''}
                              ${isHw
                                ? 'bg-yellow-400/90 border-yellow-300 text-retro-ink'
                                : 'bg-white/10 border-white/30 text-white/50 hover:bg-white/20 hover:border-white/60'
                              }`}>
                            {isHw
                              ? <BookOpen className="w-3 h-3"/>
                              : <Plus className="w-3 h-3"/>
                            }
                          </button>
                        )}
                      </div>
                    );
                  })}
                  {/* 勾選提示（無勾選時） */}
                  {curHwIdxs.length === 0 && (
                    <div className="mt-3 text-white/20 text-xs font-serif italic flex items-center gap-1.5 select-none">
                      <BookOpen className="w-3 h-3 shrink-0"/>
                      將滑鼠移到各行末尾，點擊 ＋ 可標記為作業登記項目
                    </div>
                  )}
                </div>
            }
          </div>
          {/* 黑板底部裝飾 */}
          <div className="absolute bottom-4 left-0 right-0 px-12 flex items-end gap-8 opacity-60 pointer-events-none z-20">
            <div className="w-12 h-2 bg-white rounded-full shadow-sm transform rotate-1"></div>
            <div className="w-8 h-2 bg-red-300 rounded-full shadow-sm transform -rotate-2"></div>
            <div className="w-20 h-4 bg-[#5d4037] ml-auto rounded-sm border-t border-[#8d6e63]"></div>
          </div>
        </div>
      </div>

      {/* 底部列 */}
      <div className="bg-[#5d4037] py-1 text-center text-[10px] text-[#d7ccc8] font-mono shrink-0 border-t border-[#3e2723] z-50 relative">
        Classroom routines · 點名、潔牙、作業登記 · 左右日期同步 · 支援個人缺繳列印
      </div>
    </div>
  );
};

createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
