<script type="text/babel">
const { useState } = React;

/* ── 請填入設定 ── */
const GAS_PROXY_URL = "https://script.google.com/macros/s/AKfycbygHGu6rbomtssUUW5uqNzNtJv0-WlDZJrPGge4WLOBgRHLh3GXf8hSDucP7gAHI0te/exec";
const SECRET = "math";

const BLUE  = '#5B9BD5';
const GREEN = '#68B34A';
const BAR_THRESHOLD = 20;
const VIZ_WIDTH     = 440;

/* ════════════════════════════════
   SYSTEM PROMPT
   ════════════════════════════════ */
const SYSTEM_PROMPT = `你是國小數學教具設計師，只處理「和差問題」五種題型。
只輸出JSON，不含markdown或其他文字。先在thinking欄位寫完整計算，再填其他欄位。

【題型】
- hecha          ：已知和與差，求大小兩數（例：合唱團48人，女比男多12人）
- perimeter      ：已知周長與差，求長寬（例：繩子50公分，長比寬多5公分）
- transfer_after ：已知兩數，求移幾個使相等（例：甲42顆乙32顆，移幾個使兩箱一樣多）
- transfer_before：已知大數與移轉量，求小數（例：哥哥32點給弟弟6點後一樣多）
- age_sum        ：已知兩人現在的數值，求幾年/次後兩人總和達到目標（例：爸爸39歲兒子7歲，幾年後兩人年齡和是60歲）
- age_multiple   ：已知兩人現在的數值與倍數關係，求幾年後達到該倍數（例：媽媽39歲兒子6歲，幾年後媽媽年齡是兒子的4倍）

【JSON格式】
{
  "thinking": "1.判斷題型 2.列出已知 3.逐步計算 4.驗算",
  "type": "hecha|perimeter|transfer_after|transfer_before|age_sum|age_multiple",
  "large": 大數（或年齡較大者的現在值）,
  "small": 小數（或年齡較小者的現在值）,
  "difference": 差值（大數-小數，age_sum中此差值永遠不變）,
  "base": 底數（hecha/perimeter/transfer用，age_sum填0）,
  "moveAmount": 移轉量（transfer題才需要，其他填0）,
  "target": 目標總和（age_sum才需要，其他填0）,
  "multiple": 倍數（age_multiple才需要，例：4；其他填0）,
  "answer": 答案（age_sum/age_multiple才需要，即幾年/次後；其他填0）,
  "timeUnit": "時間單位（age_sum/age_multiple才需要，例：年、個月、次；其他填空字串）",
  "largeLabel": "大數名稱（如：女生、長、甲箱、爸爸）",
  "smallLabel": "小數名稱（如：男生、寬、乙箱、兒子）",
  "unit": "單位（人、公分、顆、歲）",
  "poolSize": 積木池數量
}

【age_multiple 完整範例】媽媽39歲兒子6歲，幾年後媽媽年齡是兒子的4倍？
計算：差=39-6=33（永遠不變），倍數差份數=4-1=3份，1份=33÷3=11（兒子未來歲數），幾年後=11-6=5
驗算：5年後媽媽44歲、兒子11歲，44÷11=4 ✓
→ large=39, small=6, difference=33, multiple=4, answer=5, timeUnit="年", unit="歲"

【age_sum 完整範例】爸爸39歲兒子7歲，幾年後兩人年齡和是60歲？
計算：差=39-7=32（永遠不變），現在合計=46，目標合計=60
解法一（逐年增加）：(60-46)÷2=7，7年後
解法二（和差積木）：兒子未來歲數=(60-32)÷2=14，14-7=7，7年後
→ large=39, small=7, difference=32, target=60, answer=7, timeUnit="年", unit="歲"

【transfer_after 完整範例】甲42顆乙32顆，移幾個使兩箱一樣多？
→ large=42, small=32, difference=10, base=32, moveAmount=5
（base永遠=small，不是difference！）

【poolSize規則】
hecha: poolSize = 大數+小數（即和）
perimeter: poolSize = 周長÷2（不是周長！長+寬才是積木數量）
transfer_after: poolSize = large
transfer_before: poolSize = large
age_sum: poolSize = target（目標總和）
age_multiple: poolSize = difference（年齡差，即用差值積木按份數排）

【鐵律】hecha/perimeter/transfer：large = base + difference，small = base
age_sum不受此限，但必須驗算：(target - difference) 必須是偶數（才能整除2）
age_multiple不受此限，但必須驗算：difference 必須能被 (multiple-1) 整除`;

/* ════════════════════════════════
   EXPL PROMPT
   ════════════════════════════════ */
const EXPL_PROMPT = `你是台灣國小數學老師，用繁體中文為國小六年級學生說明解題步驟。

嚴格規則：
- 絕對不能出現英文字母、未知數（x、y、□以外）、代數或方程式
- 語氣親切口語，像老師對學生說話
- 直接說步驟，不要開場白（不要說「好的」「當然」「這道題」）

【hecha 和差題】
1. 說明積木圖：兩排積木，藍色一樣長（小數），綠色多出來的是差
2. 把差值從大數那排移走 → 兩排一樣長 → 兩排加起來就是「和減差」
3. (和－差)÷2＝小數，小數＋差＝大數
4. 寫出完整算式與答案

【perimeter 周長題】
1. 說明為什麼積木不是整條繩子，而是周長÷2（長＋寬）
2. 後續同 hecha 步驟

【transfer_after 移轉題 — 說明兩種解法】
解法一（移轉法）：
1. 甲比乙多了幾個 → 差 = 甲 - 乙
2. 要讓兩箱一樣多，把差的一半從甲移到乙
3. 算式：（甲 - 乙）÷ 2 = 移轉量

解法二（合併平分法）：
1. 把兩箱全部合在一起 → 總數 = 甲 + 乙
2. 總數 ÷ 2 = 每箱應有的數量
3. 甲 - 每箱數量 = 移轉量
4. 算式：（甲 + 乙）÷ 2 = 每箱，甲 - 每箱 = 移轉量

格式：先說學生用的操作方式，再說另一種，最後列出兩個完整算式。說明時只描述操作步驟，不要替這兩種方法命名。

【transfer_before 移轉題（已知移後結果，求移前數量）】
1. 移了幾個之後兩排一樣多，所以移後每排是多少
2. 移後數量－移轉量＝原來少的那排
3. 寫出完整算式與答案

【age_sum 年齡和題 — 說明兩種解法】
解法一（逐年增加）：
1. 說明：現在兩人合計多少，目標合計多少，差了幾歲
2. 每過一年兩人各加1歲，也就是每年合計增加2
3. 算式：（目標和 - 現在和）÷ 2 = 幾年後

解法二（和差積木）：
1. 說明：兩人的年齡差永遠不變（大的永遠比小的多幾歲）
2. 拿目標和的積木，按差值排成兩排（和差結構）
3. 短的那排就是小的人未來的年齡，再減現在的年齡就是幾年後
4. 算式：（目標和 - 年齡差）÷ 2 = 小的未來年齡，小的未來年齡 - 現在年齡 = 幾年後

格式：先說學生用的操作方式，再說另一種，最後列出兩個完整算式。說明時只描述操作步驟，不要替方法命名。

【age_multiple 倍數年齡題】
1. 說明：兩人的年齡差永遠不變（大的永遠比小的多幾歲）
2. 大的是小的幾倍，就有幾份；小的是1份；差值就是（倍數-1）份
3. 差值 ÷（倍數-1）= 每份 = 小的人未來的年齡
4. 小的未來年齡 - 小的現在年齡 = 幾年後
5. 最後驗算：幾年後大的年齡 ÷ 小的年齡 是否等於倍數
6. 列出完整算式

收到題目時，先判斷是哪種類型，只說明對應的解法。`;

/* ── GAS Proxy 呼叫 ── */
async function callGemini(systemPrompt, userMessage, maxTokens = 1000) {
  if (!GAS_PROXY_URL || GAS_PROXY_URL.startsWith("請填入")) {
    throw new Error("請先填入GAS Proxy網址與通關密語");
  }
  const geminiPayload = {
    system_instruction: { parts: [{ text: systemPrompt }] },
    contents: [{ role: "user", parts: [{ text: userMessage }] }],
    generationConfig: { maxOutputTokens: maxTokens, temperature: 0.1 }
  };
  let res;
  try {
    res = await fetch(GAS_PROXY_URL, {
      method: "POST",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: SECRET, payload: geminiPayload })
    });
  } catch (netErr) {
    throw new Error("網路連線失敗：" + netErr.message);
  }
  if (!res.ok) throw new Error(`伺服器回應錯誤：HTTP ${res.status}`);
  const rawText = await res.text();
  console.log('[GAS 原始回應]', rawText);
  let data;
  try { data = JSON.parse(rawText); }
  catch (_) { throw new Error("回應不是合法 JSON：" + rawText.slice(0, 300)); }
  if (data.error) {
    const errMsg = typeof data.error === 'object'
      ? `${data.error.message || ''} (code ${data.error.code || '?'})`
      : String(data.error);
    throw new Error(errMsg);
  }
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error("找不到回應文字，原始回應：" + rawText.slice(0, 300));
  return text;
}

/* ── 數字輸入器 ── */
function Stepper({ value, onChange, label, color, min = 0, max = 999 }) {
  return (
    <div className="stepper-row">
      <div className="stepper-dot" style={{ background: color }} />
      <span className="stepper-label">{label}</span>
      <button className="stepper-btn" onClick={() => onChange(Math.max(min, value - 1))}>－</button>
      <input className="stepper-input" type="number" value={value}
        onChange={e => {
          const v = parseInt(e.target.value);
          if (!isNaN(v)) onChange(Math.max(min, Math.min(max, v)));
        }}
      />
      <button className="stepper-btn" onClick={() => onChange(Math.min(max, value + 1))}>＋</button>
    </div>
  );
}

/* ── 單列積木視覺 ── */
function BlockRow({ baseVal, diffVal, rowLabel, maxVal, useBar }) {
  const safMax = maxVal > 0 ? maxVal : 1;
  const scale = VIZ_WIDTH / safMax;
  const total = baseVal + diffVal;
  const tex = 'repeating-linear-gradient(90deg,rgba(255,255,255,0)0px,rgba(255,255,255,0)17px,rgba(255,255,255,0.28)17px,rgba(255,255,255,0.28)20px)';

  const blocks = [];
  if (!useBar) {
    for (let i = 0; i < baseVal; i++)
      blocks.push(<div key={`b${i}`} style={{ width:22, height:32, borderRadius:4, background:BLUE, border:'1px solid rgba(0,0,0,0.12)', flexShrink:0 }} />);
    for (let i = 0; i < diffVal; i++)
      blocks.push(<div key={`d${i}`} style={{ width:22, height:32, borderRadius:4, background:GREEN, border:'1px solid rgba(0,0,0,0.12)', flexShrink:0 }} />);
  }

  return (
    <div className="row-wrap">
      <span className="row-label">{rowLabel}</span>
      {!useBar ? (
        <div style={{ display:'flex', gap:2, flexWrap:'wrap' }}>{blocks}</div>
      ) : (
        <div style={{ display:'flex', gap:0 }}>
          {baseVal > 0 && (
            <div style={{
              width: Math.round(baseVal * scale), height:32,
              background: BLUE, backgroundImage: tex,
              borderRadius: diffVal > 0 ? '7px 0 0 7px' : '7px',
              border:'1px solid rgba(0,0,0,0.1)'
            }} />
          )}
          {diffVal > 0 && (
            <div style={{
              width: Math.round(diffVal * scale), height:32,
              background: GREEN, backgroundImage: tex,
              borderRadius: baseVal > 0 ? '0 7px 7px 0' : '7px',
              border:'1px solid rgba(0,0,0,0.1)', borderLeft:'none'
            }} />
          )}
        </div>
      )}
      {total > 0 && <span className="row-total">{total}</span>}
    </div>
  );
}

/* ══════════════════════════════════════
   主元件
   ══════════════════════════════════════ */
function App() {
  const [problem,  setProblem]  = useState('');
  const [config,   setConfig]   = useState(null);
  // phases: input | strategy | setup | filling | selectLabel | correct | explaining
  const [phase,    setPhase]    = useState('input');
  const [loading,  setLoading]  = useState(false);
  const [loadingX, setLoadingX] = useState(false);
  const [apiErr,   setApiErr]   = useState('');
  const [expl,     setExpl]     = useState('');

  /* 策略選擇 */
  const [strategy,    setStrategy]    = useState(''); // 'transfer' | 'merge'

  /* 自主排積木（setup 階段） */
  const [setupA,     setSetupA]     = useState(0);
  const [setupB,     setSetupB]     = useState(0);
  const [setupError, setSetupError] = useState('');
  const [setupTries, setSetupTries] = useState(0);

  /* 操作積木（filling 階段） */
  const [userMove,  setUserMove]  = useState(0);
  const [userSplit, setUserSplit] = useState(0);
  const [userDiff,  setUserDiff]  = useState(0);
  const [userBase,  setUserBase]  = useState(0);
  const [userSmall, setUserSmall] = useState(0);
  const [fillError, setFillError] = useState('');

  /* 答對後狀態 */
  const [solveMethod, setSolveMethod] = useState('');
  const [wrongSelect, setWrongSelect] = useState(false);
  const [altDone,     setAltDone]     = useState(false);

  /* 全部重置 */
  const fullReset = () => {
    setStrategy('');
    setSetupA(0); setSetupB(0); setSetupError(''); setSetupTries(0);
    setUserMove(0); setUserSplit(0); setUserDiff(0); setUserBase(0); setUserSmall(0); setFillError('');
    setSolveMethod(''); setWrongSelect(false); setAltDone(false); setExpl('');
  };

  const backToInput = () => { setConfig(null); setProblem(''); setPhase('input'); fullReset(); };

  /* 嘗試另一種解法 */
  const tryAltMethod = () => {
    let altStrategy;
    if (type === 'age_sum') {
      altStrategy = strategy === 'age_grow' ? 'age_hecha' : 'age_grow';
    } else {
      altStrategy = strategy === 'transfer' ? 'merge' : 'transfer';
    }
    setStrategy(altStrategy);
    setSetupA(0); setSetupB(0); setSetupError(''); setSetupTries(0);
    setUserMove(0); setUserSplit(0); setUserDiff(0); setUserBase(0); setFillError('');
    setAltDone(true);
    setPhase('setup');
  };

  /* 第一次呼叫：產生積木配置 */
  const generate = async () => {
    if (!problem.trim()) return;
    setLoading(true); setApiErr(''); setConfig(null);
    fullReset();
    try {
      const raw = await callGemini(SYSTEM_PROMPT, problem, 700);
      let clean = raw.replace(/```json|```/gi, '').trim();
      const jsonMatch = clean.match(/\{[\s\S]*\}/);
      if (!jsonMatch) throw new Error("AI 沒有回傳 JSON：" + clean.slice(0, 200));
      clean = jsonMatch[0];
      let cfg;
      try { cfg = JSON.parse(clean); }
      catch (pe) { throw new Error("JSON 解析失敗：" + pe.message + "　原始：" + clean.slice(0, 120)); }
      const validTypes = ['hecha','perimeter','transfer_after','transfer_before','age_sum','age_multiple'];
      if (!validTypes.includes(cfg.type)) throw new Error("題型辨識失敗（type=" + cfg.type + "）");
      if (cfg.large == null || cfg.small == null) throw new Error("缺少必要欄位 large/small");
      if (cfg.type === 'transfer_after' || cfg.type === 'transfer_before') {
        cfg.base = cfg.small;
        cfg.difference = cfg.large - cfg.small;
      }
      if (cfg.type === 'age_sum' || cfg.type === 'age_multiple') {
        cfg.difference = cfg.large - cfg.small; // 年齡差，永遠不變
      }
      setConfig(cfg);
      const startPhase = cfg.type === 'transfer_after' ? 'strategy'
                       : cfg.type === 'age_sum'        ? 'strategy'
                       : 'setup';
      if (cfg.type === 'age_multiple') setStrategy('mul_parts');
      setPhase(startPhase);
    } catch (e) {
      setApiErr('發生錯誤：' + e.message);
    } finally {
      setLoading(false);
    }
  };

  /* 第二次呼叫：查看解題步驟 */
  const fetchExpl = async () => {
    setLoadingX(true);
    const { type, large, small, difference, moveAmount, largeLabel, smallLabel } = config;
    const { target, answer: ageAnswer, timeUnit } = config;
    let userMsg = `題目：${problem}\n`;
    if (type === 'transfer_after') {
      userMsg += `學生已答對。\n`;
      userMsg += `學生使用的是${solveMethod === 'transfer' ? '移轉（各排一排，再移動）' : '合併平分（先合在一起，再平分）'}的操作方式。\n`;
      userMsg += `請先說明學生用的操作方式，再介紹另一種，最後列出兩個完整算式。\n`;
      userMsg += `數據：${largeLabel}=${large}，${smallLabel}=${small}，差=${difference}，移轉量=${moveAmount}，移後每箱=${small + moveAmount}`;
    } else if (type === 'age_sum') {
      userMsg += `學生已答對。\n`;
      userMsg += `學生使用的是${solveMethod === 'age_grow' ? '逐年增加（兩排各加積木，合計達目標）' : '和差積木（用目標和積木按年齡差排兩排）'}的操作方式。\n`;
      userMsg += `請先說明學生用的操作方式，再介紹另一種，最後列出兩個完整算式。\n`;
      userMsg += `數據：${largeLabel}現在=${large}${config.unit}，${smallLabel}現在=${small}${config.unit}，年齡差=${difference}，目標和=${target}，答案=${ageAnswer}${timeUnit}後，${smallLabel}未來=${small+ageAnswer}${config.unit}`;
    } else if (type === 'age_multiple') {
      const { multiple: mul } = config;
      userMsg += `學生已答對，使用的是「按份數排」操作方式。\n`;
      userMsg += `請說明解題步驟，並列出完整算式。\n`;
      userMsg += `數據：${largeLabel}現在=${large}${config.unit}，${smallLabel}現在=${small}${config.unit}，年齡差=${difference}，倍數=${mul}，份數=${mul-1}，每份=${small+ageAnswer}${config.unit}（即${smallLabel}未來年齡），答案=${ageAnswer}${timeUnit}後`;
    } else {
      userMsg += `請說明這道題的解題步驟。`;
    }
    try {
      const text = await callGemini(EXPL_PROMPT, userMsg, 1000);
      setExpl(text);
      setPhase('explaining');
    } catch (e) {
      setExpl('載入失敗：' + e.message);
      setPhase('explaining');
    } finally {
      setLoadingX(false);
    }
  };

  /* ════════════ 畫面渲染 ════════════ */

  /* ── 輸入題目 ── */
  if (!config) {
    return (
      <div>
        <h1>🧱 和差積木教具</h1>
        <div className="card">
          <div className="section-title">輸入題目</div>
          <textarea
            value={problem}
            onChange={e => setProblem(e.target.value)}
            placeholder={"在這裡輸入數學題目，例如：\n農夫摘了2箱橘子，甲箱有42顆，乙箱有32顆，\n要從甲箱拿幾顆到乙箱，2箱才會一樣多？"}
          />
          <button className="btn-primary" onClick={generate} disabled={loading || !problem.trim()}>
            {loading ? '⏳ AI 正在思考…' : '✨ 產生積木'}
          </button>
          {apiErr && (
            <div className="error-msg" style={{ textAlign:'left', background:'#FFF5F5', border:'1px solid #FFCDD2', borderRadius:10, padding:'10px 14px', marginTop:10 }}>
              ❌ {apiErr}
              <div style={{ fontSize:12, color:'#999', marginTop:6 }}>
                💡 請開啟瀏覽器 Console（F12）查看 [GAS 原始回應] 以進一步 debug
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  const { type, large, small, difference, base, moveAmount,
          largeLabel, smallLabel, unit, poolSize } = config;
  const useBar = large > BAR_THRESHOLD;

  /* ── 策略選擇（transfer_after / age_sum）── */
  if (phase === 'strategy') {
    const goSetup = (s) => {
      setStrategy(s);
      setSetupA(0); setSetupB(0); setSetupError(''); setSetupTries(0);
      setPhase('setup');
    };
    return (
      <div>
        <h1>🧱 和差積木教具</h1>
        <div className="card">
          <div className="problem-text">{problem}</div>
          <div style={{ fontSize:17, fontWeight:700, textAlign:'center', marginBottom:16, color:'#333' }}>
            你打算怎麼操作積木？
          </div>
          {type === 'transfer_after' && (
            <div className="strategy-wrap">
              <button className="strategy-btn" onClick={() => goSetup('transfer')}>
                📦 各排一排
                <span className="strategy-sub">把兩箱各排好，再移動看看</span>
              </button>
              <button className="strategy-btn" onClick={() => goSetup('merge')}>
                🔀 合在一起
                <span className="strategy-sub">全部合成一堆，再平分看看</span>
              </button>
            </div>
          )}
          {type === 'age_sum' && (
            <div className="strategy-wrap">
              <button className="strategy-btn" onClick={() => goSetup('age_grow')}>
                📅 逐年增加
                <span className="strategy-sub">兩排各排好，每年各加一個</span>
              </button>
              <button className="strategy-btn" onClick={() => goSetup('age_hecha')}>
                🧩 用目標總數排
                <span className="strategy-sub">拿目標和的積木，按差值排成兩排</span>
              </button>
            </div>
          )}

          <button className="btn-secondary" onClick={backToInput}>換一題</button>
        </div>
      </div>
    );
  }

  /* ── 自主排積木（setup 階段）── */
  if (phase === 'setup') {

    const checkSetup = () => {
      const tries = setupTries + 1;
      setSetupTries(tries);
      let ok = false;

      if (type === 'transfer_after' && strategy === 'transfer') {
        ok = (setupA === large) && (setupB === small);
        if (!ok) {
          if (tries === 1) {
            setSetupError('再仔細看看題目，兩箱各有幾顆？');
          } else if (tries === 2) {
            if (setupA !== large && setupB !== small)
              setSetupError(`${largeLabel}和${smallLabel}兩邊都不對，題目裡有寫的！`);
            else if (setupA !== large)
              setSetupError(`${largeLabel}的數量不對，再找找題目！`);
            else
              setSetupError(`${smallLabel}的數量不對，再找找題目！`);
          } else {
            setSetupError(`提示：${largeLabel}有 ${large} 顆，${smallLabel}有 ${small} 顆。`);
          }
        }
      }

      else if (type === 'transfer_after' && strategy === 'merge') {
        const total = large + small;
        ok = (setupA === total);
        if (!ok) {
          if (tries === 1)
            setSetupError(`再算算看，${largeLabel}加${smallLabel}一共有幾顆？`);
          else if (tries === 2)
            setSetupError(`${largeLabel}有 ${large} 顆，${smallLabel}有 ${small} 顆，${large}＋${small}＝？`);
          else
            setSetupError(`提示：${large}＋${small}＝${total} 顆。`);
        }
      }

      else if (type === 'hecha') {
        ok = (setupA === poolSize);
        if (!ok) {
          if (tries === 1)
            setSetupError('積木總數就是這兩個數加在一起的結果，再想想！');
          else if (tries === 2)
            setSetupError('提示：題目告訴你總共有幾個了，找找看！');
          else
            setSetupError(`提示：積木總數 = ${poolSize}（兩數的和）`);
        }
      }

      else if (type === 'perimeter') {
        ok = (setupA === poolSize);
        if (!ok) {
          if (setupA === poolSize * 2)
            setSetupError(`積木只代表長＋寬，不是整條繩子！長＋寬 = 周長÷2 = ${poolSize}`);
          else if (tries < 3)
            setSetupError('積木代表長加寬，不是整條繩子！試試看 周長÷2');
          else
            setSetupError(`提示：長＋寬 = 周長÷2 = ${poolSize}`);
        }
      }

      else if (type === 'transfer_before') {
        ok = (setupA === large);
        if (!ok) {
          if (tries < 3) setSetupError(`再看看題目，${largeLabel}有幾個？`);
          else setSetupError(`提示：${largeLabel}有 ${large} 個。`);
        }
      }

      else if (type === 'age_sum' && strategy === 'age_grow') {
        ok = (setupA === large) && (setupB === small);
        if (!ok) {
          if (tries === 1) setSetupError(`再仔細看看題目，${largeLabel}和${smallLabel}現在各幾歲？`);
          else if (tries === 2) {
            if (setupA !== large && setupB !== small)
              setSetupError(`兩邊都不對，題目裡有寫的！`);
            else if (setupA !== large)
              setSetupError(`${largeLabel}的歲數不對，再找找題目！`);
            else
              setSetupError(`${smallLabel}的歲數不對，再找找題目！`);
          } else {
            setSetupError(`提示：${largeLabel}現在 ${large} ${unit}，${smallLabel}現在 ${small} ${unit}。`);
          }
        }
      }

      else if (type === 'age_sum' && strategy === 'age_hecha') {
        // 學生要用目標和 (target) 個積木
        ok = (setupA === config.target);
        if (!ok) {
          if (tries === 1) setSetupError('積木總數要用題目裡說的「未來兩人年齡和」，再想想！');
          else if (tries === 2) setSetupError(`題目說幾年後兩人年齡和是幾歲，那就拿幾個積木。`);
          else setSetupError(`提示：積木總數 = ${config.target}（目標年齡和）`);
        }
      }

      else if (type === 'age_multiple' && strategy === 'mul_parts') {
        // 學生要用「差值」個積木
        ok = (setupA === difference);
        if (!ok) {
          if (tries === 1) setSetupError(`這次不是用年齡和，而是用兩人的「年齡差」當積木數量，再想想！`);
          else if (tries === 2) setSetupError(`${largeLabel}比${smallLabel}多幾歲，差值就是積木數量。`);
          else setSetupError(`提示：積木數量 = ${difference}（年齡差 ${large} − ${small}）`);
        }
      }

      if (ok) { setSetupError(''); setPhase('filling'); }
    };

    const maxN = Math.max(300, (config.target || config.multiple ? large * config.multiple + 20 : large) * 2 + 50);
    const prevMax = Math.max(setupA, setupB, config.target || large, 1);
    const prevBar = prevMax > BAR_THRESHOLD;

    return (
      <div>
        <h1>🧱 和差積木教具</h1>
        <div className="card">
          <div className="problem-text">{problem}</div>
          <div className="phase-badge">
            {type === 'transfer_after' && strategy === 'transfer' && '第一步：按照題目，把積木排好'}
            {type === 'transfer_after' && strategy === 'merge'    && '第一步：把積木全部合在一起'}
            {type === 'hecha'                                     && '第一步：決定積木的總數量'}
            {type === 'perimeter'                                 && '第一步：決定積木的數量'}
            {type === 'transfer_before'                           && `第一步：把${largeLabel}的積木排好`}
            {type === 'age_sum' && strategy === 'age_grow'        && '第一步：按照題目，把兩人年齡排好'}
            {type === 'age_sum' && strategy === 'age_hecha'       && '第一步：決定積木的總數量'}
            {type === 'age_multiple' && strategy === 'mul_parts'  && '第一步：決定積木的數量（用差值）'}
          </div>

          {/* transfer_after — 各排一排 */}
          {type === 'transfer_after' && strategy === 'transfer' && (
            <>
              <div style={{ fontSize:15, color:'#555', marginBottom:12, lineHeight:1.7 }}>
                先按照題目，把{largeLabel}和{smallLabel}的積木分別排好。
              </div>
              <Stepper value={setupA} onChange={v => { setSetupA(v); setSetupError(''); }}
                label={`${largeLabel}（${unit}）`} color={BLUE} max={maxN} />
              <Stepper value={setupB} onChange={v => { setSetupB(v); setSetupError(''); }}
                label={`${smallLabel}（${unit}）`} color={BLUE} max={maxN} />
              {(setupA > 0 || setupB > 0) && (
                <div className="viz-area" style={{ marginTop:8 }}>
                  <BlockRow baseVal={setupA} diffVal={0} rowLabel={largeLabel} maxVal={prevMax} useBar={prevBar} />
                  <BlockRow baseVal={setupB} diffVal={0} rowLabel={smallLabel} maxVal={prevMax} useBar={prevBar} />
                </div>
              )}
            </>
          )}

          {/* transfer_after — 合在一起 */}
          {type === 'transfer_after' && strategy === 'merge' && (
            <>
              <div style={{ fontSize:15, color:'#555', marginBottom:12, lineHeight:1.7 }}>
                把{largeLabel}和{smallLabel}的{unit}全部合在一起，共有幾顆？
              </div>
              <Stepper value={setupA} onChange={v => { setSetupA(v); setSetupError(''); }}
                label={`合計（${unit}）`} color={BLUE} max={maxN} />
              {setupA > 0 && (
                <div className="viz-area" style={{ marginTop:8 }}>
                  <BlockRow baseVal={setupA} diffVal={0} rowLabel="全部" maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
                </div>
              )}
            </>
          )}

          {/* hecha */}
          {type === 'hecha' && (
            <>
              <div style={{ fontSize:15, color:'#555', marginBottom:12, lineHeight:1.7 }}>
                你打算用幾個積木來排？（積木總數就是兩個數加在一起）
              </div>
              <Stepper value={setupA} onChange={v => { setSetupA(v); setSetupError(''); }}
                label="積木總數" color={BLUE} max={maxN} />
              {setupA > 0 && (
                <div className="viz-area" style={{ marginTop:8 }}>
                  <BlockRow baseVal={setupA} diffVal={0} rowLabel="全部" maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
                </div>
              )}
            </>
          )}

          {/* perimeter */}
          {type === 'perimeter' && (
            <>
              <div style={{ fontSize:15, color:'#555', marginBottom:12, lineHeight:1.7 }}>
                積木代表長＋寬（不是整條繩子），你打算用幾個積木？
              </div>
              <Stepper value={setupA} onChange={v => { setSetupA(v); setSetupError(''); }}
                label="積木數量" color={BLUE} max={maxN} />
              {setupA > 0 && (
                <div className="viz-area" style={{ marginTop:8 }}>
                  <BlockRow baseVal={setupA} diffVal={0} rowLabel="長＋寬" maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
                </div>
              )}
            </>
          )}

          {/* transfer_before */}
          {type === 'transfer_before' && (
            <>
              <div style={{ fontSize:15, color:'#555', marginBottom:12, lineHeight:1.7 }}>
                先把{largeLabel}的積木排出來。
              </div>
              <Stepper value={setupA} onChange={v => { setSetupA(v); setSetupError(''); }}
                label={`${largeLabel}（${unit}）`} color={BLUE} max={maxN} />
              {setupA > 0 && (
                <div className="viz-area" style={{ marginTop:8 }}>
                  <BlockRow baseVal={setupA} diffVal={0} rowLabel={largeLabel} maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
                </div>
              )}
            </>
          )}

          {/* age_sum — 逐年增加 */}
          {type === 'age_sum' && strategy === 'age_grow' && (
            <>
              <div style={{ fontSize:15, color:'#555', marginBottom:12, lineHeight:1.7 }}>
                先按照題目，把{largeLabel}和{smallLabel}現在的年齡各排一排。
              </div>
              <Stepper value={setupA} onChange={v => { setSetupA(v); setSetupError(''); }}
                label={`${largeLabel}（${unit}）`} color={BLUE} max={maxN} />
              <Stepper value={setupB} onChange={v => { setSetupB(v); setSetupError(''); }}
                label={`${smallLabel}（${unit}）`} color={BLUE} max={maxN} />
              {(setupA > 0 || setupB > 0) && (
                <div className="viz-area" style={{ marginTop:8 }}>
                  <BlockRow baseVal={setupA} diffVal={0} rowLabel={largeLabel} maxVal={prevMax} useBar={prevBar} />
                  <BlockRow baseVal={setupB} diffVal={0} rowLabel={smallLabel} maxVal={prevMax} useBar={prevBar} />
                  <div className="pool-counter">現在合計：<span>{setupA + setupB}</span> {unit}</div>
                </div>
              )}
            </>
          )}

          {/* age_multiple — 按份數排 */}
          {type === 'age_multiple' && strategy === 'mul_parts' && (
            <>
              <div style={{ fontSize:15, color:'#555', marginBottom:12, lineHeight:1.7 }}>
                這次用兩人的「年齡差」當積木數量，要拿幾個？
              </div>
              <Stepper value={setupA} onChange={v => { setSetupA(v); setSetupError(''); }}
                label="積木數量（年齡差）" color={GREEN} max={maxN} />
              {setupA > 0 && (
                <div className="viz-area" style={{ marginTop:8 }}>
                  <BlockRow baseVal={setupA} diffVal={0} rowLabel="差值" maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
                </div>
              )}
            </>
          )}

          {/* age_sum — 和差積木 */}
          {type === 'age_sum' && strategy === 'age_hecha' && (
            <>
              <div style={{ fontSize:15, color:'#555', marginBottom:12, lineHeight:1.7 }}>
                這次拿「未來兩人年齡和」那麼多個積木來排。要拿幾個？
              </div>
              <Stepper value={setupA} onChange={v => { setSetupA(v); setSetupError(''); }}
                label="積木總數" color={BLUE} max={maxN} />
              {setupA > 0 && (
                <div className="viz-area" style={{ marginTop:8 }}>
                  <BlockRow baseVal={setupA} diffVal={0} rowLabel="全部" maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
                </div>
              )}
            </>
          )}

          {setupError && (
            <div className="warning-box" style={{ marginTop:10 }}>🤔 {setupError}</div>
          )}

          <button className="btn-primary" style={{ marginTop:14 }} onClick={checkSetup}
            disabled={setupA === 0 && setupB === 0}>
            開始操作積木 →
          </button>
          {(type === 'transfer_after' || type === 'age_sum') && (
            <button className="btn-secondary" onClick={() => { setSetupError(''); setPhase('strategy'); }}>
              ← 換個方法
            </button>
          )}
          <button className="btn-secondary" onClick={backToInput}>換一題</button>
        </div>
      </div>
    );
  }

  /* ── 操作積木（filling 階段）── */
  if (phase === 'filling') {

    const checkAnswer = () => {
      setFillError('');

      if (type === 'hecha' || type === 'perimeter') {
        const remaining = setupA - (userDiff + 2 * userBase);
        if (Number(userDiff) === Number(difference) && Number(userBase) === Number(base)) {
          setPhase('selectLabel');
        } else {
          if (remaining !== 0)
            setFillError('積木還沒用完，或用超了，再調整看看！');
          else
            setFillError('排法不太對，再想想差值和底數分別是幾個？');
        }
      }

      else if (type === 'transfer_after') {
        if (strategy === 'transfer') {
          const after1 = large - userMove;
          const after2 = small + userMove;
          const gap = after1 - after2;
          if (gap === 0) {
            setSolveMethod('transfer');
            setPhase('correct');
          } else if (gap < 0) {
            setFillError('移太多了！甲箱反而比乙箱少了，再試試看。');
          } else {
            if (gap <= 4) setFillError(`快到了！還差一點，再試試看？`);
            else setFillError('兩排還不一樣多，繼續調整看看！');
          }
        } else {
          const correctSplit = base + moveAmount; // e.g. 32+5=37
          if (Number(userSplit) === correctSplit) {
            setSolveMethod('merge');
            setPhase('correct');
          } else if (userSplit > correctSplit) {
            setFillError(`每排分得太多了！${setupA}個平分成兩份，每份應該少一點。`);
          } else if (userSplit > 0) {
            setFillError(`每排分得太少了！${setupA}個平分成兩份，每份應該多一點。`);
          } else {
            setFillError('先填填看每排平分後是幾個！');
          }
        }
      }

      else if (type === 'transfer_before') {
        if (Number(userSmall) === Number(small)) {
          setPhase('correct');
        } else {
          setFillError('再想想！用大數和移轉量算算看。');
        }
      }

      else if (type === 'age_multiple') {
        const { multiple, answer: ageAns } = config;
        // mul_parts 兩步驟：step1=確認份數(userDiff)，step2=每份幾個(userBase)
        const correctParts = multiple - 1;
        const correctPer   = Math.floor(difference / correctParts);
        if (userDiff === 0) {
          setFillError(`先想想看：這 ${difference} 個積木代表幾份？`);
        } else if (Number(userDiff) !== correctParts) {
          setFillError(`份數不對！${largeLabel}是${smallLabel}的${multiple}倍，${largeLabel}幾份？${smallLabel}幾份？差了幾份？`);
        } else if (userBase === 0) {
          setFillError(`份數答對了！現在填每份幾個積木？`);
        } else {
          const remaining3 = setupA - userBase * correctParts;
          if (Number(userBase) === correctPer && remaining3 === 0) {
            setSolveMethod('mul_parts');
            setPhase('correct');
          } else if (remaining3 < 0) {
            setFillError(`每份填太多了！${difference}個積木分成${correctParts}份，每份應該少一點。`);
          } else {
            setFillError(`還沒分完！${difference}個積木要剛好分成${correctParts}份，每份再少一點試試。`);
          }
        }
      }

      else if (type === 'age_sum') {
        const { target, answer } = config;
        if (strategy === 'age_grow') {
          // userMove = 幾年後
          const sumAfter = large + small + userMove * 2;
          if (sumAfter === target) {
            setSolveMethod('age_grow');
            setPhase('correct');
          } else if (sumAfter > target) {
            setFillError('加太多年了！兩人年齡和超過目標了，少加幾年？');
          } else {
            const remain = target - sumAfter;
            if (remain <= 4) setFillError(`快到了！再各加 ${remain/2} 年試試看？`);
            else setFillError('兩人年齡和還沒到目標，繼續增加年數看看！');
          }
        } else {
          // age_hecha：userDiff=差值, userBase=小數未來歲數
          // 正確：userDiff === difference，userBase === small + answer
          const futureSmall = small + answer;
          if (Number(userDiff) === Number(difference) && Number(userBase) === futureSmall) {
            setSolveMethod('age_hecha');
            setPhase('correct');
          } else {
            const remaining = setupA - (userDiff + 2 * userBase);
            if (remaining !== 0)
              setFillError('積木還沒用完，或用超了，再調整看看！');
            else
              setFillError('排法不太對！差值就是兩人的年齡差，底數就是較小的那排。');
          }
        }
      }
    };

    /* 積木視覺 */
    const renderViz = () => {
      if (type === 'transfer_after' && strategy === 'transfer') {
        const after1 = large - userMove;
        const after2 = small + userMove;
        const gap    = after1 - after2;
        const equal  = gap === 0;
        const greenOn1 = Math.max(0, difference - userMove);
        const greenOn2 = Math.min(userMove, difference);
        return (
          <div>
            <div style={{ textAlign:'center', fontSize:13, color: equal ? '#68B34A' : '#888', fontWeight: equal ? 700 : 400, marginBottom:4 }}>
              {equal ? '✔ 兩排一樣長了！' : `移動中…`}
            </div>
            <div className="viz-area">
              <BlockRow baseVal={small} diffVal={greenOn1} rowLabel={largeLabel} maxVal={large} useBar={useBar} />
              <BlockRow baseVal={small} diffVal={greenOn2} rowLabel={smallLabel} maxVal={large} useBar={useBar} />
            </div>
            {gap < 0 && (
              <div className="warning-box">🤔 {largeLabel}比{smallLabel}還少了，移多了喔！</div>
            )}
          </div>
        );
      }

      if (type === 'transfer_after' && strategy === 'merge') {
        const total        = large + small;
        const correctSplit = base + moveAmount; // 37
        const isCorrect    = userSplit === correctSplit;
        return (
          <div>
            <div style={{ textAlign:'center', fontSize:13, color:'#888', marginBottom:4 }}>
              合在一起，共 {total} 個
            </div>
            <div className="viz-area">
              <BlockRow baseVal={total} diffVal={0} rowLabel="全部" maxVal={total} useBar={useBar} />
            </div>
            {userSplit > 0 && (
              <>
                <div style={{ textAlign:'center', fontSize:13,
                  color: isCorrect ? '#68B34A' : '#888',
                  fontWeight: isCorrect ? 700 : 400, margin:'8px 0 4px' }}>
                  {isCorrect ? `✔ 平分後每排 ${userSplit} 個！` : `平分後每排幾個？`}
                </div>
                <div className="viz-area">
                  <BlockRow baseVal={userSplit} diffVal={0} rowLabel={largeLabel} maxVal={total} useBar={useBar} />
                  <BlockRow baseVal={userSplit} diffVal={0} rowLabel={smallLabel} maxVal={total} useBar={useBar} />
                </div>
              </>
            )}
          </div>
        );
      }

      if (type === 'hecha' || type === 'perimeter') {
        const remaining = setupA - (userDiff + 2 * userBase);
        const showWarn  = type === 'perimeter' && (userDiff + 2 * userBase) > setupA;
        return (
          <div>
            <div className="viz-area">
              <BlockRow baseVal={userBase} diffVal={userDiff}
                rowLabel="第一排" maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
              <BlockRow baseVal={userBase} diffVal={0}
                rowLabel="第二排" maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
              <div className="pool-counter">
                剩餘積木：<span style={{ color: remaining < 0 ? '#E53935' : undefined }}>
                  {remaining < 0 ? `超出 ${-remaining} 個！` : remaining}
                </span> / {setupA}
              </div>
            </div>
            {showWarn && (
              <div className="warning-box">🤔 想一想，為什麼積木數量不是 {setupA * 2} 個？</div>
            )}
          </div>
        );
      }

      if (type === 'transfer_before') {
        return (
          <div>
            <div style={{ textAlign:'center', fontSize:13, color:'#888', marginBottom:4 }}>移動前 ↓</div>
            <div className="viz-area">
              <BlockRow baseVal={large} diffVal={0} rowLabel={largeLabel} maxVal={large} useBar={useBar} />
              <BlockRow baseVal={userSmall} diffVal={0} rowLabel={smallLabel} maxVal={large} useBar={useBar} />
            </div>
          </div>
        );
      }

      if (type === 'age_multiple' && strategy === 'mul_parts') {
        const correctParts = config.multiple - 1;
        const correctPer   = Math.floor(difference / correctParts);
        const partsOK      = userDiff === correctParts;
        const perVal       = userBase > 0 ? userBase : 0;
        const remaining3   = setupA - perVal * correctParts;
        const perOK        = partsOK && perVal === correctPer && remaining3 === 0;
        // 每份大小用於繪製份數圖（若userBase=0先用1讓方塊可見）
        const blockW       = perVal > 0 ? Math.max(10, Math.min(60, Math.round(220 / config.multiple))) : 20;

        return (
          <div>
            {/* 份數概念提示 */}
            <div style={{ background:'#FFF8EE', borderRadius:10, padding:'10px 12px', marginBottom:10 }}>
              <div style={{ fontSize:13, color:'#888', marginBottom:8 }}>想想看倍數的意思：</div>
              <div style={{ display:'flex', alignItems:'center', gap:4, marginBottom:6 }}>
                <span style={{ fontSize:13, minWidth:56, color:'#555', flexShrink:0 }}>{largeLabel}</span>
                <div style={{ display:'flex', gap:3 }}>
                  {Array.from({length: config.multiple}).map((_,i) => (
                    <div key={i} style={{ width:blockW, height:28, borderRadius:4,
                      background: BLUE, border:'1px solid rgba(0,0,0,0.1)',
                      display:'flex', alignItems:'center', justifyContent:'center',
                      fontSize:11, color:'white', fontWeight:700 }}>□</div>
                  ))}
                </div>
                <span style={{ fontSize:12, color:'#888', marginLeft:4 }}>（{config.multiple}份）</span>
              </div>
              <div style={{ display:'flex', alignItems:'center', gap:4, marginBottom:6 }}>
                <span style={{ fontSize:13, minWidth:56, color:'#555', flexShrink:0 }}>{smallLabel}</span>
                <div style={{ display:'flex', gap:3 }}>
                  <div style={{ width:blockW, height:28, borderRadius:4,
                    background: BLUE, border:'1px solid rgba(0,0,0,0.1)',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    fontSize:11, color:'white', fontWeight:700 }}>□</div>
                </div>
                <span style={{ fontSize:12, color:'#888', marginLeft:4 }}>（1份）</span>
              </div>
              <div style={{ fontSize:13, color:'#D4690A', fontWeight:600 }}>
                → 差了 {config.multiple}－1＝{config.multiple-1} 份，這 {difference} 個積木就代表 {config.multiple-1} 份
              </div>
            </div>

            {/* Step 2：學生答對份數後，顯示份數積木圖 */}
            {partsOK && (
              <div className="viz-area">
                <div style={{ fontSize:13, color: perOK ? '#68B34A' : '#888',
                  fontWeight: perOK ? 700 : 400, marginBottom:8, textAlign:'center' }}>
                  {perOK
                    ? `✔ 每份 ${perVal} 個！`
                    : `把 ${setupA} 個積木平分成 ${correctParts} 份，每份幾個？`}
                </div>
                {/* 媽媽那排：multiple 份 */}
                <div className="row-wrap">
                  <span className="row-label">{largeLabel}</span>
                  <div style={{ display:'flex', gap:2, flexWrap:'wrap' }}>
                    {Array.from({length: config.multiple}).map((_, pi) => (
                      <div key={pi} style={{ display:'flex', gap:1 }}>
                        {perVal > 0 && !useBar
                          ? Array.from({length: perVal}).map((__, bi) => (
                              <div key={bi} style={{ width:22, height:32, borderRadius:4,
                                background: BLUE, border:'1px solid rgba(0,0,0,0.12)' }} />
                            ))
                          : <div style={{ width: Math.max(10, Math.round(perVal * (VIZ_WIDTH/4) / (config.multiple * correctPer || 1))),
                              height:32, borderRadius:4, background: BLUE,
                              border:'1px solid rgba(0,0,0,0.1)', minWidth:12 }} />
                        }
                        {pi < config.multiple - 1 && <div style={{ width:3 }} />}
                      </div>
                    ))}
                  </div>
                  {perOK && <span className="row-total">{config.multiple * perVal} {unit}</span>}
                </div>
                {/* 兒子那排：1 份 */}
                <div className="row-wrap">
                  <span className="row-label">{smallLabel}</span>
                  <div style={{ display:'flex', gap:1 }}>
                    {perVal > 0 && !useBar
                      ? Array.from({length: perVal}).map((__, bi) => (
                          <div key={bi} style={{ width:22, height:32, borderRadius:4,
                            background: BLUE, border:'1px solid rgba(0,0,0,0.12)' }} />
                        ))
                      : <div style={{ width: Math.max(10, Math.round(perVal * (VIZ_WIDTH/4) / (config.multiple * correctPer || 1))),
                          height:32, borderRadius:4, background: BLUE,
                          border:'1px solid rgba(0,0,0,0.1)', minWidth:12 }} />
                    }
                  </div>
                  {perOK && <span className="row-total">{perVal} {unit}</span>}
                </div>
                <div className="pool-counter">
                  剩餘積木：<span style={{ color: remaining3 < 0 ? '#E53935' : undefined }}>
                    {remaining3 < 0 ? `超出 ${-remaining3} 個！` : remaining3}
                  </span> / {setupA}
                </div>
              </div>
            )}
          </div>
        );
      }

      if (type === 'age_sum' && strategy === 'age_grow') {
        const nowSum   = large + small;
        const futureL  = large + userMove;
        const futureS  = small + userMove;
        const futureSum= futureL + futureS;
        const reached  = futureSum === config.target;
        const barMax   = Math.max(config.target, futureL, 1);
        const bar      = barMax > BAR_THRESHOLD;
        return (
          <div>
            <div style={{ textAlign:'center', fontSize:13, color: reached ? '#68B34A' : '#888',
              fontWeight: reached ? 700 : 400, marginBottom:4 }}>
              {reached ? `✔ 兩人年齡和剛好是 ${config.target} ${unit}！` : `目標：兩人合計 ${config.target} ${unit}，現在合計 ${nowSum}`}
            </div>
            <div className="viz-area">
              <BlockRow baseVal={large} diffVal={userMove} rowLabel={`${largeLabel}（現在${large}，加${userMove}年）`} maxVal={barMax} useBar={bar} />
              <BlockRow baseVal={small} diffVal={userMove} rowLabel={`${smallLabel}（現在${small}，加${userMove}年）`} maxVal={barMax} useBar={bar} />
              <div className="pool-counter">{userMove}年後合計：<span style={{ color: futureSum > config.target ? '#E53935' : futureSum === config.target ? '#68B34A' : undefined }}>{futureSum}</span> / 目標 {config.target}</div>
            </div>
          </div>
        );
      }

      if (type === 'age_sum' && strategy === 'age_hecha') {
        const remaining2 = setupA - (userDiff + 2 * userBase);
        const futureSmall = small + config.answer;
        const correct2 = userDiff === difference && userBase === futureSmall;
        return (
          <div>
            <div style={{ textAlign:'center', fontSize:13, color: correct2 ? '#68B34A' : '#888',
              fontWeight: correct2 ? 700 : 400, marginBottom:4 }}>
              {correct2 ? '✔ 排好了！' : `共 ${setupA} 個積木，兩人年齡差（綠色）+ 兩個底數（藍色）= ${setupA}`}
            </div>
            <div className="viz-area">
              <BlockRow baseVal={userBase} diffVal={userDiff}
                rowLabel={`${largeLabel}未來`} maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
              <BlockRow baseVal={userBase} diffVal={0}
                rowLabel={`${smallLabel}未來`} maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
              <div className="pool-counter">
                剩餘積木：<span style={{ color: remaining2 < 0 ? '#E53935' : undefined }}>
                  {remaining2 < 0 ? `超出 ${-remaining2} 個！` : remaining2}
                </span> / {setupA}
              </div>
            </div>
          </div>
        );
      }

      return null;
    };

    const remaining = (type === 'hecha' || type === 'perimeter')
      ? setupA - (userDiff + 2 * userBase)
      : (type === 'age_sum' && strategy === 'age_hecha')
      ? setupA - (userDiff + 2 * userBase) : null;

    return (
      <div>
        <h1>🧱 和差積木教具</h1>
        <div className="card">
          <div className="problem-text">{problem}</div>
          <div className="phase-badge">第二步：操作積木</div>
          {renderViz()}

          {type === 'transfer_after' && strategy === 'transfer' && (
            <Stepper value={userMove} onChange={setUserMove}
              label={`從${largeLabel}移到${smallLabel}`} color={GREEN} max={large} />
          )}
          {type === 'transfer_after' && strategy === 'merge' && (
            <Stepper value={userSplit} onChange={setUserSplit}
              label="每排幾個" color={BLUE} max={large + small} />
          )}
          {(type === 'hecha' || type === 'perimeter') && (
            <>
              {type === 'perimeter' && (
                <div style={{ fontSize:13, color:'#888', marginBottom:10 }}>
                  提示：積木代表長＋寬（不是全部的繩子喔！）
                </div>
              )}
              <Stepper value={userDiff} onChange={setUserDiff}
                label="差值（綠色）" color={GREEN} max={setupA} />
              <Stepper value={userBase} onChange={setUserBase}
                label="底數（藍色）" color={BLUE} max={setupA} />
            </>
          )}
          {type === 'transfer_before' && (
            <div className="move-input-wrap">
              <div className="move-question">{smallLabel}原來有幾{unit}？</div>
              <Stepper value={userSmall} onChange={setUserSmall}
                label={smallLabel} color={BLUE} max={poolSize} />
            </div>
          )}

          {type === 'age_multiple' && strategy === 'mul_parts' && (
            <>
              <Stepper value={userDiff} onChange={v => { setUserDiff(v); setFillError(''); }}
                label={`差值代表幾份？`} color={GREEN} max={config.multiple * 2} />
              {userDiff === config.multiple - 1 && (
                <Stepper value={userBase} onChange={v => { setUserBase(v); setFillError(''); }}
                  label="每份幾個積木？" color={BLUE} max={setupA} />
              )}
            </>
          )}

          {type === 'age_sum' && strategy === 'age_grow' && (
            <Stepper value={userMove} onChange={setUserMove}
              label={`幾${config.timeUnit}後`} color={GREEN}
              max={config.target * 2} />
          )}
          {type === 'age_sum' && strategy === 'age_hecha' && (
            <>
              <div style={{ fontSize:13, color:'#888', marginBottom:8 }}>
                提示：兩人的年齡差永遠不變，先排差值（綠色），再排兩個底數（藍色）。
              </div>
              <Stepper value={userDiff} onChange={setUserDiff}
                label="年齡差（綠色）" color={GREEN} max={setupA} />
              <Stepper value={userBase} onChange={setUserBase}
                label="底數（藍色）" color={BLUE} max={setupA} />
            </>
          )}

          {fillError && <div className="error-msg">{fillError}</div>}

          <button className="btn-primary" onClick={checkAnswer} style={{ marginTop:14 }}
            disabled={
              ((type==='hecha'||type==='perimeter') && remaining !== 0) ||
              (type==='age_sum' && strategy==='age_hecha' && remaining !== 0) ||
              (type==='age_multiple' && strategy==='mul_parts' && (
                userDiff !== config.multiple-1 || (setupA - userBase*(config.multiple-1)) !== 0
              ))
            }>
            ✅ 確認答案
          </button>
          <button className="btn-secondary" onClick={() => { setFillError(''); setPhase('setup'); }}>
            ← 重新排積木
          </button>
          <button className="btn-secondary" onClick={backToInput}>換一題</button>
        </div>
      </div>
    );
  }

  /* ── 選擇哪列是大數（hecha/perimeter） ── */
  if (phase === 'selectLabel') {
    const selectLabelFn = (chosenLarge) => {
      if (chosenLarge === config.largeLabel) {
        setWrongSelect(false);
        setPhase('correct');
      } else {
        setWrongSelect(true);
      }
    };
    return (
      <div>
        <h1>🧱 和差積木教具</h1>
        <div className="card">
          <div className="problem-text">{problem}</div>
          <div className="viz-area">
            <BlockRow baseVal={userBase} diffVal={userDiff}
              rowLabel="第一排" maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
            <BlockRow baseVal={userBase} diffVal={0}
              rowLabel="第二排" maxVal={setupA} useBar={setupA > BAR_THRESHOLD} />
          </div>
          <div className="select-label-prompt">哪一排比較多？</div>
          <div className="select-btn-wrap">
            <button className={`select-btn ${wrongSelect ? 'wrong' : ''}`}
              onClick={() => selectLabelFn(largeLabel)}>{largeLabel}</button>
            <button className={`select-btn ${wrongSelect ? 'wrong' : ''}`}
              onClick={() => selectLabelFn(smallLabel)}>{smallLabel}</button>
          </div>
          {wrongSelect && (
            <div className="error-msg" style={{ marginTop:10 }}>再想想！題目說誰比較多？</div>
          )}
        </div>
      </div>
    );
  }

  /* ── 答對 / 解說 ── */
  if (phase === 'correct' || phase === 'explaining') {
    const isTransfer   = type === 'transfer_after';
    const isAgeSum     = type === 'age_sum';
    const isAgeMul     = type === 'age_multiple';
    const hasTwoMethods = isTransfer || isAgeSum;
    const { target, answer: ageAnswer, timeUnit, multiple } = config;

    const VizCorrect = () => {
      if (isTransfer) {
        return (
          <div>
            <div style={{ textAlign:'center', fontSize:13, color:'#68B34A', fontWeight:700, marginBottom:4 }}>
              移動後 ✔
            </div>
            <div className="viz-area">
              <BlockRow baseVal={base + moveAmount} diffVal={0} rowLabel={largeLabel} maxVal={large} useBar={useBar} />
              <BlockRow baseVal={base + moveAmount} diffVal={0} rowLabel={smallLabel} maxVal={large} useBar={useBar} />
            </div>
            <div style={{ textAlign:'center', fontSize:13, color:'#68B34A', fontWeight:700, marginTop:4 }}>
              兩排一樣長！各 {base + moveAmount} {unit}
            </div>
          </div>
        );
      }
      if (isAgeSum) {
        const futureL = large + ageAnswer;
        const futureS = small + ageAnswer;
        const barMax  = Math.max(target, futureL, 1);
        const bar     = barMax > BAR_THRESHOLD;
        return (
          <div>
            <div style={{ textAlign:'center', fontSize:13, color:'#68B34A', fontWeight:700, marginBottom:4 }}>
              {ageAnswer} {timeUnit}後 ✔
            </div>
            <div className="viz-area">
              <BlockRow baseVal={large} diffVal={ageAnswer} rowLabel={`${largeLabel}（${futureL}${unit}）`} maxVal={barMax} useBar={bar} />
              <BlockRow baseVal={small} diffVal={ageAnswer} rowLabel={`${smallLabel}（${futureS}${unit}）`} maxVal={barMax} useBar={bar} />
              <div className="pool-counter">合計：<span>{futureL + futureS}</span> {unit} ✔</div>
            </div>
          </div>
        );
      }
      if (isAgeMul) {
        const futureL    = large + ageAnswer;   // 媽媽未來年齡 = multiple 份
        const futureS    = small + ageAnswer;   // 兒子未來年齡 = 1 份
        // 用每份(=futureS)的積木呈現份數結構
        const perPart    = futureS;
        const blockW     = perPart <= 10 ? 22 : perPart <= 20 ? 16 : 0; // 0=改用色條
        const usePartsBar= blockW === 0;
        const partWidth  = usePartsBar ? Math.round((VIZ_WIDTH - (multiple - 1) * 4) / multiple) : null;

        // 畫一份的積木（個別方塊或色條）
        const OnePart = ({ color, label }) => (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:2 }}>
            {usePartsBar ? (
              <div style={{ width:partWidth, height:32, borderRadius:5,
                background:color, border:'1px solid rgba(0,0,0,0.12)',
                display:'flex', alignItems:'center', justifyContent:'center',
                fontSize:11, color:'rgba(255,255,255,0.9)', fontWeight:700 }}>
                {perPart}
              </div>
            ) : (
              <div style={{ display:'flex', gap:1 }}>
                {Array.from({length: perPart}).map((_,i) => (
                  <div key={i} style={{ width:blockW, height:32, borderRadius:4,
                    background:color, border:'1px solid rgba(0,0,0,0.12)', flexShrink:0 }} />
                ))}
              </div>
            )}
          </div>
        );

        return (
          <div>
            <div style={{ textAlign:'center', fontSize:13, color:'#68B34A', fontWeight:700, marginBottom:8 }}>
              {ageAnswer} {timeUnit}後 ✔
            </div>
            <div className="viz-area">
              {/* 媽媽：multiple 份藍色，和平分時的藍色積木一致 */}
              <div className="row-wrap" style={{ alignItems:'flex-start' }}>
                <span className="row-label">{largeLabel}</span>
                <div style={{ display:'flex', gap:4, flexWrap:'wrap' }}>
                  {Array.from({length: multiple}).map((_,i) => (
                    <OnePart key={i} color={BLUE} />
                  ))}
                </div>
                <span className="row-total">{futureL} {unit}</span>
              </div>
              {/* 兒子：1 份藍色，和平分時每份顏色一致 */}
              <div className="row-wrap">
                <span className="row-label">{smallLabel}</span>
                <OnePart color={BLUE} />
                <span className="row-total">{futureS} {unit}</span>
              </div>
              <div style={{ textAlign:'center', fontSize:13, color:'#555', marginTop:4 }}>
                每份 <strong>{perPart}</strong> {unit}，{largeLabel} {multiple} 份＝{futureL} {unit}，{smallLabel} 1 份＝{futureS} {unit}
              </div>
            </div>
            <div style={{ textAlign:'center', fontSize:15, color:'#68B34A', fontWeight:700, marginTop:4 }}>
              {futureL} ÷ {futureS} ＝ {multiple}，剛好是 {multiple} 倍！✔
            </div>
          </div>
        );
      }
      return (
        <div className="viz-area">
          <BlockRow baseVal={base} diffVal={difference} rowLabel={largeLabel} maxVal={large} useBar={useBar} />
          <BlockRow baseVal={base} diffVal={0} rowLabel={smallLabel} maxVal={large} useBar={useBar} />
        </div>
      );
    };

    return (
      <div>
        <h1>🧱 和差積木教具</h1>
        <div className="card">
          <div className="problem-text">{problem}</div>
          <VizCorrect />

          {isTransfer ? (
            <div className="move-answer">
              🎉 {largeLabel}要移 <span style={{ color:'#D4690A' }}>{moveAmount}</span> 個{unit}到{smallLabel}！
            </div>
          ) : isAgeSum ? (
            <div className="move-answer">
              🎉 <span style={{ color:'#D4690A' }}>{ageAnswer}</span> {timeUnit}後，兩人年齡和剛好是 {target} {unit}！
            </div>
          ) : isAgeMul ? (
            <div className="move-answer">
              🎉 <span style={{ color:'#D4690A' }}>{ageAnswer}</span> {timeUnit}後，{largeLabel}剛好是{smallLabel}的 {multiple} 倍！
            </div>
          ) : (
            <div className="answer-box">
              <div className="answer-row">
                <span className="answer-label">{largeLabel}</span>
                <span className="answer-val">{large} {unit}</span>
              </div>
              <div className="answer-row">
                <span className="answer-label">{smallLabel}</span>
                <span className="answer-val">{small} {unit}</span>
              </div>
            </div>
          )}

          {/* 提示另一種解法（transfer_after / age_sum，第一次答對，尚未嘗試另解） */}
          {hasTwoMethods && phase === 'correct' && !altDone && (
            <div className="alt-card">
              <div className="alt-card-title">💪 答對了！</div>
              <div className="alt-card-sub">這道題還有另一種積木排法，想挑戰看看嗎？</div>
              <button className="btn-primary" style={{ marginTop:0 }} onClick={tryAltMethod}>
                🔁 試試另一種解法
              </button>
            </div>
          )}

          {/* 兩種方法都試過 */}
          {hasTwoMethods && phase === 'correct' && altDone && (
            <div className="hint-box" style={{ marginBottom:12 }}>
              🌟 你兩種方法都試過了，非常厲害！來看看完整的解說吧。
            </div>
          )}

          {phase === 'explaining' && expl ? (
            <div className="expl-box">{expl}</div>
          ) : (
            <button className="btn-primary" onClick={fetchExpl} disabled={loadingX}>
              {loadingX ? '⏳ 載入中…' : '📝 查看完整解說與算式'}
            </button>
          )}

          <button className="btn-secondary" onClick={backToInput}>換一題</button>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
