  if (d.error) {
    const m = typeof d.error==='object' ? (d.error.message||'') : String(d.error);
    if (m.includes('high demand')||m.includes('429')||(d.error.code===429))
      throw new Error('AI 目前流量過大，請稍等 1 分鐘後再試。');
    throw new Error(m || '未知錯誤');
  }
  const txt = d?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!txt) throw new Error('找不到回應文字，請稍後再試。');
  return txt;
}

function Stepper({value,onChange,label,color,min=0,max=999}) {
  return (
    <div className="sr">
      <div className="sd" style={{background:color}}/>
      <span className="sl">{label}</span>
      <button className="sb" onClick={()=>onChange(Math.max(min,value-1))}>－</button>
      <input className="si" type="number" value={value}
        onChange={e=>{const v=parseInt(e.target.value);if(!isNaN(v))onChange(Math.max(min,Math.min(max,v)));}}/>
      <button className="sb" onClick={()=>onChange(Math.min(max,value+1))}>＋</button>
    </div>
  );
}

function Row({base=0,diff=0,label,maxV,bar,bc=BLUE,dc=GREEN}) {
  const tot=base+diff, sm=maxV>0?maxV:1, sc=VW/sm;
  const tex='repeating-linear-gradient(90deg,rgba(255,255,255,0)0,rgba(255,255,255,0)17px,rgba(255,255,255,.28)17px,rgba(255,255,255,.28)20px)';
  const blks=[];
  if(!bar){
    for(let i=0;i<base;i++)blks.push(<div key={'b'+i} style={{width:22,height:32,borderRadius:4,background:bc,border:'1px solid rgba(0,0,0,.12)',flexShrink:0}}/>);
    for(let i=0;i<diff;i++)blks.push(<div key={'d'+i} style={{width:22,height:32,borderRadius:4,background:dc,border:'1px solid rgba(0,0,0,.12)',flexShrink:0}}/>);
  }
  return (
    <div className="rw">
      <span className="rl">{label}</span>
      {!bar
        ? <div style={{display:'flex',gap:2,flexWrap:'wrap'}}>{blks}</div>
        : <div style={{display:'flex'}}>
            {base>0&&<div style={{width:Math.round(base*sc),height:32,background:bc,backgroundImage:tex,borderRadius:diff>0?'7px 0 0 7px':'7px',border:'1px solid rgba(0,0,0,.1)'}}/>}
            {diff>0&&<div style={{width:Math.round(diff*sc),height:32,background:dc,backgroundImage:tex,borderRadius:base>0?'0 7px 7px 0':'7px',border:'1px solid rgba(0,0,0,.1)',borderLeft:'none'}}/>}
          </div>}
      {tot>0&&<span className="rt">{tot}</span>}
    </div>
  );
}

/* 倍數視覺（age_multiple / diff_multiple 共用） */
function MulViz({mul,per,ll,sl,unit,topMsg}) {
  if(!per||per<=0) return null;
  const bw=per<=10?22:per<=20?14:0, usePB=bw===0;
  const pW=usePB?Math.round((VW-(mul-1)*4)/mul):null;
  const Part=({col})=>usePB
    ?<div style={{width:pW,height:32,borderRadius:5,background:col,border:'1px solid rgba(0,0,0,.12)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'rgba(255,255,255,.9)',fontWeight:700}}>{per}</div>
    :<div style={{display:'flex',gap:1}}>{Array.from({length:per}).map((_,i)=><div key={i} style={{width:bw,height:32,borderRadius:4,background:col,border:'1px solid rgba(0,0,0,.12)',flexShrink:0}}/>)}</div>;
  return (
    <div className="viz">
      {topMsg&&<div style={{textAlign:'center',fontSize:13,color:'#68B34A',fontWeight:700,marginBottom:8}}>{topMsg}</div>}
      <div className="rw">
        <span className="rl">{ll}</span>
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{Array.from({length:mul}).map((_,i)=><Part key={i} col={BLUE}/>)}</div>
        <span className="rt">{mul*per} {unit}</span>
      </div>
      <div className="rw">
        <span className="rl">{sl}</span>
        <Part col={BLUE}/>
        <span className="rt">{per} {unit}</span>
      </div>
    </div>
  );
}

function App() {
  const [prob,setProb]=useState('');
  const [cfg,setCfg]=useState(null);
  const [phase,setPhase]=useState('input');
  const [loading,setLoading]=useState(false);
  const [loadX,setLoadX]=useState(false);
  const [err,setErr]=useState('');
  const [expl,setExpl]=useState('');
  const [strat,setStrat]=useState('');
  const [sA,setSA]=useState(0);
  const [sB,setSB]=useState(0);
  const [sErr,setSErr]=useState('');
  const [sTry,setSTry]=useState(0);
  const [uMov,setUMov]=useState(0);
  const [uSpl,setUSpl]=useState(0);
  const [uDif,setUDif]=useState(0);
  const [uBas,setUBas]=useState(0);
  const [uSml,setUSml]=useState(0);
  const [uA,setUA]=useState(0);
  const [fErr,setFErr]=useState('');
  const [solM,setSolM]=useState('');
  const [wSel,setWSel]=useState(false);
  const [altD,setAltD]=useState(false);
  const [nbSh,setNbSh]=useState(false);

  const reset=()=>{
    setStrat('');setSA(0);setSB(0);setSErr('');setSTry(0);
    setUMov(0);setUSpl(0);setUDif(0);setUBas(0);setUSml(0);setUA(0);setFErr('');
    setSolM('');setWSel(false);setAltD(false);setExpl('');setNbSh(false);
  };
  const back=()=>{setCfg(null);setProb('');setPhase('input');reset();};

  const tryAlt=()=>{
    let alt;
    if(cfg.type==='age_sum') alt=strat==='age_grow'?'age_hecha':'age_grow';
    else if(cfg.type==='chicken_rabbit') alt=strat==='cr_large'?'cr_small':'cr_large';
    else alt=strat==='transfer'?'merge':'transfer';
    setStrat(alt);setSA(0);setSB(0);setSErr('');setSTry(0);
    setUMov(0);setUSpl(0);setUDif(0);setUBas(0);
    setUA(0); // 換掉的張數從 0 開始
    setFErr('');setAltD(true);setPhase('setup');
  };

  const generate=async()=>{
    if(!prob.trim())return;
    setLoading(true);setErr('');setCfg(null);reset();
    try{
      const raw=await callGemini(SYS,prob,1000);
      const strip=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```\s*$/i,'').trim();
      const m=strip.match(/\{[\s\S]*\}/);
      if(!m)throw new Error('AI未回傳JSON，請稍後再試。');
      const safe=m[0].replace(/("(?:[^"\\]|\\.)*")/g,s=>s.replace(/\n/g,'\\n').replace(/\r/g,'\\r').replace(/\t/g,'\\t'));
      let c;try{c=JSON.parse(safe);}catch(e){throw new Error('JSON解析失敗，請稍後再試。');}
      const ok=['hecha','perimeter','transfer_after','transfer_before','age_sum','age_multiple','diff_multiple','ratio_alloc','percentage','chicken_rabbit','non_block'];
      if(!ok.includes(c.type))throw new Error('題型辨識失敗：'+c.type);
      if(['transfer_after','transfer_before'].includes(c.type)){c.base=c.small;c.difference=c.large-c.small;}
      if(['age_sum','age_multiple'].includes(c.type))c.difference=c.large-c.small;
      if(c.type==='percentage'){if(!c.largeLabel)c.largeLabel=c.zoneALabel;if(!c.smallLabel)c.smallLabel=c.zoneBLabel;}
      setCfg(c);
      if(c.type==='non_block')setPhase('nonblock');
      else if(['transfer_after','age_sum','chicken_rabbit'].includes(c.type))setPhase('strategy');
      else if(['age_multiple','diff_multiple'].includes(c.type)){setStrat('mul');setPhase('setup');}
      else if(c.type==='percentage'){setSA(c.poolSize);setPhase('filling');}
      else setPhase('setup');
    }catch(e){setErr(e.message);}
    finally{setLoading(false);}
  };

  const getExpl=async()=>{
    setLoadX(true);
    let msg='題目：'+prob+'\n';
    if(cfg.type==='transfer_after'){
      const method=solM==='transfer'?'各排一排，再移動':'合在一起，再平分';
      msg+='學生使用的是「'+method+'」的操作方式。\n';
      msg+='請先說明學生用的操作方式，再介紹另一種，最後列出兩個完整算式。\n';
      msg+='數據：'+cfg.largeLabel+'='+cfg.large+cfg.unit+'，'+cfg.smallLabel+'='+cfg.small+cfg.unit+'，差='+cfg.difference+'，移轉量='+cfg.moveAmount+'，移後每'+cfg.unit+'='+(cfg.small+cfg.moveAmount);
    }else if(cfg.type==='age_sum'){
      const method=solM==='age_grow'?'逐年增加（兩排各加積木，合計達目標）':'用目標總數排積木（按年齡差排兩排）';
      msg+='學生使用的是「'+method+'」的操作方式。\n';
      msg+='請先說明學生用的操作方式，再介紹另一種，最後列出兩個完整算式。\n';
      msg+='數據：'+cfg.largeLabel+'現在='+cfg.large+cfg.unit+'，'+cfg.smallLabel+'現在='+cfg.small+cfg.unit+'，年齡差='+cfg.difference+'，目標和='+cfg.target+'，答案='+cfg.answer+cfg.timeUnit+'後，'+cfg.smallLabel+'未來='+(cfg.small+cfg.answer)+cfg.unit;
    }else if(cfg.type==='transfer_before'){
      const afterEach=cfg.large-cfg.moveAmount;
      msg+='移轉前求題：'+cfg.largeLabel+'原有'+cfg.large+cfg.unit+'，移了'+cfg.moveAmount+cfg.unit+'給'+cfg.smallLabel+'後兩人一樣多。\n';
      msg+='計算：移後每人='+cfg.large+'－'+cfg.moveAmount+'='+afterEach+cfg.unit+'，'+cfg.smallLabel+'原來='+afterEach+'－'+cfg.moveAmount+'='+cfg.small+cfg.unit+'。\n';
      msg+='答案：'+cfg.smallLabel+'原來有'+cfg.small+cfg.unit+'。';
    }else if(cfg.type==='age_multiple'){
      const cp=cfg.multiple-1;
      const fS=cfg.small+cfg.answer, fL=cfg.large+cfg.answer;
      msg+='倍數年齡題：'+cfg.largeLabel+'現在'+cfg.large+cfg.unit+'，'+cfg.smallLabel+'現在'+cfg.small+cfg.unit+'，幾'+cfg.timeUnit+'後'+cfg.largeLabel+'是'+cfg.smallLabel+'的'+cfg.multiple+'倍。\n';
      msg+='計算：年齡差='+cfg.difference+'（永遠不變），份數='+cfg.multiple+'－1='+cp+'份，每份='+cfg.difference+'÷'+cp+'='+fS+'（'+cfg.smallLabel+'未來歲數），幾'+cfg.timeUnit+'後='+fS+'－'+cfg.small+'='+cfg.answer+'。\n';
      msg+='驗算：'+fL+'÷'+fS+'='+cfg.multiple+'倍 ✓';
    }else if(cfg.type==='hecha'){
      const rem=cfg.poolSize-cfg.difference;
      msg+='和差題（積木操作解法）：和='+cfg.poolSize+'，差='+cfg.difference+'，答案：'+cfg.largeLabel+'='+cfg.large+cfg.unit+'，'+cfg.smallLabel+'='+cfg.small+cfg.unit+'。\n';
      msg+='計算：'+cfg.poolSize+'－'+cfg.difference+'='+rem+'，'+rem+'÷2='+cfg.small+'（小數），'+cfg.small+'＋'+cfg.difference+'='+cfg.large+'（大數）。\n';
      msg+='請按「取出差值→平分剩餘→加回差值」的積木觀察步驟說明，禁止說「是XXX的N倍」或「假設一樣多」。';
    }else if(cfg.type==='perimeter'){
      const halfP=cfg.poolSize, rem=halfP-cfg.difference;
      msg+='周長題（積木操作解法）：周長='+(halfP*2)+'，長＋寬='+halfP+'，差='+cfg.difference+'，答案：'+cfg.largeLabel+'='+cfg.large+cfg.unit+'，'+cfg.smallLabel+'='+cfg.small+cfg.unit+'。\n';
      msg+='計算：'+(halfP*2)+'÷2='+halfP+'（長＋寬），'+halfP+'－'+cfg.difference+'='+rem+'，'+rem+'÷2='+cfg.small+'（寬），'+cfg.small+'＋'+cfg.difference+'='+cfg.large+'（長）。\n';
      msg+='請按「周長÷2→取出差值→平分剩餘→加回差值」的積木觀察步驟說明，禁止說「是寬的N倍」或「假設一樣長」。';
    }else if(cfg.type==='diff_multiple'){
      msg+='差倍問題：'+cfg.largeLabel+'比'+cfg.smallLabel+'多'+cfg.difference+cfg.unit+'，'+cfg.largeLabel+'是'+cfg.smallLabel+'的'+cfg.multiple+'倍，答案：'+cfg.largeLabel+'='+cfg.large+cfg.unit+'，'+cfg.smallLabel+'='+cfg.small+cfg.unit;
    }else if(cfg.type==='ratio_alloc'){
      msg+='比值分配：'+cfg.largeLabel+':'+cfg.smallLabel+'='+cfg.ratioA+':'+cfg.ratioB+'，總量='+cfg.totalAmount+cfg.unit+'，答案：'+cfg.largeLabel+'='+cfg.answerA+cfg.unit+'，'+cfg.smallLabel+'='+cfg.answerB+cfg.unit;
    }else if(cfg.type==='percentage'){
      msg+='百分率：'+cfg.zoneALabel+'='+cfg.zoneAPct+'%，'+cfg.zoneBLabel+'='+cfg.zoneBPct+'%，已知'+cfg.knownAmount+cfg.unit+'對應'+cfg.knownPct+'%，答案='+cfg.unknownAmount+cfg.unit;
    }else if(cfg.type==='chicken_rabbit'){
      const usedLarge = solM==='cr_large';
      const assumedName = usedLarge ? cfg.largeLabel : cfg.smallLabel;
      const assumedVal  = usedLarge ? cfg.totalCount*cfg.valueA : cfg.totalCount*cfg.valueB;
      const gap         = Math.abs(cfg.totalValue - assumedVal);
      const perSwap     = Math.abs(cfg.valueA - cfg.valueB);
      const swapCount   = usedLarge ? cfg.countB : cfg.countA; // 換掉幾張
      const method1 = usedLarge
        ? '假設全是'+cfg.largeLabel+'（共'+cfg.totalCount+'×'+cfg.valueA+'＝'+assumedVal+cfg.valueUnit+'），比目標多了'+gap+cfg.valueUnit+'，每換一'+unit+cfg.largeLabel+'成'+cfg.smallLabel+'少'+perSwap+cfg.valueUnit+'，換掉'+swapCount+unit+'剛好'
        : '假設全是'+cfg.smallLabel+'（共'+cfg.totalCount+'×'+cfg.valueB+'＝'+assumedVal+cfg.valueUnit+'），比目標少了'+gap+cfg.valueUnit+'，每換一'+unit+cfg.smallLabel+'成'+cfg.largeLabel+'多'+perSwap+cfg.valueUnit+'，換掉'+swapCount+unit+'剛好';
      const swapCount2  = usedLarge ? cfg.countA : cfg.countB;
      const assumedVal2 = usedLarge ? cfg.totalCount*cfg.valueB : cfg.totalCount*cfg.valueA;
      const gap2        = Math.abs(cfg.totalValue - assumedVal2);
      const method2 = usedLarge
        ? '假設全是'+cfg.smallLabel+'（共'+cfg.totalCount+'×'+cfg.valueB+'＝'+assumedVal2+cfg.valueUnit+'），比目標少了'+gap2+cfg.valueUnit+'，每換一'+unit+cfg.smallLabel+'成'+cfg.largeLabel+'多'+perSwap+cfg.valueUnit+'，換掉'+swapCount2+unit+'剛好'
        : '假設全是'+cfg.largeLabel+'（共'+cfg.totalCount+'×'+cfg.valueA+'＝'+assumedVal2+cfg.valueUnit+'），比目標多了'+gap2+cfg.valueUnit+'，每換一'+unit+cfg.largeLabel+'成'+cfg.smallLabel+'少'+perSwap+cfg.valueUnit+'，換掉'+swapCount2+unit+'剛好';
      msg+='學生使用的是【'+assumedName+'假設法】。\n';
      msg+='解法一（學生用的）：'+method1+'。\n';
      msg+='解法二（另一種）：'+method2+'。\n';
      msg+='數據：'+cfg.largeLabel+'單價'+cfg.valueA+cfg.valueUnit+'，'+cfg.smallLabel+'單價'+cfg.valueB+cfg.valueUnit+'，共'+cfg.totalCount+unit+'合計'+cfg.totalValue+cfg.valueUnit+'，答案：'+cfg.largeLabel+'＝'+cfg.countA+unit+'，'+cfg.smallLabel+'＝'+cfg.countB+unit+'。\n';
      msg+='請先說明學生用的假設法步驟，再介紹另一種假設法，最後各列一個完整算式。';
    }else{
      msg+='請說明解題步驟。';
    }
    try{const t=await callGemini(EXPL,msg,1000);setExpl(t);setPhase('explaining');}
    catch(e){setExpl('載入失敗：'+e.message);setPhase('explaining');}
    finally{setLoadX(false);}
  };

  /* ── INPUT ── */
  if(!cfg)return(
    <div>
      <h1>🧱 數學積木教具</h1>
      <div className="card">
        <div className="stit">輸入題目</div>
        <textarea value={prob} onChange={e=>setProb(e.target.value)}
          placeholder={'在這裡輸入數學題目，例如：\n農夫摘了2箱橘子，甲箱42顆乙箱32顆，\n要從甲箱拿幾顆到乙箱才會一樣多？'}/>
        <button className="btn-p" onClick={generate} disabled={loading||!prob.trim()}>
          {loading?'⏳ AI 分析中…':'✨ 開始解題'}
        </button>
        {err&&<div className="err" style={{textAlign:'left',background:'#FFF5F5',border:'1px solid #FFCDD2',borderRadius:10,padding:'10px 14px',marginTop:10}}>❌ {err}</div>}
      </div>
    </div>
  );

  const {type,large,small,difference,base,moveAmount,largeLabel,smallLabel,unit,poolSize}=cfg;
  const ub=poolSize>BT;

  /* ── NON-BLOCK ── */
  if(phase==='nonblock')return(
    <div><h1>🧱 數學積木教具</h1>
      <div className="card">
        <div className="prob">{prob}</div>
        <div className="hint">💡 {cfg.hint}</div>
        {!nbSh
          ?<button className="btn-p" onClick={()=>setNbSh(true)}>📝 查看解題步驟</button>
          :<div className="nbs">
            {(cfg.steps||[]).map((s,i)=><div key={i} className="nbst">{i+1}. {s}</div>)}
            <div className="nba">{cfg.finalAnswer}</div>
          </div>}
        <button className="btn-s" onClick={back}>換一題</button>
      </div>
    </div>
  );

  /* ── STRATEGY ── */
  if(phase==='strategy'){
    const go=s=>{
      setStrat(s);setSA(0);setSB(0);setSErr('');setSTry(0);
      setUA(0); // 換掉的張數從 0 開始
      setPhase('setup');
    };
    return(
      <div><h1>🧱 數學積木教具</h1>
        <div className="card">
          <div className="prob">{prob}</div>
          <div style={{fontSize:17,fontWeight:700,textAlign:'center',marginBottom:16,color:'#333'}}>你打算怎麼操作積木？</div>
          {type==='transfer_after'&&<div className="stw">
            <button className="stb" onClick={()=>go('transfer')}>📦 各排一排<span className="sts">把兩箱各排好，再移動</span></button>
            <button className="stb" onClick={()=>go('merge')}>🔀 合在一起<span className="sts">全部合成一堆，再平分</span></button>
          </div>}
          {type==='age_sum'&&<div className="stw">
            <button className="stb" onClick={()=>go('age_grow')}>📅 逐年增加<span className="sts">兩排各排好，每年各加一個</span></button>
            <button className="stb" onClick={()=>go('age_hecha')}>🧩 用目標總數排<span className="sts">拿目標和的積木，按差值排兩排</span></button>
          </div>}
          {type==='chicken_rabbit'&&<div className="stw">
            <button className="stb" onClick={()=>go('cr_large')}>💰 假設全是{largeLabel}<span className="sts">先全排{largeLabel}，再換成{smallLabel}</span></button>
            <button className="stb" onClick={()=>go('cr_small')}>🪙 假設全是{smallLabel}<span className="sts">先全排{smallLabel}，再換成{largeLabel}</span></button>
          </div>}
          <button className="btn-s" onClick={back}>換一題</button>
        </div>
      </div>
    );
  }

  /* ── SETUP ── */
  if(phase==='setup'){
    const chk=()=>{
      const t=sTry+1;setSTry(t);let ok=false;
      const h=(a,b,c)=>{if(t===1)setSErr(a);else if(t===2)setSErr(b);else setSErr(c);};
      if(type==='hecha'){ok=sA===poolSize;if(!ok)h('兩個數加起來，積木要幾個？','提示：'+largeLabel+'+'+smallLabel+'=？','提示：共'+poolSize+'個');}
      else if(type==='perimeter'){ok=sA===poolSize;if(!ok){if(sA===poolSize*2)setSErr('積木只代表長＋寬，不是整條繩子！長＋寬＝周長÷2＝'+poolSize);else h('積木代表長＋寬，試試周長÷2。','提示：長＋寬＝'+poolSize,'提示：共'+poolSize+'個');}}
      else if(type==='transfer_after'&&strat==='transfer'){ok=sA===large&&sB===small;if(!ok){const wa=sA!==large,wb=sB!==small;h(wa&&wb?'兩邊都不對，找找題目。':wa?largeLabel+'數量不對。':smallLabel+'數量不對。','找找題目裡兩箱各有幾個？','提示：'+largeLabel+'='+large+'，'+smallLabel+'='+small);}}
      else if(type==='transfer_after'&&strat==='merge'){ok=sA===large+small;if(!ok)h(largeLabel+'加'+smallLabel+'共幾個？','提示：'+large+'＋'+small+'＝？','提示：'+large+'＋'+small+'＝'+(large+small));}
      else if(type==='transfer_before'){ok=sA===large;if(!ok)h('題目裡'+largeLabel+'有幾個？','再找找'+largeLabel+'的數量。','提示：'+largeLabel+'＝'+large);}
      else if(type==='age_sum'&&strat==='age_grow'){ok=sA===large&&sB===small;if(!ok){const wa=sA!==large,wb=sB!==small;h(wa&&wb?'兩邊都不對。':wa?largeLabel+'歲數不對。':smallLabel+'歲數不對。','找找題目：'+largeLabel+'現在幾歲，'+smallLabel+'現在幾歲？','提示：'+largeLabel+'='+large+'，'+smallLabel+'='+small);}}
      else if(type==='age_sum'&&strat==='age_hecha'){ok=sA===cfg.target;if(!ok)h('積木總數是題目裡說的「未來兩人年齡和」。','幾年後年齡和是幾歲，就拿幾個積木。','提示：積木總數＝'+cfg.target);}
      else if(type==='age_multiple'){ok=sA===difference;if(!ok)h(largeLabel+'比'+smallLabel+'大幾歲？那就是積木數量。',large+'－'+small+'＝？','提示：年齡差＝'+difference);}
      else if(type==='diff_multiple'){ok=sA===difference;if(!ok)h(largeLabel+'比'+smallLabel+'多幾個？那就是積木數量。','題目裡說兩數差多少，那就是積木數量。','提示：差值＝'+difference);}
      else if(type==='ratio_alloc'){ok=sA===poolSize;if(!ok)h(largeLabel+'佔'+cfg.ratioA+'份，'+smallLabel+'佔'+cfg.ratioB+'份，加起來幾份？',cfg.ratioA+'＋'+cfg.ratioB+'＝？份','提示：共'+poolSize+'份積木');}
      else if(type==='chicken_rabbit'){ok=sA===poolSize;if(!ok)h('題目說總共有幾個'+unit+'？','找找題目裡的總個數。','提示：共'+poolSize+'個');}
      if(ok){setSErr('');setPhase('filling');}
    };
    const pm=Math.max(sA,sB,1),pb=pm>BT;
    return(
      <div><h1>🧱 數學積木教具</h1>
        <div className="card">
          <div className="prob">{prob}</div>
          <div className="badge">
            {type==='hecha'&&'第一步：決定積木總數'}
            {type==='perimeter'&&'第一步：決定積木數量（長＋寬）'}
            {type==='transfer_after'&&strat==='transfer'&&'第一步：把兩箱積木各排好'}
            {type==='transfer_after'&&strat==='merge'&&'第一步：把積木全部合在一起'}
            {type==='transfer_before'&&('第一步：排出'+largeLabel+'的積木')}
            {type==='age_sum'&&strat==='age_grow'&&'第一步：排出兩人現在的年齡'}
            {type==='age_sum'&&strat==='age_hecha'&&'第一步：決定積木總數'}
            {type==='age_multiple'&&'第一步：決定積木數量（年齡差）'}
            {type==='diff_multiple'&&'第一步：決定積木數量（差值）'}
            {type==='ratio_alloc'&&'第一步：決定積木總份數'}
            {type==='chicken_rabbit'&&'第一步：排出全部數量'}
          </div>

          {type==='hecha'&&<><div style={{fontSize:15,color:'#555',marginBottom:12}}>兩個數加在一起，要拿幾個積木？</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label="積木總數" color={BLUE} max={500}/>
            {sA>0&&<div className="viz" style={{marginTop:8}}><Row base={sA} label="全部" maxV={sA} bar={sA>BT}/></div>}</>}

          {type==='perimeter'&&<><div style={{fontSize:15,color:'#555',marginBottom:12}}>積木代表長＋寬（不是整條繩子），要拿幾個？</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label="積木數量" color={BLUE} max={500}/>
            {sA>0&&<div className="viz" style={{marginTop:8}}><Row base={sA} label="長＋寬" maxV={sA} bar={sA>BT}/></div>}</>}

          {type==='transfer_after'&&strat==='transfer'&&<><div style={{fontSize:15,color:'#555',marginBottom:12}}>按照題目，把兩箱積木分別排好。</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label={largeLabel+'（'+unit+'）'} color={BLUE} max={300}/>
            <Stepper value={sB} onChange={v=>{setSB(v);setSErr('');}} label={smallLabel+'（'+unit+'）'} color={BLUE} max={300}/>
            {(sA>0||sB>0)&&<div className="viz" style={{marginTop:8}}>
              <Row base={sA} label={largeLabel} maxV={pm} bar={pb}/>
              <Row base={sB} label={smallLabel} maxV={pm} bar={pb}/></div>}</>}

          {type==='transfer_after'&&strat==='merge'&&<><div style={{fontSize:15,color:'#555',marginBottom:12}}>把兩箱的{unit}全部合在一起，共幾個？</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label={'合計（'+unit+'）'} color={BLUE} max={500}/>
            {sA>0&&<div className="viz" style={{marginTop:8}}><Row base={sA} label="全部" maxV={sA} bar={sA>BT}/></div>}</>}

          {type==='transfer_before'&&<><div style={{fontSize:15,color:'#555',marginBottom:12}}>先把{largeLabel}的積木排出來。</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label={largeLabel+'（'+unit+'）'} color={BLUE} max={300}/>
            {sA>0&&<div className="viz" style={{marginTop:8}}><Row base={sA} label={largeLabel} maxV={sA} bar={sA>BT}/></div>}</>}

          {type==='age_sum'&&strat==='age_grow'&&<><div style={{fontSize:15,color:'#555',marginBottom:12}}>把兩人現在的年齡各排一排。</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label={largeLabel+'（'+unit+'）'} color={BLUE} max={200}/>
            <Stepper value={sB} onChange={v=>{setSB(v);setSErr('');}} label={smallLabel+'（'+unit+'）'} color={BLUE} max={200}/>
            {(sA>0||sB>0)&&<div className="viz" style={{marginTop:8}}>
              <Row base={sA} label={largeLabel} maxV={pm} bar={pb}/>
              <Row base={sB} label={smallLabel} maxV={pm} bar={pb}/>
              <div className="pc">現在合計：<span>{sA+sB}</span> {unit}</div></div>}</>}

          {type==='age_sum'&&strat==='age_hecha'&&<><div style={{fontSize:15,color:'#555',marginBottom:12}}>拿「未來兩人年齡和」那麼多積木，要幾個？</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label="積木總數" color={BLUE} max={300}/>
            {sA>0&&<div className="viz" style={{marginTop:8}}><Row base={sA} label="全部" maxV={sA} bar={sA>BT}/></div>}</>}

          {type==='age_multiple'&&<><div style={{fontSize:15,color:'#555',marginBottom:12}}>積木數量是兩人的年齡差，要幾個？</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label="積木數量（年齡差）" color={GREEN} max={200}/>
            {sA>0&&<div className="viz" style={{marginTop:8}}><Row base={sA} label="年齡差" maxV={sA} bar={sA>BT} bc={GREEN}/></div>}</>}

          {type==='diff_multiple'&&<><div className="info">💡 積木代表兩數的差值。把{difference}個積木按倍數關係分份，就能算出各是多少。</div>
            <div style={{fontSize:15,color:'#555',marginBottom:12}}>積木數量是兩數的差，要幾個？</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label="積木數量（差值）" color={GREEN} max={200}/>
            {sA>0&&<div className="viz" style={{marginTop:8}}><Row base={sA} label="差值" maxV={sA} bar={sA>BT} bc={GREEN}/></div>}</>}

          {type==='ratio_alloc'&&<><div className="info">💡 每個積木代表「1份」。{largeLabel}佔{cfg.ratioA}份，{smallLabel}佔{cfg.ratioB}份，兩個份數加起來就是積木總數。</div>
            <div style={{fontSize:15,color:'#555',marginBottom:12}}>積木總共要幾個（份）？</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label="積木總份數" color={BLUE} max={200}/>
            {sA>0&&<div className="viz" style={{marginTop:8}}><Row base={sA} label="總份數" maxV={sA} bar={sA>BT}/></div>}</>}

          {type==='chicken_rabbit'&&<><div className="info">
            {strat==='cr_large'
              ? '💡 假設'+poolSize+'張全是'+largeLabel+'。先排出全部'+poolSize+'張，操作時再從中換成'+smallLabel+'。'
              : '💡 假設'+poolSize+'張全是'+smallLabel+'。先排出全部'+poolSize+'張，操作時再從中換成'+largeLabel+'。'}
          </div>
            <div style={{fontSize:15,color:'#555',marginBottom:12}}>把全部的{unit}排出來，共幾{unit}？</div>
            <Stepper value={sA} onChange={v=>{setSA(v);setSErr('');}} label={'全部（'+unit+'）'} color={BLUE} max={300}/>
            {sA>0&&<div className="viz" style={{marginTop:8}}><Row base={sA} label="全部" maxV={sA} bar={sA>BT}/></div>}</>}

          {sErr&&<div className="warn" style={{marginTop:10}}>🤔 {sErr}</div>}
          <button className="btn-p" style={{marginTop:14}} onClick={chk} disabled={sA===0&&sB===0}>開始操作積木 →</button>
          {['transfer_after','age_sum','chicken_rabbit'].includes(type)&&<button className="btn-s" onClick={()=>{setSErr('');setPhase('strategy');}}>← 換個方法</button>}
          <button className="btn-s" onClick={back}>換一題</button>
        </div>
      </div>
    );
  }

  /* ── FILLING ── */
  if(phase==='filling'){
    const isDM=type==='diff_multiple', isAM=type==='age_multiple';
    const cp=cfg.multiple?cfg.multiple-1:0;
    const cPer=(cp>0&&difference>0)?Math.round(difference/cp):0;
    const mulOK=(isAM||isDM)&&uDif===cp&&uBas===cPer&&(sA-uBas*cp)===0;
    const rem2=(type==='hecha'||type==='perimeter'||(type==='age_sum'&&strat==='age_hecha'))?(sA-(uDif+2*uBas)):null;
    // uA = 換掉的張數；cr_large: largeCount=sA-uA；cr_small: largeCount=uA
    const crLC=type==='chicken_rabbit'?(strat==='cr_large'?sA-uA:uA):0;
    const crSC=type==='chicken_rabbit'?(strat==='cr_large'?uA:sA-uA):0;
    const crV=type==='chicken_rabbit'?(crLC*cfg.valueA+crSC*cfg.valueB):0;
    const crOK=type==='chicken_rabbit'&&crV===cfg.totalValue;

    const chkA=()=>{
      setFErr('');
      if(type==='hecha'||type==='perimeter'){
        const r=sA-(uDif+2*uBas);
        if(+uDif===+difference&&+uBas===+base)setPhase('selectLabel');
        else{if(r!==0)setFErr('積木還沒用完，或用超了！');else setFErr('差值或底數不對，再想想！');}
      }else if(type==='transfer_after'&&strat==='transfer'){
        const a1=large-uMov,a2=small+uMov;
        if(a1===a2){setSolM('transfer');setPhase('correct');}
        else if(a1<a2)setFErr('移太多了，再少移一點。');
        else setFErr(a1-a2<=4?'快到了！再調整看看。':'兩排還不一樣多，繼續調整！');
      }else if(type==='transfer_after'&&strat==='merge'){
        const ok=base+moveAmount;
        if(+uSpl===ok){setSolM('merge');setPhase('correct');}
        else setFErr(uSpl>ok?'每排分太多了，再少一點。':'每排分太少了，再多一點。');
      }else if(type==='transfer_before'){
        const afterEach = large - moveAmount;
        if(uSpl !== afterEach){
          // 第一步：確認移後每人幾個
          if(uSpl === 0) setFErr(largeLabel+'給了'+smallLabel+' '+moveAmount+' '+unit+'後，'+largeLabel+'還剩幾'+unit+'？');
          else if(uSpl > afterEach) setFErr('多了！'+largeLabel+'原來'+large+'，給出'+moveAmount+'後會剩幾個？');
          else setFErr('少了！'+largeLabel+'原來'+large+'，給出'+moveAmount+'後會剩幾個？');
        } else {
          // 第二步：推回小數原來幾個
          if(+uSml===+small) setPhase('correct');
          else setFErr(smallLabel+'移後有'+afterEach+'個，其中'+moveAmount+'個是'+largeLabel+'給的，她原來有幾個？');
        }
      }else if(isAM||isDM){
        if(uDif===0)setFErr('先填差值代表幾份？');
        else if(+uDif!==cp)setFErr('份數不對！'+largeLabel+'是'+smallLabel+'的'+cfg.multiple+'倍，差了幾份？');
        else if(uBas===0)setFErr('份數對了！每份幾個積木？');
        else{
          const r3=sA-uBas*cp;
          if(+uBas===cPer&&r3===0){setPhase('correct');}
          else setFErr(r3<0?'每份太多！再少一點。':'還沒分完！'+difference+'個要剛好分成'+cp+'份。');
        }
      }else if(type==='age_sum'&&strat==='age_grow'){
        const sum=large+small+uMov*2;
        if(sum===cfg.target){setSolM('age_grow');setPhase('correct');}
        else setFErr(sum>cfg.target?'加太多年了，超過目標了！':cfg.target-sum<=4?'快到了！再多加幾年試試。':'年齡和還沒到目標，繼續加！');
      }else if(type==='age_sum'&&strat==='age_hecha'){
        const fS=small+cfg.answer;
        if(+uDif===+difference&&+uBas===fS){setSolM('age_hecha');setPhase('correct');}
        else{const r4=sA-(uDif+2*uBas);setFErr(r4!==0?'積木還沒用完，或用超了！':'排法不對！差值是年齡差，底數是較小那排。');}
      }else if(type==='ratio_alloc'){
        if(uA===cfg.ratioA)setPhase('correct');else setFErr(largeLabel+'和'+smallLabel+'的份數比不對，再調整！');
      }else if(type==='percentage'){
        if(uA===cfg.zoneAPct)setPhase('correct');else setFErr('兩格的%加起來要等於'+poolSize+'%，再對照題目想想各格是幾%。');
      }else if(type==='chicken_rabbit'){
        if(crOK){setSolM(strat);setPhase('correct');}else setFErr('合計還沒對上，繼續調整！');
      }
    };

    const Viz=()=>{
      if(type==='hecha'||type==='perimeter'){
        const r=sA-(uDif+2*uBas);
        return(<div className="viz">
          <Row base={uBas} diff={uDif} label="第一排" maxV={sA} bar={sA>BT}/>
          <Row base={uBas} label="第二排" maxV={sA} bar={sA>BT}/>
          <div className="pc">剩餘積木：<span style={{color:r<0?'#E53935':undefined}}>{r<0?'超出'+(0-r)+'個！':r}</span> / {sA}</div>
        </div>);
      }
      if(type==='transfer_after'&&strat==='transfer'){
        const a1=large-uMov,a2=small+uMov,eq=a1===a2,g1=Math.max(0,difference-uMov),g2=Math.min(uMov,difference);
        return(<div>
          <div style={{textAlign:'center',fontSize:13,color:eq?'#68B34A':'#888',fontWeight:eq?700:400,marginBottom:4}}>{eq?'✔ 兩排一樣長了！':'移動中…'}</div>
          <div className="viz"><Row base={small} diff={g1} label={largeLabel} maxV={large} bar={ub}/><Row base={small} diff={g2} label={smallLabel} maxV={large} bar={ub}/></div>
        </div>);
      }
      if(type==='transfer_after'&&strat==='merge'){
        const tot=large+small,bok=base+moveAmount,ic=uSpl===bok;
        return(<div>
          <div className="viz"><Row base={tot} label="全部" maxV={tot} bar={ub}/></div>
          {uSpl>0&&<><div style={{textAlign:'center',fontSize:13,color:ic?'#68B34A':'#888',fontWeight:ic?700:400,margin:'4px 0'}}>{ic?'✔ 平分後每排'+uSpl+'個！':'平分後每排幾個？'}</div>
          <div className="viz"><Row base={uSpl} label={largeLabel} maxV={tot} bar={ub}/><Row base={uSpl} label={smallLabel} maxV={tot} bar={ub}/></div></>}
        </div>);
      }
      if(type==='transfer_before'){
        const afterEach = large - moveAmount; // 移後每人幾個（正確值）
        const step1OK = uSpl === afterEach;   // 第一步答對了嗎
        // 視覺：丞茗那排先顯示「移前」，綠色部分代表要移出去的 moveAmount
        return(<div>
          {!step1OK ? (<>
            <div style={{textAlign:'center',fontSize:13,color:'#888',marginBottom:4}}>
              {largeLabel}給了{smallLabel} {moveAmount} {unit}後，{largeLabel}還剩幾{unit}？
            </div>
            <div className="viz">
              <Row base={afterEach} diff={moveAmount} label={largeLabel+'（移前）'} maxV={large} bar={ub}/>
            </div>
            <div style={{fontSize:13,color:'#888',marginTop:4,textAlign:'center'}}>
              綠色是移出去的 {moveAmount} {unit}，藍色是{largeLabel}留下的
            </div>
          </>) : (<>
            <div style={{textAlign:'center',fontSize:13,color:'#68B34A',fontWeight:700,marginBottom:8}}>
              ✔ 移後{largeLabel}剩 {afterEach} {unit}，兩人一樣多，{smallLabel}移後也是 {afterEach} {unit}！
            </div>
            <div className="viz">
              <Row base={afterEach} diff={moveAmount} label={largeLabel+'（移前）'} maxV={large} bar={ub}/>
              <Row base={afterEach} label={largeLabel+'（移後）'} maxV={large} bar={ub}/>
              <Row base={afterEach-moveAmount} diff={moveAmount} label={smallLabel+'（移後）'} maxV={large} bar={ub}/>
            </div>
            <div style={{fontSize:13,color:'#555',marginTop:4,textAlign:'center'}}>
              綠色是{largeLabel}給的 {moveAmount} {unit}，{smallLabel}移後 {afterEach} {unit} 裡的藍色才是她原來有的
            </div>
          </>)}
        </div>);
      }
      if(isAM||isDM){
        const pOK=uDif===cp, perOK=pOK&&uBas===cPer&&(sA-uBas*cp)===0;
        return(<div>
          <div className="info">{largeLabel}是{smallLabel}的{cfg.multiple}倍 → 差了{cfg.multiple}－1＝{cp}份，這{difference}個積木代表{cp}份</div>
          {pOK&&<MulViz mul={cfg.multiple} per={uBas} ll={largeLabel} sl={smallLabel} unit={unit}
            topMsg={perOK?'✔ 每份'+uBas+'個！':'把'+sA+'個積木平分成'+cp+'份，每份幾個？'}/>}
          {pOK&&<div className="pc">剩餘：<span style={{color:(sA-uBas*cp)<0?'#E53935':undefined}}>{sA-uBas*cp}</span> / {sA}</div>}
        </div>);
      }
      if(type==='age_sum'&&strat==='age_grow'){
        const fL=large+uMov,fS=small+uMov,fs=fL+fS,rch=fs===cfg.target,bm=Math.max(cfg.target,fL,1),b=bm>BT;
        return(<div>
          <div style={{textAlign:'center',fontSize:13,color:rch?'#68B34A':'#888',fontWeight:rch?700:400,marginBottom:4}}>
            {rch?'✔ 合計剛好'+cfg.target+unit+'！':'目標：合計'+cfg.target+unit+'，現在合計'+(large+small)}</div>
          <div className="viz">
            <Row base={large} diff={uMov} label={largeLabel+'（+'+uMov+'年）'} maxV={bm} bar={b}/>
            <Row base={small} diff={uMov} label={smallLabel+'（+'+uMov+'年）'} maxV={bm} bar={b}/>
            <div className="pc">{uMov}年後合計：<span style={{color:fs>cfg.target?'#E53935':fs===cfg.target?'#68B34A':undefined}}>{fs}</span> / {cfg.target}</div>
          </div>
        </div>);
      }
      if(type==='age_sum'&&strat==='age_hecha'){
        const r=sA-(uDif+2*uBas),ok3=uDif===difference&&uBas===small+cfg.answer;
        return(<div>
          <div style={{textAlign:'center',fontSize:13,color:ok3?'#68B34A':'#888',fontWeight:ok3?700:400,marginBottom:4}}>
            {ok3?'✔ 排好了！':'共'+sA+'個積木：差值（綠）＋兩個底數（藍）＝'+sA}</div>
          <div className="viz">
            <Row base={uBas} diff={uDif} label={largeLabel+'未來'} maxV={sA} bar={sA>BT}/>
            <Row base={uBas} label={smallLabel+'未來'} maxV={sA} bar={sA>BT}/>
            <div className="pc">剩餘：<span style={{color:r<0?'#E53935':undefined}}>{r<0?'超出'+(0-r)+'個！':r}</span> / {sA}</div>
          </div>
        </div>);
      }
      if(type==='ratio_alloc'){
        const uB=sA-uA,ic=uA===cfg.ratioA;
        return(<div>
          <div style={{textAlign:'center',fontSize:13,color:ic?'#68B34A':'#888',fontWeight:ic?700:400,marginBottom:4}}>{ic?'✔ 份數分對了！':'共'+sA+'份積木，試試怎麼分'}</div>
          <div className="viz"><Row base={uA} label={largeLabel+'（份）'} maxV={sA} bar={sA>BT}/><Row base={uB} label={smallLabel+'（份）'} maxV={sA} bar={sA>BT} bc={GREEN}/></div>
        </div>);
      }
      if(type==='percentage'){
        const uB=poolSize-uA,ic=uA===cfg.zoneAPct;
        return(<div>
          <div className="info">每個積木代表 1%。共 {poolSize} 個積木（{poolSize}%）。把積木分成兩格，各代表題目裡的一個百分比。</div>
          <div style={{textAlign:'center',fontSize:13,color:ic?'#68B34A':'#888',fontWeight:ic?700:400,marginBottom:4}}>
            {ic?'✔ 百分比分對了！':cfg.zoneALabel+'和'+cfg.zoneBLabel+'各幾%？'}</div>
          <div className="viz"><Row base={uA} label={cfg.zoneALabel+'（%）'} maxV={poolSize} bar={poolSize>BT}/><Row base={uB} label={cfg.zoneBLabel+'（%）'} maxV={poolSize} bar={poolSize>BT} bc={GREEN}/></div>
        </div>);
      }
      if(type==='chicken_rabbit'){
        // uA = 換掉的張數
        // cr_large: 假設全是大，換 uA 張大→小；largeCount=sA-uA，smallCount=uA
        // cr_small: 假設全是小，換 uA 張小→大；largeCount=uA，smallCount=sA-uA
        const lc=strat==='cr_large'?sA-uA:uA;
        const sc=strat==='cr_large'?uA:sA-uA;
        const curVal=lc*cfg.valueA+sc*cfg.valueB;
        const ic=lc===cfg.countA&&sc===cfg.countB;
        const assumedVal=strat==='cr_large'?sA*cfg.valueA:sA*cfg.valueB;
        const gap=Math.abs(cfg.totalValue-assumedVal);
        const perSwap=Math.abs(cfg.valueA-cfg.valueB);
        return(<div>
          <div className="info" style={{marginBottom:10}}>
            {strat==='cr_large'
              ?'假設'+sA+unit+'全是'+largeLabel+'：'+sA+'×'+cfg.valueA+'＝'+assumedVal+cfg.valueUnit+'，比目標多了'+gap+cfg.valueUnit+'。每把一'+unit+largeLabel+'換成'+smallLabel+'，可以少'+perSwap+cfg.valueUnit+'。試試換掉幾'+unit+'？'
              :'假設'+sA+unit+'全是'+smallLabel+'：'+sA+'×'+cfg.valueB+'＝'+assumedVal+cfg.valueUnit+'，比目標少了'+gap+cfg.valueUnit+'。每把一'+unit+smallLabel+'換成'+largeLabel+'，可以多'+perSwap+cfg.valueUnit+'。試試換掉幾'+unit+'？'}
          </div>
          <div className="viz">
            <Row base={lc} label={largeLabel} maxV={sA} bar={sA>BT}/>
            <Row base={sc} label={smallLabel} maxV={sA} bar={sA>BT} bc={GREEN}/>
          </div>
          <div className="calc">
            <div>{largeLabel}：{lc} × {cfg.valueA} ＝ {lc*cfg.valueA} {cfg.valueUnit}</div>
            <div>{smallLabel}：{sc} × {cfg.valueB} ＝ {sc*cfg.valueB} {cfg.valueUnit}</div>
            <div style={{borderTop:'1px solid #C8E6C9',marginTop:8,paddingTop:8}}>
              合計：<span className={ic?'cm':'cx'}>{curVal} {cfg.valueUnit}</span>{'  '}（目標：{cfg.totalValue} {cfg.valueUnit}）
              {ic&&<span className="cm">  ✔ 可以確認了！</span>}
            </div>
          </div>
        </div>);
      }
      return null;
    };

    return(
      <div><h1>🧱 數學積木教具</h1>
        <div className="card">
          <div className="prob">{prob}</div>
          <div className="badge">第二步：操作積木</div>
          <Viz/>
          {(type==='hecha'||type==='perimeter')&&<>
            <Stepper value={uDif} onChange={setUDif} label="差值（綠色）" color={GREEN} max={sA}/>
            <Stepper value={uBas} onChange={setUBas} label="底數（藍色）" color={BLUE} max={sA}/></>}
          {type==='transfer_after'&&strat==='transfer'&&<Stepper value={uMov} onChange={setUMov} label={'從'+largeLabel+'移到'+smallLabel} color={GREEN} max={large}/>}
          {type==='transfer_after'&&strat==='merge'&&<Stepper value={uSpl} onChange={setUSpl} label="每排幾個" color={BLUE} max={large+small}/>}
          {type==='transfer_before'&&<>
            {uSpl !== large-moveAmount
              ? <Stepper value={uSpl} onChange={v=>{setUSpl(v);setFErr('');}} label={largeLabel+'給出後，各有幾'+unit+'？'} color={BLUE} max={large}/>
              : <Stepper value={uSml} onChange={v=>{setUSml(v);setFErr('');}} label={smallLabel+'原來有幾'+unit+'？'} color={GREEN} max={large}/>}
          </>}
          {(isAM||isDM)&&<>
            <Stepper value={uDif} onChange={v=>{setUDif(v);setFErr('');}} label="差值代表幾份？" color={GREEN} max={cfg.multiple*2}/>
            {uDif===cp&&<Stepper value={uBas} onChange={v=>{setUBas(v);setFErr("");}} label="每份幾個積木？" color={BLUE} max={sA}/>}</>}
          {type==='age_sum'&&strat==='age_grow'&&<Stepper value={uMov} onChange={setUMov} label={'幾'+cfg.timeUnit+'後'} color={GREEN} max={cfg.target*2}/>}
          {type==='age_sum'&&strat==='age_hecha'&&<>
            <Stepper value={uDif} onChange={setUDif} label="年齡差（綠色）" color={GREEN} max={sA}/>
            <Stepper value={uBas} onChange={setUBas} label="底數（藍色）" color={BLUE} max={sA}/></>}
          {type==='ratio_alloc'&&<Stepper value={uA} onChange={v=>{setUA(v);setFErr('');}} label={largeLabel+'（份數）'} color={BLUE} min={0} max={sA}/>}
          {type==='percentage'&&<Stepper value={uA} onChange={v=>{setUA(v);setFErr('');}} label={cfg.zoneALabel+'（%）'} color={BLUE} min={0} max={poolSize}/>}
          {type==='chicken_rabbit'&&<Stepper value={uA} onChange={v=>{setUA(v);setFErr('');}}
            label={strat==='cr_large' ? '換掉幾'+unit+largeLabel+'（換成'+smallLabel+'）' : '換掉幾'+unit+smallLabel+'（換成'+largeLabel+'）'}
            color={GREEN} min={0} max={sA}/>}
          {fErr&&<div className="err">{fErr}</div>}
          <button className="btn-p" onClick={chkA} style={{marginTop:14}}
            disabled={(rem2!==null&&rem2!==0)||((isAM||isDM)&&!mulOK)||(type==='chicken_rabbit'&&!crOK)}>
            ✅ 確認答案
          </button>
          <button className="btn-s" onClick={()=>{setFErr('');
            if(type==='percentage')setUA(0);
            else if(type==='chicken_rabbit')setPhase('strategy');
            else setPhase('setup');}}>← 重新排積木</button>
          <button className="btn-s" onClick={back}>換一題</button>
        </div>
      </div>
    );
  }

  /* ── SELECT LABEL ── */
  if(phase==='selectLabel'){
    const sel=w=>{if(w===largeLabel){setWSel(false);setPhase('correct');}else setWSel(true);};
    return(
      <div><h1>🧱 數學積木教具</h1>
        <div className="card">
          <div className="prob">{prob}</div>
          <div className="viz"><Row base={uBas} diff={uDif} label="第一排" maxV={sA} bar={sA>BT}/><Row base={uBas} label="第二排" maxV={sA} bar={sA>BT}/></div>
          <div style={{fontSize:17,fontWeight:600,color:'#333',textAlign:'center',marginBottom:14}}>哪一排比較多？</div>
          <div className="selw">
            <button className={'selb'+(wSel?' wrong':'')} onClick={()=>sel(largeLabel)}>{largeLabel}</button>
            <button className={'selb'+(wSel?' wrong':'')} onClick={()=>sel(smallLabel)}>{smallLabel}</button>
          </div>
          {wSel&&<div className="err" style={{marginTop:10}}>再想想！題目說誰比較多？</div>}
        </div>
      </div>
    );
  }

  /* ── CORRECT / EXPLAINING ── */
  if(phase==='correct'||phase==='explaining'){
    const isTA=type==='transfer_after',isAS=type==='age_sum',isAM=type==='age_multiple';
    const isDM=type==='diff_multiple',isRA=type==='ratio_alloc',isPct=type==='percentage',isCR=type==='chicken_rabbit';
    const has2M=isTA||isAS||isCR;
    const aAns=cfg.answer,tUnit=cfg.timeUnit,mul=cfg.multiple;

    const VC=()=>{
      if(isTA){const ev=base+moveAmount;return(<div>
        <div style={{textAlign:'center',fontSize:13,color:'#68B34A',fontWeight:700,marginBottom:4}}>移動後 ✔</div>
        <div className="viz"><Row base={ev} label={largeLabel} maxV={large} bar={ub}/><Row base={ev} label={smallLabel} maxV={large} bar={ub}/></div>
        <div style={{textAlign:'center',fontSize:13,color:'#68B34A',fontWeight:700,marginTop:4}}>兩排一樣！各 {ev} {unit}</div>
      </div>);}
      if(isAS){const fL=large+aAns,fS=small+aAns,bm=Math.max(cfg.target,fL,1);return(<div>
        <div style={{textAlign:'center',fontSize:13,color:'#68B34A',fontWeight:700,marginBottom:4}}>{aAns} {tUnit}後 ✔</div>
        <div className="viz">
          <Row base={large} diff={aAns} label={largeLabel+'（'+fL+unit+'）'} maxV={bm} bar={bm>BT}/>
          <Row base={small} diff={aAns} label={smallLabel+'（'+fS+unit+'）'} maxV={bm} bar={bm>BT}/>
          <div className="pc">合計：<span>{fL+fS}</span> {unit} ✔</div>
        </div>
      </div>);}
      if(isAM){const fS=small+aAns,fL=large+aAns;return(<div>
        <div style={{textAlign:'center',fontSize:13,color:'#68B34A',fontWeight:700,marginBottom:8}}>{aAns} {tUnit}後 ✔</div>
        <MulViz mul={mul} per={fS} ll={largeLabel} sl={smallLabel} unit={unit} topMsg="答對！"/>
        <div style={{textAlign:'center',fontSize:15,color:'#68B34A',fontWeight:700,marginTop:4}}>{fL} ÷ {fS} ＝ {mul}，剛好是 {mul} 倍 ✔</div>
      </div>);}
      if(isDM){return(<div>
        <MulViz mul={mul} per={small} ll={largeLabel} sl={smallLabel} unit={unit} topMsg="答對！"/>
        <div style={{textAlign:'center',fontSize:15,color:'#68B34A',fontWeight:700,marginTop:4}}>{large} ÷ {small} ＝ {mul}，{large} － {small} ＝ {difference} ✔</div>
      </div>);}
      if(isRA){const ps=cfg.totalAmount/poolSize;return(<div>
        <div className="viz"><Row base={cfg.ratioA} label={largeLabel+'（'+cfg.ratioA+'份）'} maxV={poolSize} bar={poolSize>BT}/><Row base={cfg.ratioB} label={smallLabel+'（'+cfg.ratioB+'份）'} maxV={poolSize} bar={poolSize>BT} bc={GREEN}/></div>
        <div className="calc"><div>每份 ＝ {cfg.totalAmount} ÷ {poolSize} ＝ {ps} {unit}</div><div>{largeLabel} ＝ {ps} × {cfg.ratioA} ＝ <strong>{cfg.answerA} {unit}</strong></div><div>{smallLabel} ＝ {ps} × {cfg.ratioB} ＝ <strong>{cfg.answerB} {unit}</strong></div></div>
      </div>);}
      if(isPct){return(<div>
        <div className="viz"><Row base={cfg.zoneAPct} label={cfg.zoneALabel+'（'+cfg.zoneAPct+'%）'} maxV={poolSize} bar={poolSize>BT}/><Row base={cfg.zoneBPct} label={cfg.zoneBLabel+'（'+cfg.zoneBPct+'%）'} maxV={poolSize} bar={poolSize>BT} bc={GREEN}/></div>
        <div className="calc"><div>已知：{cfg.knownAmount} {unit} 對應 {cfg.knownPct}%</div><div>答案 ＝ {cfg.knownAmount} ÷ {cfg.knownPct} × {cfg.unknownPct} ＝ <strong>{cfg.unknownAmount} {unit}</strong></div></div>
      </div>);}
      if(isCR){return(<div>
        <div className="viz"><Row base={cfg.countA} label={largeLabel} maxV={poolSize} bar={poolSize>BT}/><Row base={cfg.countB} label={smallLabel} maxV={poolSize} bar={poolSize>BT} bc={GREEN}/></div>
        <div className="calc"><div>{largeLabel}：{cfg.countA} × {cfg.valueA} ＝ {cfg.countA*cfg.valueA} {cfg.valueUnit}</div><div>{smallLabel}：{cfg.countB} × {cfg.valueB} ＝ {cfg.countB*cfg.valueB} {cfg.valueUnit}</div><div className="cm">合計：{cfg.totalValue} {cfg.valueUnit} ✔</div></div>
      </div>);}
      if(isTB){return(<div>
        <div style={{textAlign:'center',fontSize:13,color:'#68B34A',fontWeight:700,marginBottom:8}}>答對了 ✔</div>
        <div className="viz">
          <Row base={tbAfter} diff={moveAmount} label={largeLabel+'（移前 '+large+'）'} maxV={large} bar={ub}/>
          <Row base={tbAfter} label={largeLabel+'（移後 '+tbAfter+'）'} maxV={large} bar={ub}/>
          <Row base={small} diff={moveAmount} label={smallLabel+'（移後 '+tbAfter+'）'} maxV={large} bar={ub}/>
          <Row base={small} label={smallLabel+'（原來 '+small+'）'} maxV={large} bar={ub}/>
        </div>
        <div style={{textAlign:'center',fontSize:13,color:'#888',marginTop:2}}>綠色＝{largeLabel}給的 {moveAmount} 個，藍色才是{smallLabel}原來有的</div>
      </div>);}
      return(<div className="viz"><Row base={base} diff={difference} label={largeLabel} maxV={large} bar={ub}/><Row base={base} label={smallLabel} maxV={large} bar={ub}/></div>);
    };

    /* transfer_before 答對後的推導框 */
    const isTB = type==='transfer_before';
    const tbAfter = isTB ? large - moveAmount : 0;

    return(
      <div><h1>🧱 數學積木教具</h1>
        <div className="card">
          <div className="prob">{prob}</div>
          <VC/>
          {isTA&&<div className="mans">🎉 {largeLabel}要移 <span style={{color:'#D4690A'}}>{moveAmount}</span> 個{unit}到{smallLabel}！</div>}
          {isAS&&<div className="mans">🎉 <span style={{color:'#D4690A'}}>{aAns}</span> {tUnit}後，兩人年齡和是 {cfg.target} {unit}！</div>}
          {isAM&&<div className="mans">🎉 <span style={{color:'#D4690A'}}>{aAns}</span> {tUnit}後，{largeLabel}是{smallLabel}的 {mul} 倍！</div>}
          {(isDM||isRA)&&<div className="abox">
            <div className="ar"><span style={{color:'#555'}}>{largeLabel}</span><span className="av">{large} {unit}</span></div>
            <div className="ar"><span style={{color:'#555'}}>{smallLabel}</span><span className="av">{small} {unit}</span></div>
          </div>}
          {isPct&&<div className="mans">🎉 答案：<span style={{color:'#D4690A'}}>{cfg.unknownAmount}</span> {unit}</div>}
          {isCR&&<div className="abox">
            <div className="ar"><span style={{color:'#555'}}>{largeLabel}</span><span className="av">{cfg.countA} 個</span></div>
            <div className="ar"><span style={{color:'#555'}}>{smallLabel}</span><span className="av">{cfg.countB} 個</span></div>
          </div>}
          {!isTA&&!isAS&&!isAM&&!isDM&&!isRA&&!isPct&&!isCR&&!isTB&&<div className="abox">
            <div className="ar"><span style={{color:'#555'}}>{largeLabel}</span><span className="av">{large} {unit}</span></div>
            <div className="ar"><span style={{color:'#555'}}>{smallLabel}</span><span className="av">{small} {unit}</span></div>
          </div>}
          {isTB&&<>
            <div className="abox">
              <div className="ar"><span style={{color:'#555'}}>{smallLabel}原來有</span><span className="av">{small} {unit}</span></div>
            </div>
            <div style={{textAlign:'center',fontSize:14,color:'#2E7D32',fontWeight:700,padding:'8px 0'}}>
              算式：{large} － {moveAmount} － {moveAmount} ＝ {small}，即 {large} － {moveAmount}×2 ＝ {small}
            </div>
          </>}
          {has2M&&phase==='correct'&&!altD&&<div className="altc">
            <div style={{fontSize:15,fontWeight:700,color:'#333',marginBottom:6}}>💪 答對了！</div>
            <div style={{fontSize:14,color:'#666',marginBottom:12}}>還有另一種解法，想挑戰看看嗎？</div>
            <button className="btn-p" style={{marginTop:0}} onClick={tryAlt}>🔁 試試另一種解法</button>
          </div>}
          {has2M&&phase==='correct'&&altD&&<div className="hint" style={{marginBottom:12}}>🌟 你兩種方法都試過了！來看看完整解說吧。</div>}
          {phase==='explaining'&&expl
            ?<div className="expl">{expl}</div>
            :<button className="btn-p" onClick={getExpl} disabled={loadX}>{loadX?'⏳ 載入中…':'📝 查看解題說明'}</button>}
          <button className="btn-s" onClick={back}>換一題</button>
        </div>
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
